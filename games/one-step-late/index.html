    const data = readStore();
    const saved = Array.isArray(data.days[day]) ? data.days[day] : [];
    S.streak = Number(data.streak) || 0;
    S.bestStreak = Number(data.best) || 0;
    S.lastFull = Number(data.lastFull) || 0;
    S.freezeUsedDay = cleanFreezeUsedDay(Number(data.freezeUsedDay) || 0);
    // Seen means what the store holds: a day opened from an unsaved snapshot
    // must still tell its own positions from another tab's later save.
    const stored = unsaved ? parseStore(unsavedBase).days[day] : saved;
    const pathOf = (entries, tier) => (Array.isArray(entries) && entries[tier] && typeof entries[tier].i === 'string' ? entries[tier].i : null);
    S.seen = TIERS.map((_, tier) => pathOf(stored, tier));
    // A snapshot board the store does not hold is a change not yet saved.
    S.dirty = TIERS.map((_, tier) => boardKey(saved, tier) !== boardKey(stored, tier));
    S.runs = S.puzzles.map((p, tier) => {
      const entry = saved[tier] || {};
      const path = digits(entry.i);
      const solvedMoves = Number(entry.s) || 0;
      return { inputs: path, moves: Math.max(Number(entry.m) || 0, path.length), solved: solvedMoves > 0, solvedMoves };
    });
    const firstOpen = S.runs.findIndex((r) => !r.solved);
    selectTier(firstOpen < 0 ? 0 : firstOpen);
  }

  // What the thumbnail and the social card show (D-025): a board from the game's
  // own generator, part-way along its par line. Easy is solved at par, Medium is
  // seven moves in with you beside the sun and your shadow a step behind, Hard
  // is untouched. The day is fixed and never printed, the clock and the store
  // are not asked, and nothing moves: the same picture on any date.
  const POSE = { day: 764, tier: 1, inputs: '2230333' };

  function posePicture() {
    S.day = S.today = POSE.day;
    S.puzzles = TIERS.map((_, tier) => makePuzzle(POSE.day, tier));
    S.runs = S.puzzles.map((p, tier) => {
      const inputs = tier === POSE.tier ? digits(POSE.inputs) : [];
      const solvedMoves = tier < POSE.tier ? p.par : 0;
      return { inputs, moves: solvedMoves || inputs.length, solved: solvedMoves > 0, solvedMoves };
    });
    S.dirty = TIERS.map(() => false);
    S.seen = TIERS.map(() => null);
    selectTier(POSE.tier);
    S.mode = 'play';
  }

  function selectTier(tier) {
    S.tier = tier;
    S.practice = false;
    S.demo = null;
    S.fall = null;
    S.floats = [];
    S.parts = [];
    S.flash = 0;
    S.shake = 0;
    const p = puzzle();
    const state = replay(p, run().inputs);
    run().inputs = state.inputs;
    if (run().solved && !(state.you === p.sun && state.shadow === p.moon)) placeActors(p.sun, p.moon, -1);
    else placeActors(state.you, state.shadow, state.last);
  }

  function placeActors(you, shadow, last) {
    S.you = you; S.shadow = shadow; S.last = last;
    S.youAnim = slide(you, you);
    S.shadowAnim = slide(shadow, shadow);
  }

  // `start` once per unsolved puzzle per page load, however the player got to
  // it. Looking at a finished board again is not starting it.
  function markStart() {
    const key = `${S.day}:${S.tier}`;
    if (run().solved || started.has(key)) return;
    started.add(key);
    emit('start', { game: SLUG, day: S.day, tier: S.tier + 1, archive: archive() });
  }

  /**
   * The calendar moved on. Today's puzzles follow it; an archive day stays where
   * the player put it, and only the newest reachable day moves. Answers whether
   * a new day was loaded.
   */
  function followToday() {
    const today = dayNumber(new Date());
    if (today === S.today) return false;
    if (S.day !== S.today) { S.today = today; return false; }
    loadDay(today);
    return true;
  }

  function checkDay() {
    if (PICTURE || dayNumber(new Date()) === S.today) return; // the posed board belongs to no day
    // A new day changes the screen with no event to say so, but only once: mid-puzzle
    // S.today stays behind on purpose, and this check comes round every five seconds.
    // Mid-puzzle on today's board, nothing is pulled away: it says so once.
    if (S.mode === 'play' && S.day === S.today) {
      if (!S.newDay) {
        invalidate();
        S.newDay = true;
        toast(touch() ? 'New puzzles are out. Tap the home button.' : 'New puzzles are out. Press Esc.');
      }
      return;
    }
    invalidate(); // followToday() catches S.today up, so this runs once a day too
    followToday();
  }

  /** The previous or next day, from the title or mid-puzzle: it opens on that day's title screen. */
  function stepDay(delta) {
    const target = S.day + delta;
    if (target < 1 || target > dayNumber(new Date())) {
      sfx.bump();
      announce(target < 1 ? 'Day 1 is the first day.' : 'This is today. New puzzles come at midnight.');
      return;
    }
    S.mode = 'title';
    S.help = false;
    S.toast = null;
    loadDay(target);
    sfx.click();
    announce(titleSummary());
  }

  // ---- game flow ----
  function startPlay(tier) {
    ensureAudio();
    followToday();
    if (tier !== undefined && tier !== S.tier) selectTier(tier);
    S.mode = 'play';
    S.help = false;
    S.toast = null;
    sfx.click();
    markStart();
    announce(`Day ${S.day}, ${TIERS[S.tier].label} puzzle, par ${puzzle().par}. ${describeBoard()}`);
    reportFocus();
  }

  function goTitle() {
    S.mode = 'title';
    S.demo = null;
    S.help = false;
    S.practice = false;
    if (!followToday()) selectTier(S.tier);
    sfx.click();
    announce(titleSummary());
  }

  function move(dir) {
    if (S.mode !== 'play' || S.demo || S.fall) return;
    S.help = false;
    const wasSolved = run().solved;
    sync(); // another tab may have moved on, or solved this one
    if (run().solved && !wasSolved) return; // its notice is on screen; this key press is not a move
    if (locked()) {
      toast(touch() ? 'Solved. Tap Replay to practise it, or Next.' : 'Solved. R replays it for practice, N moves on.');
      sfx.bump();
      return;
    }
    ensureAudio();
    const p = puzzle();
    const r = turn(p.board, S.you, S.shadow, S.last, dir);
    const blocked = r.you === S.you;
    const moved = !blocked || r.shadow !== S.shadow;
    // The portal cannot see the board. Each counted move tells it how far this
    // puzzle has got, so a player who leaves unfinished leaves a number behind;
    // the portal keeps it to itself until then. Practice is not progress.
    if (S.practice) S.practiceMoves++;
    else { run().moves++; emit('progress', { moves: run().moves, tier: S.tier + 1, day: S.day, archive: archive() }); }
    touchTier();

    S.youAnim = blocked ? { from: S.you, to: S.you, t: 1, bump: dir, bt: 0 } : slide(S.you, r.you);
    if (blocked) sfx.bump(); else sfx.step();
    if (S.last >= 0) {
      if (r.shadow === S.shadow) S.shadowAnim = { from: S.shadow, to: S.shadow, t: 1, bump: S.last, bt: -SHADOW_DELAY / STEP_TIME };
      else { S.shadowAnim = { ...slide(S.shadow, r.shadow), t: -SHADOW_DELAY / STEP_TIME }; sfx.echo(); }
    }

    if (r.fell) {
      // Both moves stay counted: the lesson is the point, and the score is
      // honest about it. The rewind itself lives in the core (resolveFall).
      const back = resolveFall(p, history());
      setHistory(back.inputs);
      S.fall = { t: 0, back };
      S.you = r.you; S.shadow = r.shadow; S.last = dir;
      // Saved now, not after the animation: closing the tab mid-fall must not refund the move.
      if (!S.practice) writeStore();
      if (!S.fall) return; // the save found this puzzle solved in another tab, and said so
      sfx.fall();
      shake(6);
      float(cx(r.shadow), cy(r.shadow) - 22, 'fell', C.bad);
      announce(`Your shadow fell into a hole. The move that sent it there is taken back; both moves still count. ${describePieces(back)}`);
      return;
    }

    S.you = r.you; S.shadow = r.shadow; S.last = dir;
    history().push(dir);
    // The winning move is saved once, by solvedNow, with its result: saving the
    // position first told another tab "pieces on the goals, unsolved".
    // A practice board can stay on the goals; only a move that arrives finishes.
    if (moved && S.you === p.sun && S.shadow === p.moon) { solvedNow(); return; }
    if (!S.practice) {
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
    }
    if (doomed(p.board, S.shadow, S.last)) sfx.warn();
    announce(`${blocked ? 'Blocked. ' : ''}${describePieces(S)}`);
  }

  function finishFall() {
    const { back } = S.fall;
    const was = S.you;
    S.fall = null;
    S.you = back.you; S.shadow = back.shadow; S.last = back.last;
    S.youAnim = slide(was, back.you);
    // The shadow reappears where it stood before the move that aimed it at the hole.
    S.shadowAnim = { from: back.shadow, to: back.shadow, t: 0, bump: -1, bt: 1 };
    sync(); // anything another tab saved during the fall was held back until now
  }

  function celebrate(p) {
    sfx.win();
    if (!calm()) S.flash = 0.5;
    spawnParts(cx(p.sun), cy(p.sun), C.gold, 26, 220);
    spawnParts(cx(p.moon), cy(p.moon), C.lilac, 26, 220);
  }

  function solvedNow() {
    const p = puzzle();
    if (S.practice) {
      celebrate(p);
      const over = S.practiceMoves - p.par;
      toast(`Practice solved in ${S.practiceMoves}. ${over <= 0 ? 'Par!' : `${over} over par.`}`);
      return;
    }
    // Another tab may have solved this puzzle, or finished the day, a moment
    // ago. Its result stands, and it has already reported it.
    absorb(readStore());
    const r = run();
    if (r.solved) { writeStore(); return; } // the other tab's result and notice stand
    r.solved = true;
    r.solvedMoves = r.moves;
    // The save merges once more; if the store already held a solve of this
    // puzzle, that win was reported by its own tab and stands.
    if (writeStore()) return;
    celebrate(p);
    const over = r.solvedMoves - p.par;
    emit('gameover', { won: true, score: r.solvedMoves, par: p.par, tier: S.tier + 1, day: S.day, archive: archive(), streak: liveStreak() });
    const allDone = solvedCount() === TIERS.length;
    toast(`${over <= 0 ? 'Par! A star.' : `Solved, ${over} over par.`} ${allDone ? 'All three done.' : 'Next when ready.'}`);
  }

  function undo() {
    if (S.mode !== 'play' || S.demo || S.fall) return;
    sync();
    if (locked()) { announce('This puzzle is solved; undo is off. Replay it to practise.'); return; }
    const h = history();
    if (!h.length) { sfx.bump(); return; }
    const state = replay(puzzle(), h.slice(0, -1));
    setHistory(state.inputs);
    touchTier();
    const was = { you: S.you, shadow: S.shadow };
    S.you = state.you; S.shadow = state.shadow; S.last = state.last;
    S.youAnim = slide(was.you, state.you);
    S.shadowAnim = slide(was.shadow, state.shadow);
    if (!S.practice) {
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
    }
    sfx.undo();
    announce(`Undone. ${describePieces(S)}`);
  }

  function restart() {
    if (S.mode !== 'play' || S.fall) return;
    S.demo = null;
    const wasSolved = run().solved;
    sync(); // decides between a fresh start and practice, so it must know about other tabs
    if (run().solved && !wasSolved) return; // solved in another tab just now; that is news, not a practice request
    const p = puzzle();
    if (run().solved) {
      // A solved puzzle stays solved. Replaying it is practice, scored apart.
      // Unlike echo-sounding, run() here never swaps to a separate practice
      // record, so run().solved stays true for the rest of the practice
      // session: without this check, re-rolling mid-practice (the R key/
      // button work at any time) would emit `practice` again on every click.
      const enteringPractice = !S.practice;
      S.practice = true;
      S.practiceMoves = 0;
      S.practiceInputs = [];
      if (enteringPractice) emit('practice', { tier: S.tier + 1, day: S.day, archive: archive() });
      toast('Practice run. Your result is already saved.');
    } else {
      run().inputs = [];
      touchTier();
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
      toast(`Back to the start. The ${run().moves} moves so far still count.`);
    }
    const was = { you: S.you, shadow: S.shadow };
    S.you = p.you; S.shadow = p.shadow; S.last = -1;
    S.youAnim = slide(was.you, p.you);
    S.shadowAnim = slide(was.shadow, p.shadow);
    sfx.undo();
  }

  function nextPuzzle() {
    if (S.mode !== 'play') return;
    const open = [1, 2].map((k) => (S.tier + k) % TIERS.length).find((t) => !S.runs[t].solved);
    if (open === undefined) { goTitle(); return; }
    setTier(open);
  }

  function setTier(tier) {
    if (S.mode !== 'play' || S.fall || tier === S.tier) return;
    selectTier(tier);
    S.toast = null; // "solved" belongs to the puzzle just left
    sfx.click();
    markStart();
    announce(`${TIERS[tier].label} puzzle, par ${puzzle().par}. ${describeBoard()}`);
    reportFocus();
  }

  function showBestLine() {
    if (S.mode !== 'play' || S.fall) return;
    const wasSolved = run().solved;
    sync();
    if (run().solved && !wasSolved) return; // solved in another tab just now; its notice comes first
    // Only from a finished board: in a practice run this would throw the run away.
    if (!locked()) { announce(run().solved ? 'Leave the practice run (switch puzzle or go home) to see the par line.' : 'The par line opens once this puzzle is solved.'); return; }
    const { path } = solve(puzzle(), true);
    if (!path) return;
    placeActors(puzzle().you, puzzle().shadow, -1);
    S.help = false; // the rules panel would hide the whole demonstration
    S.demo = { path, i: 0, t: 0.4 };
    const spoken = `The par line: ${path.map((d) => DIR_NAMES[d]).join(', ')}.`;
    // In the compact shape the strip above the board already says it.
    if (L.heading) toast('Watch the par line.', spoken); else { S.toast = null; announce(spoken); }
  }

  function stepDemo() {
    const d = S.demo;
    const dir = d.path[d.i++];
    const r = turn(puzzle().board, S.you, S.shadow, S.last, dir);
    S.youAnim = r.you === S.you ? { from: S.you, to: S.you, t: 1, bump: dir, bt: 0 } : slide(S.you, r.you);
    if (S.last >= 0) {
      S.shadowAnim = r.shadow === S.shadow
        ? { from: S.shadow, to: S.shadow, t: 1, bump: S.last, bt: -SHADOW_DELAY / STEP_TIME }
        : { ...slide(S.shadow, r.shadow), t: -SHADOW_DELAY / STEP_TIME };
    }
    S.you = r.you; S.shadow = r.shadow; S.last = dir;
    sfx.step();
    if (d.i >= d.path.length) {
      S.demo = null;
      spawnParts(cx(S.you), cy(S.you), C.gold, 14);
      spawnParts(cx(S.shadow), cy(S.shadow), C.lilac, 14);
    }
  }

  function toggleMute() {
    S.muted = !S.muted;
    storage.set(STORE_MUTE, S.muted ? '1' : '0');
    if (S.muted) { if (audio) audio.suspend().catch(() => {}); }
    else { ensureAudio(); sfx.click(); }
    toast(S.muted ? 'Sound off' : 'Sound on');
  }

  // ---- onward ----
  // One count per decision. A second press while a slow phone is still opening
  // the next page is the same decision: it leaves again, but is not counted
  // again, or the one number this button exists to produce would be inflated.
  let countedAt = -Infinity;
  function countOnward() {
    const now = performance.now();
    if (now - countedAt < 10000) return;
    countedAt = now;
    emit('next_game', { day: S.day });
  }

  // The portal's sensor hears of this by message, and a message runs as a task
  // on the parent page: navigating on the same tick can unload that page first,
  // losing the count. A tenth of a second is less than a tap takes to feel slow.
  function goOnward() {
    if (!ONWARD || !onward()) return;
    sfx.click();
    countOnward();
    setTimeout(() => onwardLink.click(), 100);
  }

  // ---- sharing ----
  // Only a share of today's puzzle carries a friend code: an archive share
  // names a day the recipient's own tab is not showing (decodeFriendCode
  // checks against the recipient's calendar day, not the sharer's), so a code
  // attached to one would silently never match anybody's screen (D-052).
  function shareUrl(marks) {
    return archive() ? SHARE_BASE : `${SHARE_BASE}&f=${encodeURIComponent(encodeFriendCode(S.day, marks))}`;
  }
  function shareText() {
    const marks = S.runs.map((r, t) => shareMark(r.solved ? r.solvedMoves : 0, S.puzzles[t].par));
    // An archive day says so: "#3" posted on day 10 otherwise reads as played on the day.
    return `One Step Late #${S.day}${archive() ? ' (archive)' : ''}\n${marks.join('  ')}\n${shareUrl(marks)}`;
  }

  // `share` is reported only once the text really left: a cancelled sheet or a
  // refused clipboard is not a share, and this number is the growth loop.
  const shared = () => emit('share', { day: S.day, score: solvedCount() });
  let manualCopyCounted = false, focusBeforeCopy = null;
  const countCopy = () => { if (!manualCopyCounted) { manualCopyCounted = true; shared(); } };

  function share() {
    sync();
    if (!solvedCount()) { toast('Solve a puzzle first, then share it.'); return; }
    const message = shareText();
    // A phone gets the system share sheet; a desktop gets the clipboard, which is
    // what people there paste from. Either call has to run inside this gesture.
    if (touch() && navigator.share) {
      try {
        navigator.share({ text: message }).then(() => { shared(); toast('Shared'); }, (err) => {
          if (!err || err.name !== 'AbortError') copy(message);
        });
        return;
      } catch { /* some webviews throw instead of rejecting: copy instead */ }
    }
    copy(message);
  }

  function copy(message) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(message).then(() => { shared(); toast('Result copied. Paste it anywhere.'); }, () => openCopyBox(message));
        return;
      }
    } catch { /* fall through to the manual box */ }
    openCopyBox(message);
  }

  function openCopyBox(message) {
    copyText.value = message;
    if (copyBox.classList.contains('open')) return; // a second press while it is up
    manualCopyCounted = false;
    pressedBackdrop = releasedBackdrop = false;
    focusBeforeCopy = document.activeElement;
    copyBox.classList.add('open');
    // aria-modal only promises; inert keeps clicks and focus off the game behind it.
    canvas.inert = true;
    controls.inert = true;
    copyText.focus();
    copyText.setSelectionRange(0, message.length);
    try {
      if (document.execCommand('copy')) {
        countCopy();
        closeCopyBox();
        toast('Result copied. Paste it anywhere.');
      }
    } catch { /* the box stays open for a manual copy */ }
  }

  function closeCopyBox() {
    copyBox.classList.remove('open');
    canvas.inert = false;
    controls.inert = false;
    // Back to whatever opened it: the Share button in the controls, or the board.
    const back = focusBeforeCopy instanceof HTMLElement && focusBeforeCopy !== document.body ? focusBeforeCopy : canvas;
    back.focus({ preventScroll: true });
  }

  // A copy made by hand from the box is a share too; closing the box is not.
  copyText.addEventListener('copy', countCopy);
  copyClose.addEventListener('click', closeCopyBox);
  // The backdrop closes the dialog only when pressed and released on it: a text
  // selection dragged out of the box ends with a click on the backdrop too.
  // The release is checked where the pointer really is: a touch keeps the target
  // it started on even when the finger ends on the card.
  let pressedBackdrop = false, releasedBackdrop = false;
  // A press on the backdrop would take focus out of the dialog (and the
  // selection with it); only a full click on the backdrop leaves.
  copyBox.addEventListener('mousedown', (event) => { if (event.target === copyBox) event.preventDefault(); });
  copyBox.addEventListener('pointerdown', (event) => { pressedBackdrop = event.button === 0 && event.target === copyBox; });
  copyBox.addEventListener('pointerup', (event) => {
    releasedBackdrop = event.button === 0 && document.elementFromPoint(event.clientX, event.clientY) === copyBox;
  });
  copyBox.addEventListener('click', () => {
    const both = pressedBackdrop && releasedBackdrop;
    pressedBackdrop = releasedBackdrop = false;
    if (both) closeCopyBox();
  });
  copyBox.addEventListener('keydown', (event) => {
    // Handled here and stopped: on its way up to the window this Escape used to
    // find the dialog already closed and send the player to the title screen.
    event.stopPropagation();
    if (event.key === 'Escape') { event.preventDefault(); closeCopyBox(); return; }
    // aria-modal promises that focus stays here.
    if (event.key === 'Tab') {
      event.preventDefault();
      (document.activeElement === copyText ? copyClose : copyText).focus();
    }
  });

  // ---- update ----
  function update(dt) {
    S.clock += dt;
    // The ambient motion comes up over half a second after an input and settles over one.
    S.lively = Math.max(0, S.lively - dt);
    const want = S.lively > 0 && !calm() ? 1 : 0;
    S.stir = want > S.stir ? Math.min(want, S.stir + dt * 2) : Math.max(want, S.stir - dt);
    // The sun's rays turn with it, slowing to a stop as it settles.
    S.turn += dt * 0.4 * S.stir;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 24);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
    for (const a of [S.youAnim, S.shadowAnim]) {
      if (a.t < 1) a.t = Math.min(1, a.t + dt / STEP_TIME);
      if (a.bt < 1) a.bt = Math.min(1, a.bt + dt / 0.16);
    }
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.t += dt;
      if (p.t >= p.life) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.93; p.vy = p.vy * 0.93 + 180 * dt;
    }
    for (let i = S.floats.length - 1; i >= 0; i--) {
      S.floats[i].t += dt;
      if (S.floats[i].t > 1) S.floats.splice(i, 1);
    }
    if (S.toast) {
      S.toast.t += dt;
      if (S.toast.t > 3) S.toast = null;
    }
    if (S.fall) {
      S.fall.t += dt;
      if (S.fall.t >= FALL_TIME) finishFall();
    }
    if (S.demo) {
      S.demo.t -= dt;
      if (S.demo.t <= 0) { stepDemo(); if (S.demo) S.demo.t = DEMO_STEP; }
    }
    // A page left open over midnight must not keep offering yesterday.
    S.dayCheck -= dt;
    if (S.dayCheck <= 0) { S.dayCheck = 5; checkDay(); }
  }

  // ---- drawing ----
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
  const stars = Array.from({ length: 64 }, (_, i) => {
    const r = seeded(9001, i);
    return { x: r() * W, y: r() * 780, s: 0.6 + r() * 1.4, p: r() * 6.28 };
  });

  function resize() {
    invalidate(); // a canvas given a new size is blank until it is drawn again
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.clientWidth || window.innerWidth, ch = canvas.clientHeight || window.innerHeight;
    // Below 480:780 both shapes are limited by width and scale alike, so the one
    // with the heading wins; above it the compact shape is always the larger.
    L = cw / ch > 0.62 ? LAYOUTS.compact : LAYOUTS.tall;
    view.dpr = dpr;
    view.scale = Math.min(cw / W, ch / L.H);
    view.ox = (cw - W * view.scale) / 2;
    view.oy = (ch - L.H * view.scale) / 2;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }

  const roundRect = (x, y, w, h, r) => {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  };

  function label(str, x, y, size, color, align = 'center', weight = '600', maxWidth = W) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y, maxWidth);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, L.H);
    g.addColorStop(0, '#120f2b');
    g.addColorStop(1, '#07061a');
    ctx.fillStyle = g;
    ctx.fillRect(-view.ox / view.scale, -view.oy / view.scale, W + (2 * view.ox) / view.scale, L.H + (2 * view.oy) / view.scale);
    ctx.fillStyle = '#d9d2ff';
    for (const s of stars) {
      if (s.y > L.H) continue;
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * wave(1.3, s.p));
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawOrb(x, y, r, look, kind, alpha = 1, scale = 1, spin = 0) {
    const you = kind === 'you';
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.scale(scale, scale);
    const glow = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.9);
    glow.addColorStop(0, you ? 'rgba(255, 209, 102, 0.34)' : 'rgba(140, 120, 240, 0.26)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2);
    ctx.fill();
    // The shadow wobbles a little: it is the same shape as you, and it should
    // never be mistaken for you at a glance.
    const wob = you ? 0 : wave(5) * 0.04;
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, you ? C.goldHi : C.shadeHi);
    body.addColorStop(1, you ? C.gold : C.shade);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * (1 + wob), r * (1 - wob), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = you ? C.goldDeep : C.lilac;
    ctx.lineWidth = 2;
    ctx.stroke();
    const lx = look >= 0 ? DX[look] * r * 0.18 : 0, ly = look >= 0 ? DY[look] * r * 0.18 : 0;
    ctx.fillStyle = you ? '#3a2600' : '#e4defe';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(side * r * 0.3 + lx, -r * 0.08 + ly, r * 0.1, r * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSun(x, y, size, lit) {
    ctx.save();
    ctx.globalAlpha = lit ? 1 : 0.85 + 0.15 * wave(2);
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 3;
    const turnAngle = calm() ? 0 : S.turn;
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI / 4) * i + turnAngle;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * size * 0.31, y + Math.sin(a) * size * 0.31);
      ctx.lineTo(x + Math.cos(a) * size * 0.41, y + Math.sin(a) * size * 0.41);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMoon(x, y, size, lit, backdrop) {
    ctx.save();
    ctx.globalAlpha = lit ? 1 : 0.85 + 0.15 * wave(2, 1);
    ctx.strokeStyle = C.lilac;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(x, y, size * 0.37, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.lilac;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.21, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = backdrop;
    ctx.beginPath();
    ctx.arc(x + size * 0.09, y - size * 0.06, size * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoard() {
    const p = puzzle(), top0 = L.boardY;
    ctx.fillStyle = C.board;
    roundRect(BOARD_X - 6, top0 - 6, BOARD_W + 12, BOARD_H + 12, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(169, 156, 240, 0.22)';
    ctx.lineWidth = 2;
    ctx.stroke();
    for (let cell = 0; cell < CELLS; cell++) {
      const x = BOARD_X + (cell % COLS) * CELL, y = top0 + ((cell / COLS) | 0) * CELL;
      const kind = p.board[cell];
      if (kind === WALL) {
        ctx.fillStyle = C.wallEdge;
        roundRect(x + 4, y + 7, CELL - 8, CELL - 8, 10);
        ctx.fill();
        ctx.fillStyle = C.wall;
        roundRect(x + 4, y + 3, CELL - 8, CELL - 10, 10);
        ctx.fill();
        ctx.fillStyle = C.wallTop;
        roundRect(x + 10, y + 8, CELL - 20, 8, 4);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = (cell % COLS + ((cell / COLS) | 0)) % 2 ? C.tile : C.board;
      ctx.fillRect(x, y, CELL, CELL);
      // The two goal cells are tinted, so they read as places and not as decoration.
      if (cell === p.sun || cell === p.moon) {
        ctx.fillStyle = cell === p.sun ? 'rgba(255, 209, 102, 0.13)' : 'rgba(169, 156, 240, 0.15)';
        roundRect(x + 3, y + 3, CELL - 6, CELL - 6, 10);
        ctx.fill();
      }
      if (kind === HOLE) {
        const hx = x + CELL / 2, hy = y + CELL / 2;
        const g = ctx.createRadialGradient(hx, hy, 2, hx, hy, CELL * 0.38);
        g.addColorStop(0, '#000000');
        g.addColorStop(0.85, '#05041a');
        g.addColorStop(1, 'rgba(20, 10, 30, 1)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(hx, hy, CELL * 0.37, CELL * 0.33, 0, 0, Math.PI * 2);
        ctx.fill();
        // Holes are the only thing that can cost you a move, so their rim is the
        // one warm colour on the board apart from your own.
        ctx.strokeStyle = 'rgba(248, 113, 113, 0.6)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) { ctx.moveTo(BOARD_X + i * CELL, top0); ctx.lineTo(BOARD_X + i * CELL, top0 + BOARD_H); }
    for (let i = 1; i < ROWS; i++) { ctx.moveTo(BOARD_X, top0 + i * CELL); ctx.lineTo(BOARD_X + BOARD_W, top0 + i * CELL); }
    ctx.stroke();
    drawSun(cx(p.sun), cy(p.sun), CELL, S.you === p.sun);
    // The crescent is cut with the colour of the tinted cell under it.
    drawMoon(cx(p.moon), cy(p.moon), CELL, S.shadow === p.moon, (p.moon % COLS + ((p.moon / COLS) | 0)) % 2 ? '#2f2a54' : '#2b274b');
  }

  function actorPos(anim) {
    const k = ease(anim.t);
    let x = cx(anim.from) + (cx(anim.to) - cx(anim.from)) * k;
    let y = cy(anim.from) + (cy(anim.to) - cy(anim.from)) * k;
    if (anim.bump >= 0 && anim.bt >= 0 && anim.bt < 1) {
      const push = Math.sin(anim.bt * Math.PI) * 9;
      x += DX[anim.bump] * push;
      y += DY[anim.bump] * push;
    }
    return { x, y };
  }

  function drawArrow(x, y, dir, color, size = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((Math.PI / 2) * dir);
    ctx.scale(size, size);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(11, 3);
    ctx.lineTo(-11, 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawActors() {
    const p = puzzle();
    const s = actorPos(S.shadowAnim);
    let alpha = 1, scale = 1, spin = 0;
    if (S.fall) {
      const k = Math.min(1, S.fall.t / FALL_TIME);
      alpha = 1 - k * 0.7;
      if (!calm()) { scale = Math.max(0.05, 1 - k); spin = k * 5; }
    } else if (S.shadowAnim.t < 1 && S.shadowAnim.from === S.shadowAnim.to) {
      alpha = 0.3 + 0.7 * Math.max(0, S.shadowAnim.t);
    }
    drawOrb(s.x, s.y, CELL * 0.27, S.last, 'shadow', alpha * 0.95, scale, spin);
    const you = actorPos(S.youAnim);
    drawOrb(you.x, you.y, CELL * 0.27, S.last, 'you');
    if (S.fall || S.mode !== 'play' || (locked() && !S.demo)) return;

    // What the shadow does next is already decided: it is the input you just
    // gave. Showing it turns guessing into planning, and red means it is too late.
    if (S.shadowAnim.t >= 1) {
      if (S.last >= 0) {
        const danger = doomed(p.board, S.shadow, S.last);
        const bob = (danger ? 5 : 3) * wave(danger ? 10 : 6);
        drawArrow(s.x + DX[S.last] * (CELL * 0.44 + bob), s.y + DY[S.last] * (CELL * 0.44 + bob), S.last, danger ? C.bad : C.lilac);
        if (danger) label('Undo!', s.x, s.y - CELL * 0.52, L.small, C.bad, 'center', '800', CELL - 4);
      } else {
        label('waits', s.x, s.y - CELL * 0.5, L.small, C.lilac, 'center', '700', CELL - 4);
      }
    }
    // Before the first move, name the two pieces: they are the same shape.
    if (!history().length && !S.demo) {
      label('you', you.x, you.y + CELL * 0.48, L.small, C.gold, 'center', '800', CELL - 4);
      label('shadow', s.x, s.y + CELL * 0.48, L.small, C.lilac, 'center', '800', CELL - 4);
    }
  }

  function drawParts() {
    for (const p of S.parts) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const f of S.floats) {
      ctx.globalAlpha = 1 - f.t;
      label(f.text, f.x, f.y - (calm() ? 0 : f.t * 30), 24, f.color, 'center', '800');
    }
    ctx.globalAlpha = 1;
  }

  // ---- buttons (logical rectangles; the same list draws and hit-tests) ----
  function row(items, y, h, x0 = 10, x1 = W - 10) {
    const gap = 8, w = (x1 - x0 - gap * (items.length - 1)) / items.length;
    return items.map(([id, text, primary], i) => ({ id, label: text, x: x0 + i * (w + gap), y, w, h, primary }));
  }

  function icons(withHome) {
    const size = L.icon, right = W - (L.heading ? 10 : 6);
    const list = [{ id: 'mute', icon: 'sound', x: right - size, y: L.iconY, w: size, h: size }];
    if (withHome) list.push({ id: 'home', icon: 'home', x: right - 2 * size - 6, y: L.iconY, w: size, h: size });
    return list;
  }

  function buttons() {
    if (S.mode === 'title') {
      const T = L.title;
      const list = icons(false).concat(dayArrows(), row(TIERS.map((t, i) => [`card${i}`, t.label]), T.cards, L.tabH).map((b) => ({ ...b, card: true })));
      list.push({ id: 'help', label: 'How to play', x: 80, y: T.howto, w: W - 160, h: L.buttonH });
      if (onward()) list.push(...row([['share', archive() ? `Share Day ${S.day}` : 'Share', true], ['onward', `Play ${ONWARD.title}`]], T.share, L.buttonH, 20, W - 20));
      else if (solvedCount()) list.push({ id: 'share', label: archive() ? `Share Day ${S.day}` : 'Share today’s result', x: 80, y: T.share, w: W - 160, h: L.buttonH, primary: true });
      return list;
    }
    const y = L.boardY + BOARD_H + (L.heading ? 18 : 10), h = L.buttonH;
    const key = (k) => (touch() ? '' : `  ${k}`);
    if (locked()) {
      const allDone = solvedCount() === TIERS.length;
      return icons(true).concat(row([
        ['next', allDone ? 'Done' : 'Next', true],
        ['share', 'Share', true],
        ['best', S.demo ? 'Playing' : 'Par line'],
        ['restart', 'Replay'],
      ], y, h));
    }
    return icons(true).concat(row([
      ['undo', `Undo${key('U')}`],
      ['restart', `Restart${key('R')}`],
      ['help', `${S.help ? 'Close' : 'Rules'}${key('H')}`],
    ], y, h));
  }

  // Either side of the day line on the title screen, each only where there is a day to go to.
  const ARROW = 62;
  function dayArrows() {
    const y = L.title.day - ARROW / 2, list = [];
    if (S.day > 1) list.push({ id: 'prevday', icon: 'prev', x: 14, y, w: ARROW, h: ARROW });
    if (S.day < S.today) list.push({ id: 'nextday', icon: 'next', x: W - 14 - ARROW, y, w: ARROW, h: ARROW });
    return list;
  }

  function tabs() {
    const x1 = L.heading ? W - 10 : W - 6 - 2 * L.icon - 12;
    return row(TIERS.map((t, i) => [`tier${i}`, t.label]), L.tabsY, L.tabH, L.heading ? 10 : 6, x1).map((b, i) => ({ ...b, tier: i }));
  }

  const inside = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

  function drawIcon(b) {
    const x = b.x + b.w / 2, y = b.y + b.h / 2;
    ctx.fillStyle = S.hover === b.id ? C.buttonHot : C.button;
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = C.line;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = C.text;
    ctx.strokeStyle = C.text;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    if (b.icon === 'home') {
      ctx.beginPath();
      ctx.moveTo(x - 11, y - 1); ctx.lineTo(x, y - 11); ctx.lineTo(x + 11, y - 1);
      ctx.moveTo(x - 7, y - 4); ctx.lineTo(x - 7, y + 10); ctx.lineTo(x + 7, y + 10); ctx.lineTo(x + 7, y - 4);
      ctx.stroke();
    } else if (b.icon === 'prev' || b.icon === 'next') {
      const back = b.icon === 'prev' ? 1 : -1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 5 * back, y - 11); ctx.lineTo(x - 6 * back, y); ctx.lineTo(x + 5 * back, y + 11);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 4); ctx.lineTo(x - 7, y - 4); ctx.lineTo(x, y - 10);
      ctx.lineTo(x, y + 10); ctx.lineTo(x - 7, y + 4); ctx.lineTo(x - 12, y + 4);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      if (S.muted) {
        ctx.moveTo(x + 5, y - 5); ctx.lineTo(x + 13, y + 5);
        ctx.moveTo(x + 13, y - 5); ctx.lineTo(x + 5, y + 5);
      } else {
        ctx.arc(x + 3, y, 6, -0.9, 0.9);
        ctx.moveTo(x + 7.5, y - 9.5);
        ctx.arc(x + 3, y, 11, -0.9, 0.9);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  function drawButton(b) {
    if (b.icon) { drawIcon(b); return; }
    if (b.card) { drawTierCard(b, Number(b.id.slice(4)), S.hover === b.id); return; }
    const down = S.press && S.press.id === b.id;
    const hot = S.hover === b.id;
    ctx.fillStyle = b.primary ? (down ? C.goldDeep : C.gold) : down ? C.buttonDown : hot ? C.buttonHot : C.button;
    roundRect(b.x, b.y + (down ? 2 : 0), b.w, b.h, 12);
    ctx.fill();
    if (!b.primary) {
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    label(b.label, b.x + b.w / 2, b.y + b.h / 2 + (down ? 2 : 0), 24, b.primary ? '#1a1300' : C.text, 'center', '700', b.w - 16);
  }

  /** "★ 5 moves" at par, "7 moves, +2" above it: one notation everywhere. */
  function resultText(moves, par) {
    const over = moves - par;
    return over <= 0 ? `★ ${moves} moves` : `${moves} moves, +${over}`;
  }

  function drawTierCard(b, tier, active) {
    const r = S.runs[tier], p = S.puzzles[tier];
    ctx.fillStyle = active ? C.buttonHot : '#17143a';
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = active ? C.gold : r.solved ? 'rgba(255, 209, 102, 0.45)' : 'rgba(169, 156, 240, 0.25)';
    ctx.lineWidth = active ? 2 : 1.5;
    ctx.stroke();
    const size = L.tabText;
    label(`${TIERS[tier].name} · ${TIERS[tier].label}`, b.x + b.w / 2, b.y + b.h * 0.32, size + 1, active || r.solved ? C.text : C.muted, 'center', '700', b.w - 8);
    label(r.solved ? resultText(r.solvedMoves, p.par) : `par ${p.par}`, b.x + b.w / 2, b.y + b.h * 0.72, size, r.solved ? C.gold : C.muted, 'center', '600', b.w - 6);
  }

  function drawDemoStrip(x, y) {
    const { path, i } = S.demo;
    const step = Math.min(22, 250 / path.length);
    path.forEach((dir, k) => {
      const color = k === i - 1 ? C.gold : k < i ? C.text : 'rgba(168, 162, 208, 0.55)';
      drawArrow(x + k * step + step / 2, y, dir, color, step / 26);
    });
  }

  function drawHud() {
    if (L.heading) {
      label('One Step Late', 12, 28, 26, C.text, 'left', '800');
      if (!PICTURE) label(`Day ${S.day}${archive() ? ' · archive' : ''}`, 12, 56, 22, C.gold, 'left', '700');
    }
    for (const t of tabs()) drawTierCard(t, t.tier, t.tier === S.tier);
    const p = puzzle(), r = run();
    const y = L.infoY;
    const day = L.heading || PICTURE ? '' : `Day ${S.day} · `;
    if (S.toast && toastOverInfo()) {
      // the toast is drawn here instead, for its three seconds
    } else if (S.newDay && !L.heading) {
      label(touch() ? 'New puzzles are out: tap home' : 'New puzzles are out: press Esc', BOARD_X, y, 24, C.gold, 'left', '800', 456);
    } else if (S.demo) {
      label('Par line', BOARD_X, y, 24, C.text, 'left', '800');
      drawDemoStrip(BOARD_X + 104, y);
      label(`par ${p.par}`, BOARD_X + BOARD_W, y, 24, C.muted, 'right', '800');
    } else if (locked()) {
      const over = r.solvedMoves - p.par;
      label(`${day}Solved in ${r.solvedMoves}`, BOARD_X, y, 24, C.text, 'left', '800', 250);
      label(over <= 0 ? '★ par' : `par ${p.par}, +${over}`, BOARD_X + BOARD_W, y, 24, C.gold, 'right', '800', 200);
    } else {
      const moves = S.practice ? S.practiceMoves : r.moves;
      const over = moves - p.par;
      label(S.practice ? `Practice · ${moves} moves` : `${day}Moves ${moves}`, BOARD_X, y, 24, C.text, 'left', '800', 230);
      const color = moves <= p.par ? C.good : over <= 2 ? C.warn : C.bad;
      label(`par ${p.par} (fewest possible)`, BOARD_X + BOARD_W, y, 24, color, 'right', '700', 224);
    }
  }

  const RULES = [
    ['You step where you choose.', C.text],
    ['Then your shadow repeats the move', C.lilac],
    ['you made the turn before; an arrow marks it.', C.lilac],
    ['You never walk into a hole.', C.text],
    ['Your shadow does. The move that aimed', C.bad],
    ['it there is taken back, and still counts.', C.bad],
    ['Walls, edges and each other block you;', C.muted],
    ['a blocked move still counts and is copied.', C.muted],
    ['Finish with you on the sun and your', C.gold],
    ['shadow on the moon, at the same time.', C.gold],
    ['Every move counts: undo and restart', C.text],
    ['do not give moves back.', C.text],
  ];
  const rulesText = () => RULES.map(([line]) => line).join(' ');

  function toggleHelp() {
    S.help = !S.help;
    sfx.click();
    if (S.help) announce(rulesText());
  }

  // On the title screen the panel must clear the day-nav arrows sitting above
  // the board's usual position, so its top (and, to still fit above the
  // footer, its height) are only defaulted to the board's own bounds — not
  // fixed to them the way the play-mode panel always was.
  function drawHelp(top = L.boardY - 8, bottom = top + BOARD_H + 16) {
    const h = bottom - top;
    ctx.fillStyle = '#14111c';
    roundRect(BOARD_X - 8, top, BOARD_W + 16, h, 16);
    ctx.fill();
    ctx.strokeStyle = C.line;
    ctx.lineWidth = 1.5;
    roundRect(BOARD_X - 8, top, BOARD_W + 16, h, 16);
    ctx.stroke();
    const lh = Math.min(34, (h - 60) / (RULES.length - 1));
    RULES.forEach(([str, color], i) => label(str, W / 2, top + 44 + i * lh, 24, color, 'center', '600', BOARD_W - 8));
  }

  // The keyboard hints at a size a phone can read run to two lines (ARK-88):
  // each hint is already split where its " · " separators break it.
  const FOOT_HINTS = {
    titleDays: ['Arrows or WASD · U undo · R restart', '< > other days'],
    titleFirst: ['Arrow keys or WASD · U undo · R restart', 'L reads the board'],
    play: ['Arrows or WASD · 1 2 3 switch', 'Esc home · M sound'],
  };

  function drawFooter(y) {
    if (S.toast || !y) return;
    if (S.newDay) { label(touch() ? 'New puzzles are out: tap the home button' : 'New puzzles are out: press Esc', W / 2, y, 24, C.gold, 'center', '700'); return; }
    if (touch()) { label('Swipe, or tap toward a cell', W / 2, y, 24, C.muted, 'center', '500'); return; }
    const lines = S.mode === 'title' ? (S.today > 1 ? FOOT_HINTS.titleDays : FOOT_HINTS.titleFirst) : FOOT_HINTS.play;
    lines.forEach((line, i) => label(line, W / 2, y + (i - (lines.length - 1) / 2) * 28, 24, C.muted, 'center', '500'));
  }

  function drawPlay() {
    drawHud();
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBoard();
    drawActors();
    drawParts();
    ctx.restore();
    if (S.help) drawHelp();
    for (const b of buttons()) drawButton(b);
    drawFooter(L.footerY);
  }

  function untilMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const mins = Math.max(0, Math.ceil((next - now) / 60000));
    return `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
  }

  function drawTitle() {
    const T = L.title;
    label('ONE STEP LATE', W / 2, T.name, T.nameSize, C.text, 'center', '900');
    const past = archive();
    label(titleDay(S.day, past ? dayDate(S.day) : '', past, PICTURE), W / 2, T.day, 24, C.gold, 'center', '700', W - 2 * (14 + ARROW + 6));
    label('Your shadow copies your last move,', W / 2, T.tagline, 24, C.muted, 'center', '500', W - 40);
    label('one step late.', W / 2, T.tagline2, 24, C.muted, 'center', '500', W - 40);

    const allDone = solvedCount() === TIERS.length;
    ctx.globalAlpha = allDone ? 1 : 0.8 + 0.2 * wave(3);
    const go = touch() ? 'Tap' : 'Tap or press Space';
    const done = past ? `Day ${S.day} is done` : `Next puzzles in ${untilMidnight()}`;
    label(allDone ? done : `${go} to ${solvedCount() ? 'continue' : 'play'}`, W / 2, T.cta, 26, allDone ? C.text : C.gold, 'center', '800');
    ctx.globalAlpha = 1;
    // Finished for today is the moment an earlier day is worth offering.
    const again = allDone ? (!past && S.day > 1 ? '‹ plays earlier days' : 'Tap a puzzle to see it again') : '';
    // A friend's result, from a link they shared: only ever decoded for today
    // (decodeFriendCode itself refuses any other day), so this line cannot
    // outlive the puzzle it names. Shown in place of the streak, not beside it
    // — a specific invitation from a real person beats a stat about oneself.
    const friendMarks = !past && FRIEND_RAW ? decodeFriendCode(FRIEND_RAW, S.today) : null;
    if (friendMarks && !friendSeenSent) { friendSeenSent = true; emit('friend_seen', { day: S.day }); }
    const sub = past
      ? again || 'Earlier days do not count toward the streak'
      : [again, friendMarks ? `A friend played today: ${friendMarks.join(' ')} — beat it` : (S.bestStreak ? `Streak ${liveStreak()} · best ${S.bestStreak}` : '')].filter(Boolean).join('  ·  ');
    if (sub) label(sub, W / 2, T.sub, 24, C.muted, 'center', '600', W - 24);
    for (const b of buttons()) drawButton(b);
    drawFooter(T.footer);
    if (S.help) drawHelp(T.day + ARROW / 2 + 8, T.footer - 24);
  }

  // In the compact shape the toast takes the place of the info line for its
  // three seconds, par-line strip included.
  const toastOverInfo = () => !L.heading && S.mode === 'play';

  function drawToast() {
    if (!S.toast) return;
    const a = Math.min(1, S.toast.t * 6, (3 - S.toast.t) * 3);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = `700 24px ${FONT}`;
    const w = Math.min(W - 12, ctx.measureText(S.toast.text).width + 36);
    const y = S.mode === 'title' ? L.title.footer - 18 : L.toastY;
    const h = toastOverInfo() ? 36 : 44; // compact: clear of the board frame
    ctx.fillStyle = '#2d2860';
    roundRect((W - w) / 2, y, w, h, h / 2);
    ctx.fill();
    label(S.toast.text, W / 2, y + h / 2, 24, C.text, 'center', '700', w - 16);
    ctx.globalAlpha = 1;
  }

  function render() {
    if (ONWARD) onwardLink.hidden = !onward();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = view.scale * view.dpr;
    ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
    drawBackground();
    if (S.mode === 'title') drawTitle();
    else drawPlay();
    drawToast();
    if (S.flash > 0) {
      ctx.fillStyle = `rgba(255, 243, 196, ${S.flash * 0.25})`;
      ctx.fillRect(0, 0, W, L.H);
    }
  }

  // ---- input ----
  const toLogical = (event) => {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left - view.ox) / view.scale, y: (event.clientY - rect.top - view.oy) / view.scale };
  };

  const hitButton = (x, y) => [...buttons(), ...(S.mode === 'play' ? tabs() : [])].find((b) => inside(b, x, y));

  function press(id) {
    if (id === 'share') share();
    else if (id === 'mute') toggleMute();
    else if (id === 'home') goTitle();
    else if (id === 'next') nextPuzzle();
    else if (id === 'best') showBestLine();
    else if (id === 'undo') undo();
    else if (id === 'restart') restart();
    else if (id === 'help') toggleHelp();
    else if (id === 'prevday') stepDay(-1);
    else if (id === 'nextday') stepDay(1);
    else if (id === 'onward') goOnward();
    else if (id.startsWith('tier')) setTier(Number(id.slice(4)));
    else if (id.startsWith('card')) {
      const tier = Number(id.slice(4));
      if (S.mode === 'title') startPlay(tier); else setTier(tier);
    }
  }

  canvas.addEventListener('pointerdown', (event) => {
    wake();
    // Only the first finger, and only the main mouse button: a second finger or
    // a right click must never become a counted move.
    if (!event.isPrimary || (event.pointerType === 'mouse' && event.button !== 0)) return;
    // focusVisible: false says what this focus is: from a press, no ring. Safari
    // and Firefox would otherwise ring a board focused by script before the click.
    canvas.focus({ preventScroll: true, focusVisible: false });
    ensureAudio();
    // The help panel on the title screen covers the same coordinates as the tier
    // cards/buttons beneath it (unlike in play, where it only covers the board);
    // any tap while it is open must close it, not fall through to what it hides.
    if (S.help) { S.help = false; S.press = null; return; }
    const at = toLogical(event);
    const b = hitButton(at.x, at.y);
    S.press = { id: b ? b.id : null, x: at.x, y: at.y, pointer: event.pointerId };
    try { canvas.setPointerCapture(event.pointerId); } catch { /* not supported */ }
  });

  // Only a change of what is under the mouse is a new picture: a mouse wandering
  // over a still board must not redraw it every frame.
  canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType !== 'mouse') return;
    const at = toLogical(event);
    const b = S.help ? null : hitButton(at.x, at.y);
    const hover = b ? b.id : null;
    if (hover !== S.hover) { S.hover = hover; invalidate(); }
  });

  canvas.addEventListener('pointerup', (event) => {
    wake();
    const start = S.press;
    if (!start || start.pointer !== event.pointerId) return;
    S.press = null;
    ensureAudio();
    const at = toLogical(event);
    if (start.id) {
      const b = hitButton(at.x, at.y);
      if (b && b.id === start.id) press(b.id);
      return;
    }
    if (S.mode === 'title') { startPlay(); return; }
    const dx = at.x - start.x, dy = at.y - start.y;
    if (Math.hypot(dx, dy) > 26) {
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : dy > 0 ? 2 : 0);
      return;
    }
    // A tap on the board steps toward the tapped cell, along its longer axis.
    if (at.x < BOARD_X || at.x > BOARD_X + BOARD_W || at.y < L.boardY || at.y > L.boardY + BOARD_H) return;
    const col = Math.floor((at.x - BOARD_X) / CELL), rowAt = Math.floor((at.y - L.boardY) / CELL);
    const ddx = col - (S.you % COLS), ddy = rowAt - ((S.you / COLS) | 0);
    if (!ddx && !ddy) return;
    move(Math.abs(ddx) >= Math.abs(ddy) ? (ddx > 0 ? 1 : 3) : ddy > 0 ? 2 : 0);
  });

  canvas.addEventListener('pointercancel', (event) => {
    invalidate();
    if (S.press && S.press.pointer === event.pointerId) S.press = null;
  });

  window.addEventListener('keydown', (event) => {
    wake();
    // While the copy dialog is open the board is not there to play, wherever focus went.
    if (copyBox.classList.contains('open')) {
      if (event.key === 'Escape') closeCopyBox();
      return;
    }
    // Keys typed in the dialog or on the accessible buttons are theirs.
    if (event.target instanceof Element && event.target.closest('#copybox, #controls')) return;
    // Ctrl+R, Cmd+W, Ctrl+S belong to the browser. Before this check a reload
    // restarted the puzzle on the way out and a save shortcut spent a move.
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const code = event.code;
    const { dir, digit, letter } = readKey(code, event.key);
    // Same reasoning as the pointerdown guard above: while the help panel is
    // open, only the keys that can close it do anything.
    if (S.help) {
      if (letter === 'Escape' || letter === 'h' || letter === '?') { event.preventDefault(); toggleHelp(); }
      return;
    }
    const space = code === 'Space' || event.key === ' ';
    if (dir >= 0 || space || letter === 'Backspace') event.preventDefault();
    // Every move is counted, so a held key must not turn into thirty of them.
    if (event.repeat) return;
    ensureAudio();
    if (dir >= 0) {
      if (S.mode === 'title') startPlay(); else move(dir);
      return;
    }
    const step = dayStep(letter);
    if (step) { stepDay(step); return; }
    if (letter === 'm') { toggleMute(); return; }
    if (letter === 'l') { announce(S.mode === 'play' ? describeBoard() : `Day ${S.day}. Start a puzzle to hear its board.`); return; }
    if (letter === 'h' || letter === '?') { toggleHelp(); return; }
    if (S.mode === 'title') {
      if (space || letter === 'Enter') startPlay();
      else if (letter === 'c') share();
      else if (digit >= 0) startPlay(digit);
      return;
    }
    if (letter === 'u' || letter === 'z' || letter === 'Backspace') { undo(); return; }
    if (letter === 'r') { restart(); return; }
    if (letter === 'n' || letter === 'Enter' || space) { if (locked()) nextPuzzle(); return; }
    if (letter === 'b') { showBestLine(); return; }
    if (letter === 'c') { share(); return; }
    if (digit >= 0) { setTier(digit); return; }
    if (letter === 'Escape') goTitle();
  });

  controls.addEventListener('click', (event) => {
    wake();
    const button = event.target instanceof Element ? event.target.closest('button[data-act]') : null;
    if (!button || copyBox.classList.contains('open')) return;
    ensureAudio();
    const act = button.dataset.act;
    if (act.startsWith('dir')) {
      if (S.mode === 'title') startPlay();
      else move(Number(act.slice(3)));
    } else if (act === 'board') {
      announce(S.mode === 'play' ? describeBoard() : `Day ${S.day}. Start a puzzle to hear its board.`);
    } else if (act === 'next' && S.mode === 'title') {
      startPlay();
    } else {
      press(act);
    }
  });

  // Another tab of this game saved something: take it in, so neither tab
  // overwrites the other's solved puzzles or positions on its next move.
  window.addEventListener('storage', (event) => {
    invalidate();
    if (event.key === STORE && S.runs.length) absorb(readStore());
  });

  // ---- loop ----
  // A board between moves is a still picture, and it used to be redrawn sixty times
  // a second anyway. Now it is drawn when something changed — the rule Sudoku
  // Sixes, Minesweeper, Blind Corners and Ink Side Down already follow: every
  // listener that can change the picture calls invalidate() (wake(), for the
  // player's own input) before anything else can return, and the loop owns what no
  // event announces — a running animation (a step, a bump, the shadow's fall, the
  // par line playing, particles, a toast), and the countdown on the title screen
  // reaching a new minute. A missed invalidate is a frozen game.
  //
  // The ambient motion — the twinkling stars, the wobbling shadow, the breathing
  // sun and moon, the turning rays, the bobbing arrow, the breathing "Tap to
  // play" — answers the player instead of running as a screensaver: wake() keeps
  // it going for LIVELY seconds after the last input, then it fades into the
  // reduced-motion picture and the drawing stops. A page nobody has touched yet
  // opens still.
  const LIVELY = 4;
  let dirty = true, wasAnimating = false, shownText = '';
  const invalidate = () => { dirty = true; };
  const wake = () => { dirty = true; S.lively = LIVELY; };

  const animating = () => {
    const y = S.youAnim, s = S.shadowAnim;
    if (y.t < 1 || y.bt < 1 || s.t < 1 || s.bt < 1 || S.fall || S.demo) return true;
    if (S.shake > 0 || S.flash > 0 || S.parts.length > 0 || S.floats.length > 0 || S.toast) return true;
    return S.stir > 0 || (S.lively > 0 && !calm());
  };

  let lastTime = 0, running = true;
  function frame(now) {
    // Booked before anything that can throw: one bad frame must not stop every frame
    // after it and leave the game frozen on its last picture (Pair Flip, 48ad915).
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (running) {
      if (!PICTURE) update(dt); // a pose holds still
      const text = S.mode === 'title' ? untilMidnight() : '';
      if (text !== shownText) { shownText = text; dirty = true; }
      const live = animating();
      // `wasAnimating` buys one more frame after the last one ends, so the screen
      // never keeps a half-finished animation as its final picture.
      if (dirty || live || wasAnimating) {
        dirty = false;
        render();
        // The generator waits for this: the posed frame is on the canvas.
        if (PICTURE) window.__arkaiPosed = true;
      }
      wasAnimating = live;
    }
  }

  // A turn-based game has no clock to stop, but a hidden tab should not keep
  // drawing, and sound must not start again on its own.
  document.addEventListener('visibilitychange', () => {
    invalidate();
    running = !document.hidden;
    if (audio) {
      if (document.hidden) audio.suspend().catch(() => {});
      else if (!S.muted) audio.resume().catch(() => {});
    }
    if (!document.hidden && S.runs.length) { absorb(readStore()); checkDay(); }
  });

  window.addEventListener('resize', resize);
  // A canvas whose backing store the browser dropped comes back blank.
  canvas.addEventListener('contextrestored', invalidate);
  // The hints drawn on the canvas follow the pointer (tap or click, the keys on the
  // buttons), and the sun's rays stand straight under reduced motion: a device that
  // changes either — a tablet mode, a mouse plugged in, the motion setting —
  // redraws a still screen. Old Safari has no addEventListener on a media query.
  if (coarseQuery && coarseQuery.addEventListener) coarseQuery.addEventListener('change', invalidate);
  if (calmQuery && calmQuery.addEventListener) calmQuery.addEventListener('change', invalidate);
  resize();
  if (PICTURE) posePicture(); else loadDay(dayFromDateParam(DATE_RAW) ?? dayNumber(new Date()));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
