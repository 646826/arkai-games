<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>One Step Late — Arkai</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b1f; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  /* dvh where it exists: on iOS 100vh is taller than the visible page while the
     address bar shows, which pushed the buttons under it and offset every tap. */
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; cursor: pointer; }
  /* The browser decides when focus should show. Chrome also shows it once a
     player who clicked starts using the arrows, so the ring is kept quiet:
     2px at 45% gold still clears 3:1 against the page. */
  canvas:focus-visible { outline: 2px solid rgba(255, 209, 102, 0.45); outline-offset: -2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The same actions as the canvas buttons, for screen readers and the Tab key.
     Hidden until one of them has focus, then shown as a bar. */
  #controls:focus-within { position: fixed; left: 8px; right: 8px; bottom: 8px; width: auto; height: auto; clip: auto; white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 12px; background: #1a1636; border: 1px solid #3b3470; }
  #controls button, #controls a { min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; padding: 0 12px; border-radius: 10px; border: 1px solid #3b3470; background: #1e1a42; color: #ece9ff; font: 600 15px system-ui, sans-serif; }
  #controls a[hidden] { display: none; }
  #controls button:focus, #controls a:focus { outline: 2px solid #ffd166; }
  #copybox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 6, 20, 0.82); }
  #copybox.open { display: flex; }
  #copybox .card { width: min(92vw, 420px); box-sizing: border-box; padding: 18px; border-radius: 16px; background: #1a1636; border: 1px solid #3b3470; color: #ece9ff; }
  #copybox p { margin: 0 0 10px; font-size: 15px; line-height: 1.4; }
  #copybox textarea { width: 100%; height: 100px; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #3b3470; background: #0d0b1f; color: #ffe7a8; font: 15px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: none; -webkit-user-select: text; user-select: text; }
  #copybox button { margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: #ffd166; color: #1a1300; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="One Step Late, a daily puzzle. Move with the arrow keys or WASD. Your shadow repeats your previous move one turn late. Bring yourself to the sun and your shadow to the moon at the same time. L describes the board, U undoes, R restarts, H shows the rules. Comma and period open the previous or next day. Press Tab for buttons."></canvas>
<div id="status" class="sr" aria-live="polite"></div>
<div id="controls" class="sr" role="group" aria-label="Game controls">
  <button type="button" data-act="dir0">Move up</button>
  <button type="button" data-act="dir1">Move right</button>
  <button type="button" data-act="dir2">Move down</button>
  <button type="button" data-act="dir3">Move left</button>
  <button type="button" data-act="undo">Undo</button>
  <button type="button" data-act="restart">Restart</button>
  <button type="button" data-act="board">Describe the board</button>
  <button type="button" data-act="help">Rules</button>
  <button type="button" data-act="best">Show the par line of a solved puzzle</button>
  <button type="button" data-act="next">Next puzzle</button>
  <button type="button" data-act="share">Share result</button>
  <a id="onward" href="#" target="_top" hidden>Play the next daily puzzle</a>
  <button type="button" data-act="card0">Easy puzzle</button>
  <button type="button" data-act="card1">Medium puzzle</button>
  <button type="button" data-act="card2">Hard puzzle</button>
  <button type="button" data-act="mute">Sound on or off</button>
  <button type="button" data-act="home">Title screen</button>
  <button type="button" data-act="prevday">Previous day</button>
  <button type="button" data-act="nextday">Next day</button>
</div>
<div id="copybox" role="dialog" aria-modal="true" aria-labelledby="copytitle">
  <div class="card">
    <p id="copytitle">Your browser would not copy by itself. Select the text below, copy it, and paste it anywhere.</p>
    <textarea id="copytext" readonly></textarea>
    <button id="copyclose" type="button">Done</button>
  </div>
</div>
<script>
(() => {
  'use strict';

  // ---- puzzle core begin ----
  // Everything between the two markers is pure: no DOM, no clock, no storage.
  // scripts/tests/one-step-late.test.mjs runs this block on its own, because the
  // one promise a daily puzzle makes is that puzzle #N is the same board for
  // everyone, forever. A change here that renumbers or reshapes old days breaks
  // every result anyone has already shared, and that test exists to say so.

  const COLS = 6, ROWS = 6, CELLS = COLS * ROWS;
  const FLOOR = 0, WALL = 1, HOLE = 2;
  // Directions are indices, 0 up, 1 right, 2 down, 3 left, so an input history
  // stores as a string of digits and the share text never has to describe a move.
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  // Day 1 is the launch date. Moving it renumbers every puzzle ever shared.
  const EPOCH_UTC = Date.UTC(2026, 8, 16);
  const DAY_MS = 86400000;

  // The whole difficulty curve. `lead` is how many moves the shadow must add to
  // the walk you would take alone: a puzzle where you can ignore your shadow is a
  // maze, not this game, and it is rejected rather than shipped.
  const TIERS = [
    { name: 'I', label: 'Easy', par: [5, 7], lead: 2, walls: [5, 8], holes: [1, 3] },
    { name: 'II', label: 'Medium', par: [8, 11], lead: 3, walls: [5, 9], holes: [2, 4] },
    { name: 'III', label: 'Hard', par: [12, 16], lead: 4, walls: [6, 10], holes: [2, 5] },
  ];
  // At most this many distinct move sequences reach the goal in par moves. A
  // board with dozens of optimal lines reads as "I got lucky", not "I found it".
  const MAX_OPTIMAL_LINES = 2;
  const MAX_ATTEMPTS = 4000;

  const neighbour = (cell, dir) => {
    const x = (cell % COLS) + DX[dir], y = ((cell / COLS) | 0) + DY[dir];
    return x < 0 || y < 0 || x >= COLS || y >= ROWS ? -1 : y * COLS + x;
  };

  /**
   * One turn. You step first: walls, the edge, holes and your shadow stop you —
   * you can see the holes. Then your shadow repeats the input you gave on the
   * previous turn (on the very first turn it has nothing to repeat and waits).
   * Walls, the edge and you stop it. Holes do not: it steps in and falls.
   */
  function turn(board, you, shadow, last, dir) {
    let nextYou = neighbour(you, dir);
    if (nextYou < 0 || board[nextYou] !== FLOOR || nextYou === shadow) nextYou = you;
    if (last < 0) return { you: nextYou, shadow, fell: false };
    let nextShadow = neighbour(shadow, last);
    if (nextShadow < 0 || board[nextShadow] === WALL || nextShadow === nextYou) nextShadow = shadow;
    return { you: nextYou, shadow: nextShadow, fell: board[nextShadow] === HOLE };
  }

  /**
   * True when the shadow's next step is already a hole. Its next step is the
   * input you gave last, and you can never stand in a hole to block it, so from
   * here every move drops it: the mistake was the previous input, not the next.
   */
  function doomed(board, shadow, last) {
    if (last < 0) return false;
    const n = neighbour(shadow, last);
    return n >= 0 && board[n] === HOLE;
  }

  /**
   * Fewest turns to the goal, by breadth-first search over (you, shadow, last
   * input), plus how many different input sequences reach it in that many turns.
   */
  function solve(puzzle, wantPath, maxDepth = 63) {
    const { board, you, shadow, sun, moon } = puzzle;
    const id = (a, b, last) => (a * CELLS + b) * 5 + last + 1;
    const dist = new Int8Array(CELLS * CELLS * 5).fill(-1);
    const ways = new Float64Array(dist.length);
    const from = wantPath ? new Int32Array(dist.length) : null;
    let frontier = [id(you, shadow, -1)];
    dist[frontier[0]] = 0;
    ways[frontier[0]] = 1;
    for (let depth = 1; frontier.length && depth <= maxDepth; depth++) {
      const next = [];
      for (const state of frontier) {
        const last = (state % 5) - 1, pair = (state / 5) | 0;
        const a = (pair / CELLS) | 0, b = pair % CELLS;
        for (let dir = 0; dir < 4; dir++) {
          const r = turn(board, a, b, last, dir);
          if (r.fell) continue;
          const key = id(r.you, r.shadow, dir);
          if (dist[key] < 0) {
            dist[key] = depth;
            if (from) from[key] = state;
            next.push(key);
          }
          if (dist[key] === depth) ways[key] += ways[state];
        }
      }
      let lines = 0, firstWin = -1;
      for (const key of next) {
        const pair = (key / 5) | 0;
        if (((pair / CELLS) | 0) !== sun || pair % CELLS !== moon) continue;
        lines += ways[key];
        if (firstWin < 0) firstWin = key;
      }
      if (lines) {
        let path = null;
        if (from) {
          path = [];
          for (let key = firstWin; dist[key] > 0; key = from[key]) path.push((key % 5) - 1);
          path.reverse();
        }
        return { par: depth, lines, path };
      }
      frontier = next;
    }
    return { par: Infinity, lines: 0, path: null };
  }

  /** Fewest steps for you alone, shadow ignored: the maze underneath the puzzle. */
  function walkAlone(board, from, to) {
    const seen = new Uint8Array(CELLS);
    seen[from] = 1;
    let frontier = [from];
    for (let depth = 1; frontier.length; depth++) {
      const next = [];
      for (const cell of frontier) {
        for (let dir = 0; dir < 4; dir++) {
          const n = neighbour(cell, dir);
          if (n < 0 || board[n] !== FLOOR || seen[n]) continue;
          if (n === to) return depth;
          seen[n] = 1;
          next.push(n);
        }
      }
      frontier = next;
    }
    return Infinity;
  }

  // mulberry32 over an FNV-1a mix of the inputs: integer arithmetic only, so
  // every engine draws the same board from the same day.
  function seeded(...parts) {
    let h = 2166136261 >>> 0;
    for (const part of parts) {
      h = Math.imul(h ^ (part & 0xffff), 16777619) >>> 0;
      h = Math.imul(h ^ (part >>> 16), 16777619) >>> 0;
    }
    let a = h | 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function draw(day, tier, attempt) {
    const spec = TIERS[tier];
    const rand = seeded(day, tier, attempt);
    const between = ([lo, hi]) => lo + Math.floor(rand() * (hi - lo + 1));
    const walls = between(spec.walls), holes = between(spec.holes);
    const order = Array.from({ length: CELLS }, (_, i) => i);
    for (let i = CELLS - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const swap = order[i]; order[i] = order[j]; order[j] = swap;
    }
    const board = new Uint8Array(CELLS);
    let k = 0;
    for (let i = 0; i < walls; i++) board[order[k++]] = WALL;
    for (let i = 0; i < holes; i++) board[order[k++]] = HOLE;
    return { board, you: order[k], shadow: order[k + 1], sun: order[k + 2], moon: order[k + 3] };
  }

  /** A board that always works, for a day the generator cannot fill. */
  function fallbackPuzzle(day, tier) {
    const board = new Uint8Array(CELLS);
    board[14] = WALL;
    board[21] = HOLE;
    const puzzle = { board, you: 0, shadow: 5, sun: 32, moon: 35 };
    return { ...puzzle, par: solve(puzzle, false).par, day, tier, attempt: -1 };
  }

  /** The puzzle for a day and tier. Same arguments, same board, on any machine. */
  function makePuzzle(day, tier) {
    const spec = TIERS[tier];
    for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
      const puzzle = draw(day, tier, attempt);
      // A board longer than the tier allows is rejected anyway; stop looking there.
      const { par, lines } = solve(puzzle, false, spec.par[1]);
      if (par < spec.par[0] || par > spec.par[1] || lines > MAX_OPTIMAL_LINES) continue;
      if (par - walkAlone(puzzle.board, puzzle.you, puzzle.sun) < spec.lead) continue;
      return { ...puzzle, par, day, tier, attempt };
    }
    // Ten years of days were generated in testing and none got here. If one
    // ever does, a plain board beats a frozen tab.
    return fallbackPuzzle(day, tier);
  }

  /** Where a stored input history leaves the pieces. A history never contains a fall. */
  function replay(puzzle, inputs) {
    let you = puzzle.you, shadow = puzzle.shadow, last = -1;
    const kept = [];
    for (const dir of inputs) {
      const r = turn(puzzle.board, you, shadow, last, dir);
      if (r.fell) break; // only a corrupt store gets here
      you = r.you; shadow = r.shadow; last = dir;
      kept.push(dir);
    }
    return { you, shadow, last, inputs: kept };
  }

  /**
   * What a fall leaves behind. The shadow's step was the previous input, so the
   * state just before the fall was already doomed; the input that aimed it is
   * taken back too. That state is never doomed: its own step went through.
   */
  function resolveFall(puzzle, inputs) {
    return replay(puzzle, inputs.slice(0, -1));
  }

  /**
   * One day's saved results, merged with what this tab holds. Two tabs of the
   * same game write to one store; the later write must not unsolve a puzzle the
   * other tab solved, or lower a move count the player already spent.
   * For an unsolved puzzle the position is this tab's only where `mine[tier]`
   * says so: the tab changed it and has not saved yet, or the store still holds
   * what the tab last saw. Otherwise another tab moved on and its position wins.
   * Entries are { i: input digits, m: moves spent, s: moves at first solve or 0 }.
   */
  function mergeDay(saved, current, mine) {
    return current.map((cur, tier) => {
      const old = (Array.isArray(saved) && saved[tier]) || {};
      const m = Math.max(Number(old.m) || 0, cur.m);
      const oldPath = typeof old.i === 'string' ? old.i : null;
      if (Number(old.s) > 0) return { i: oldPath ?? cur.i, m, s: Number(old.s) };
      const ours = !mine || mine[tier] || oldPath === null;
      return { i: ours ? cur.i : oldPath, m, s: cur.s };
    });
  }

  /**
   * Whether this tab's position on a puzzle should win a merge: it changed the
   * puzzle and has not saved yet, or the store still holds what it last saw.
   * Anything else means another tab moved on since.
   */
  function ownsPosition(stored, seen, dirty) {
    return !!dirty || stored === null || stored === seen;
  }

  /**
   * What a tab could not save, carried onto a store another tab has written
   * since. `base` is the store the snapshot was built on: a position this tab
   * changed from it wins, one it did not change is the other tab's to move on.
   * The open day is left to absorb, which holds it in memory. Dropping the
   * snapshot whole lost every unsaved day but the one on screen; letting it win
   * everywhere rolled the other tab back. The streak comes from whichever side
   * finished the later day.
   */
  function carryUnsaved(fresh, snapshot, openDay, base) {
    const pathOf = (entries, tier) => (Array.isArray(entries) && entries[tier] && typeof entries[tier].i === 'string' ? entries[tier].i : '');
    const days = { ...fresh.days };
    for (const [day, entries] of Object.entries(snapshot.days || {})) {
      if (Number(day) === openDay || !Array.isArray(entries)) continue;
      const was = base && base.days ? base.days[day] : undefined;
      days[day] = mergeDay(days[day], entries, entries.map((_, tier) => pathOf(entries, tier) !== pathOf(was, tier)));
    }
    const from = (Number(snapshot.lastFull) || 0) > (Number(fresh.lastFull) || 0) ? snapshot : fresh;
    return { ...fresh, days, streak: from.streak, lastFull: from.lastFull, best: Math.max(Number(fresh.best) || 0, Number(snapshot.best) || 0) };
  }

  // Movement is positional: arrows, and WASD by where the keys sit, so ZQSD
  // walks on AZERTY. Commands are read by the printed letter, so Z undoes on
  // QWERTZ; a non-Latin letter falls back to the Latin one on the same key, so
  // U still undoes on a Cyrillic layout. Where a layout prints a command on a
  // WASD position (Colemak R on S, Workman H on D) the position wins: a lost
  // letter has a button, while R read as a restart would throw progress away.
  const KEY_DIRS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  const ARROW_DIRS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
  // The punctuation that steps through days, by position, for layouts that print a letter there.
  const PUNCT_KEYS = { Comma: ',', Period: '.' };
  const own = (table, name) => Object.prototype.hasOwnProperty.call(table, name);

  /** What a key press means: a direction, a puzzle digit, or a command letter. */
  function readKey(rawCode, rawKey) {
    const code = String(rawCode || ''), key = String(rawKey || '');
    // An arrow is an arrow whatever reported it: the numpad with NumLock off,
    // a remapper, or an on-screen keyboard that sends no physical code at all.
    let dir = own(ARROW_DIRS, key) ? ARROW_DIRS[key] : own(KEY_DIRS, code) ? KEY_DIRS[code] : -1;
    // With it on, 1 2 3 pick a puzzle; the top row counts by position, since
    // AZERTY types symbols there without Shift.
    const digit = /^Digit[123]$/.test(code) || (/^Numpad[123]$/.test(code) && /^[123]$/.test(key)) ? Number(code.slice(-1)) - 1 : -1;
    let letter = key.length === 1 ? key.toLowerCase() : key;
    // Only for other scripts: Turkish ı on the R key is a Latin letter, and
    // reading it as R would restart the puzzle. Thai vowels are marks, not letters.
    // Checked on the whole key, which can be two code points (Arabic لا on B).
    // Cyrillic puts б and ю where the comma and period are; those count by position too.
    if (/^[\p{L}\p{M}]+$/u.test(key) && /[^\p{Script=Latin}\p{Script=Inherited}\p{Script=Common}]/u.test(key)) {
      if (/^Key[A-Z]$/.test(code)) letter = code.slice(3).toLowerCase();
      else if (own(PUNCT_KEYS, code)) letter = PUNCT_KEYS[code];
    }
    return { dir, digit, letter: dir >= 0 ? '' : letter };
  }

  /** -1, +1 or 0: whether a key steps to the previous day, the next, or neither. */
  function dayStep(letter) {
    if (letter === ',' || letter === '<' || letter === '[') return -1;
    if (letter === '.' || letter === '>' || letter === ']') return 1;
    return 0;
  }

  /** Day number for a local calendar date: the puzzle turns over at your midnight, like every daily. */
  function dayNumber(date) {
    const utc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.max(1, Math.floor((utc - EPOCH_UTC) / DAY_MS) + 1);
  }

  /**
   * The streak once all three puzzles of `day` are solved, or null if it does
   * not change. Only on the day itself: finishing yesterday from the archive
   * would buy a missed day back. Only forward: a day already counted, by this
   * tab or another, is not counted again.
   */
  function streakAfter(streak, lastFull, day, today) {
    if (day !== today || lastFull >= day) return null;
    return { streak: lastFull === day - 1 ? streak + 1 : 1, lastFull: day };
  }

  /**
   * The line under the title. `picture` is the thumbnail and the social card:
   * photographed once and shown for months, so it names no day at all.
   */
  function titleDay(day, date, past, picture) {
    if (picture) return 'Three new puzzles every day';
    return past ? `Day ${day} · ${date}` : `Day ${day} · three new puzzles every day`;
  }

  /** One mark of the share text per tier, nothing about the board itself. */
  function shareMark(result, par) {
    if (!result) return '⬛';
    const over = result - par;
    if (over <= 0) return '⭐';
    if (over <= 2) return '🟢+' + over;
    if (over <= 6) return '🟡+' + over;
    return '🔴+' + over;
  }

  /**
   * The next daily puzzle, as the portal's game page names it in this frame's
   * address: `#next=ink-side-down&title=Ink+Side+Down`. The page knows the
   * catalogue and the game does not, so without it nothing is offered: not in
   * this file opened on its own, not in a copy from the games repository, not
   * in a screenshot. Only a slug and a plain title get through — anyone can
   * type a fragment, and the button must not become a place to write somebody
   * else's message. The title pattern is ONWARD_TITLE in
   * site/scripts/lib/onward.mjs; a test holds the two together.
   */
  function readOnward(fragment, self) {
    const params = new URLSearchParams(String(fragment || '').replace(/^#/, ''));
    const slug = params.get('next') || '', title = params.get('title') || '';
    if (slug === self || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(slug) || !/^[A-Za-z0-9][A-Za-z0-9 '’-]{0,23}$/.test(title)) return null;
    return { slug, title, path: `/games/${slug}/` };
  }

  const core = {
    COLS, ROWS, CELLS, FLOOR, WALL, HOLE, TIERS, EPOCH_UTC, DAY_MS, MAX_ATTEMPTS, MAX_OPTIMAL_LINES,
    turn, doomed, solve, walkAlone, draw, makePuzzle, fallbackPuzzle, replay, resolveFall, mergeDay, ownsPosition, carryUnsaved, readKey, dayStep, dayNumber, streakAfter, shareMark, titleDay, readOnward,
  };
  // ---- puzzle core end ----

  // ---- layout (logical pixels) ----
  // Two shapes. The portal frames a game at 3:4 on phones and 4:3 on desktops,
  // and a game page opened on its own on a phone is taller than both. One tall
  // layout letterboxed into the 3:4 frame came out at 0.61 scale: 34-pixel
  // buttons and 8-pixel labels. The compact shape drops the heading (the page
  // around the frame already shows it) and is itself 3:4.
  const W = 480;
  const LAYOUTS = {
    tall: {
      H: 780, heading: true, iconY: 10, icon: 48, tabsY: 72, tabH: 60, infoY: 156, boardY: 176,
      buttonH: 56, toastY: 726, footerY: 744, small: 15, tabText: 16,
      title: { name: 92, nameSize: 42, day: 138, lanes: 180, lines: 330, lineGap: 28, cards: 452, cta: 550, sub: 584, share: 628, footer: 744 },
    },
    compact: {
      H: 640, heading: false, iconY: 6, icon: 60, tabsY: 6, tabH: 60, infoY: 86, boardY: 104,
      buttonH: 62, toastY: 68, footerY: 0, small: 16, tabText: 15,
      title: { name: 82, nameSize: 40, day: 120, lanes: 146, lines: 286, lineGap: 26, cards: 388, cta: 478, sub: 506, share: 528, footer: 618 },
    },
  };
  let L = LAYOUTS.tall;
  const CELL = 76;
  const BOARD_X = (W - COLS * CELL) / 2;
  const BOARD_W = COLS * CELL, BOARD_H = ROWS * CELL;
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  const SLUG = 'one-step-late';
  const STORE = 'arkai:one-step-late:v1', STORE_MUTE = 'arkai:one-step-late:muted';
  // The address in the share text. It is text for a clipboard, never loaded, and
  // it is the game page rather than this frame's own address: /play/* is
  // noindex and unmeasured, so a result shared from there would lead nowhere useful.
  const SHARE_URL = 'https:' + '//arkai.win/games/one-step-late/';
  const STEP_TIME = 0.13, SHADOW_DELAY = 0.07, FALL_TIME = 0.75, DEMO_STEP = 0.42;
  const COLS_NAMES = 'ABCDEF';
  const DIR_NAMES = ['up', 'right', 'down', 'left'];

  const C = {
    bg: '#0d0b1f', board: '#15122e', tile: '#1a1638', grid: 'rgba(255,255,255,0.045)',
    wall: '#2d2858', wallTop: '#3d3677', wallEdge: '#1b1740',
    gold: '#ffd166', goldHi: '#fff3c4', goldDeep: '#e2a92c',
    lilac: '#a99cf0', shade: '#4c3d86', shadeHi: '#7a68c4',
    text: '#ece9ff', muted: '#a8a2d0', good: '#6ee7a8', warn: '#fbbf24', bad: '#f87171',
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const controls = document.getElementById('controls');
  const copyBox = document.getElementById('copybox');
  const copyText = document.getElementById('copytext');
  const copyClose = document.getElementById('copyclose');
  const coarseQuery = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
  const calmQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const touch = () => !!(coarseQuery && coarseQuery.matches);
  // Reduced motion: no ambient animation at all. Moves still slide, briefly,
  // because a piece that teleports is harder to follow than one that moves.
  const calm = () => !!(calmQuery && calmQuery.matches);

  // Set by the portal's picture generator (site/scripts/lib/picture-flag.mjs).
  const PICTURE = window.__arkaiPicture === true;

  // A picture is the same on every machine: it reads no store and keeps nothing.
  const storage = {
    get(key) { if (PICTURE) return null; try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { if (PICTURE) return true; try { localStorage.setItem(key, value); return true; } catch { return false; } },
  };

  const S = {
    mode: 'title',          // title | play
    day: 1, today: 1,       // the day on screen, and the newest day it can be
    puzzles: [], runs: [], seen: [], dirty: [], tier: 0, newDay: false,
    you: 0, shadow: 0, last: -1,
    practice: false, practiceMoves: 0, practiceInputs: [],
    demo: null,             // { path, i, t } while the par line plays
    fall: null,             // { t, back } while the shadow falls
    help: false,
    streak: 0, bestStreak: 0, lastFull: 0, storageWarned: false,
    muted: storage.get(STORE_MUTE) === '1',
    clock: 0, dayCheck: 0, shake: 0, flash: 0,
    youAnim: null, shadowAnim: null,
    parts: [], floats: [], toast: null, press: null, hover: null,
  };
  const started = new Set();

  // ---- portal events (same-origin parent only) ----
  const emit = (event, data) => {
    if (PICTURE) return; // a photograph is not a play session
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'game-event', event, data: data || {} }, location.origin);
      }
    } catch { /* not embedded */ }
  };

  // A live region repeats nothing it already holds, so it is emptied first and
  // refilled a moment later: two falls in a row must be announced twice.
  // Messages that arrive together are read together: a sync that moved the
  // board and the move made on top of it are both news.
  let announceTimer = 0, pending = '';
  const announce = (message) => {
    pending = pending ? `${pending} ${message}` : message;
    statusEl.textContent = '';
    clearTimeout(announceTimer);
    announceTimer = setTimeout(() => { statusEl.textContent = pending; pending = ''; }, 60);
  };

  // ---- sound (generated, no assets) ----
  let audio = null;
  // Called on every gesture, not once: a touch pointerdown does not count as user
  // activation, so the context made there starts suspended and only a later
  // gesture (the pointerup) is allowed to resume it.
  const ensureAudio = () => {
    if (S.muted) return;
    if (!audio) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audio = new Ctx();
      } catch { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
  };
  const tone = (freq, dur = 0.07, type = 'triangle', vol = 0.04, delay = 0, slide = 0) => {
    if (S.muted || !audio || audio.state !== 'running') return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  };
  const sfx = {
    step: () => tone(560, 0.06, 'triangle', 0.04),
    echo: () => tone(350, 0.08, 'sine', 0.035, SHADOW_DELAY),
    bump: () => tone(130, 0.08, 'square', 0.025),
    undo: () => tone(420, 0.06, 'sine', 0.03, 0, -120),
    warn: () => tone(880, 0.05, 'square', 0.02, 0.12),
    fall: () => { tone(420, 0.5, 'sawtooth', 0.035, 0.05, -330); tone(90, 0.25, 'sine', 0.05, 0.45); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.045, i * 0.09)),
    click: () => tone(700, 0.035, 'sine', 0.025),
  };

  // ---- helpers ----
  const cx = (cell) => BOARD_X + (cell % COLS) * CELL + CELL / 2;
  const cy = (cell) => L.boardY + ((cell / COLS) | 0) * CELL + CELL / 2;
  const cellName = (cell) => `${COLS_NAMES[cell % COLS]}${((cell / COLS) | 0) + 1}`;
  const ease = (t) => (t >= 1 ? 1 : t <= 0 ? 0 : 1 - Math.pow(1 - t, 3));
  const puzzle = () => S.puzzles[S.tier];
  // The portal's next daily, named by the game page that frames this one
  // (readOnward). Null on its own, from file://, and in pictures.
  const ONWARD = !PICTURE && /^https?:$/.test(location.protocol) ? readOnward(location.hash, SLUG) : null;
  // A real link, not script: a game never reaches into the page that frames it
  // (the quality gate refuses any parent or top access), and a link leaving for
  // the portal is navigation the browser does, the same for a screen reader.
  const onwardLink = document.getElementById('onward');
  if (ONWARD) {
    onwardLink.setAttribute('href', ONWARD.path);
    onwardLink.textContent = `Play ${ONWARD.title}, another daily puzzle`;
    onwardLink.hidden = false;
    // Activated by a person: counted first, then followed by goOnward. Ctrl, Cmd,
    // Shift or Alt asks for another tab or window, so this page stays, the count
    // gets through on its own, and the browser does what was asked.
    onwardLink.addEventListener('click', (event) => {
      if (!event.isTrusted) return;
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) { countOnward(); return; }
      event.preventDefault();
      goOnward();
    });
  }
  const run = () => S.runs[S.tier];
  const solvedCount = () => S.runs.filter((r) => r.solved).length;
  // Offered once the day on screen is finished: before that, the day itself comes first.
  const onward = () => ONWARD !== null && solvedCount() === TIERS.length;
  const locked = () => run().solved && !S.practice;
  const history = () => (S.practice ? S.practiceInputs : run().inputs);
  const setHistory = (inputs) => { if (S.practice) S.practiceInputs = inputs; else run().inputs = inputs; };
  const touchTier = () => { if (!S.practice) S.dirty[S.tier] = true; };
  const liveStreak = () => (S.lastFull >= S.today - 1 ? S.streak : 0);
  const archive = () => S.day < S.today;
  const dayDate = (day) => new Date(EPOCH_UTC + (day - 1) * DAY_MS).toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' });
  const titleSummary = () => `Day ${S.day}${archive() ? `, ${dayDate(S.day)}, from the archive` : ''}. ${solvedCount()} of 3 puzzles solved.`;
  const digits = (text) => (typeof text === 'string' ? text.split('').map(Number).filter((d) => d >= 0 && d <= 3) : []);
  const wave = (speed, phase = 0) => (calm() ? 0 : Math.sin(S.clock * speed + phase));
  // A tween between two cells. Same cell means nothing moved, so nothing animates:
  // a zero-length slide would otherwise read as the fade a returning shadow uses.
  const slide = (from, to) => ({ from, to, t: from === to ? 1 : 0, bump: -1, bt: 1 });

  function spawnParts(x, y, color, count, speed = 160) {
    if (calm()) return;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
      S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, t: 0, color });
    }
  }
  const float = (x, y, message, color) => S.floats.push({ x, y, text: message, color, t: 0 });
  const toast = (message, spoken = message) => { S.toast = { text: message, t: 0 }; announce(spoken); };
  const shake = (amount) => { if (!calm()) S.shake = amount; };

  function describeBoard() {
    const p = puzzle();
    const list = (kind) => {
      const cells = [];
      for (let c = 0; c < CELLS; c++) if (p.board[c] === kind) cells.push(cellName(c));
      return cells.length ? cells.join(', ') : 'none';
    };
    return `Columns A to F run left to right, rows 1 to 6 run downward. Walls: ${list(WALL)}. Holes: ${list(HOLE)}. ` +
      `Sun ${cellName(p.sun)}, moon ${cellName(p.moon)}. ${describePieces(S)}`;
  }

  function describePieces(at) {
    const next = at.last < 0 ? 'waits this turn' : `steps ${DIR_NAMES[at.last]} next${doomed(puzzle().board, at.shadow, at.last) ? ', into a hole' : ''}`;
    return `You ${cellName(at.you)}. Shadow ${cellName(at.shadow)}, ${next}.`;
  }

  // ---- persistence ----
  // What the last save could not write, and the stored text it was built on.
  // While that text is unchanged, the snapshot is the store: a day change
  // reloads from it and must not undo the session so far. Once another tab has
  // saved, its save is the store again and this tab merges into it as usual; a
  // snapshot written over it erased that tab's solves and its streak.
  let unsaved = null, unsavedBase = null, lastRaw = null;

  function parseStore(raw) {
    try {
      const data = JSON.parse(raw || 'null');
      return data && typeof data === 'object' && data.days && typeof data.days === 'object' ? data : { days: {} };
    } catch { return { days: {} }; }
  }

  function readStore() {
    const raw = storage.get(STORE);
    if (unsaved && raw === unsavedBase) return unsaved;
    lastRaw = raw;
    const data = parseStore(raw);
    if (!unsaved) return data;
    // Another tab saved: its save is the store again, and the days only this
    // tab holds ride on it until a save of ours goes through.
    unsaved = carryUnsaved(data, unsaved, S.day, parseStore(unsavedBase));
    unsavedBase = raw;
    return unsaved;
  }

  /** Takes in what another tab saved: solved puzzles, moves spent, newer positions and the streak. */
  function absorb(data) {
    const saved = data.days[S.day];
    const current = S.runs.map((r) => ({ i: r.inputs.join(''), m: r.moves, s: r.solved ? r.solvedMoves : 0 }));
    const mine = S.runs.map((_, tier) => {
      const stored = Array.isArray(saved) && saved[tier] && typeof saved[tier].i === 'string' ? saved[tier].i : null;
      // A board mid-fall or mid-demo is not taken over; the next sync picks it up.
      const busy = tier === S.tier && (S.fall || S.demo);
      return ownsPosition(stored, S.seen[tier], S.dirty[tier]) || !!busy;
    });
    const merged = mergeDay(saved, current, mine);
    merged.forEach((entry, tier) => {
      const r = S.runs[tier];
      r.moves = entry.m;
      if (entry.s > 0) {
        S.seen[tier] = entry.i;
        if (r.solved && r.solvedMoves === entry.s) return;
        // Solved elsewhere, or solved in two tabs at once: the stored result is the one that counts.
        r.solved = true;
        r.solvedMoves = entry.s;
        if (tier === S.tier && !S.practice) {
          S.demo = null;
          S.fall = null;
          placeActors(puzzle().sun, puzzle().moon, -1);
          toast(`${TIERS[tier].label} was solved in another tab, in ${entry.s} moves.`);
        }
        return;
      }
      if (mine[tier]) return;
      S.seen[tier] = entry.i;
      if (entry.i === current[tier].i) return;
      const state = replay(S.puzzles[tier], digits(entry.i));
      r.inputs = state.inputs;
      if (tier === S.tier && !S.practice) {
        placeActors(state.you, state.shadow, state.last);
        announce(`Updated from another tab. ${describePieces(S)}`);
      }
    });
    const lastFull = Number(data.lastFull) || 0;
    if (lastFull > S.lastFull) {
      S.lastFull = lastFull;
      S.streak = Number(data.streak) || 0;
    }
    S.bestStreak = Math.max(S.bestStreak, Number(data.best) || 0);
    // While nothing of ours can be saved, the snapshot is the store: the open
    // day's merge lives there too, or leaving the day would drop it.
    if (unsaved && data === unsaved) unsaved.days[S.day] = merged;
    return merged;
  }

  const sync = () => { if (S.runs.length) absorb(readStore()); };

  // A finished day extends the streak, whichever tab solved which puzzle; the
  // rules (today only, forward only) are in the core, as streakAfter.
  function completeDay() {
    if (solvedCount() !== TIERS.length) return;
    const next = streakAfter(S.streak, S.lastFull, S.day, S.today);
    if (!next) return;
    S.streak = next.streak;
    S.lastFull = next.lastFull;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
  }

  /**
   * Merges and saves. Answers whether the store already held a solve of the
   * current puzzle: equal scores do not make two wins the same win.
   */
  function writeStore() {
    const data = readStore();
    const saved = data.days[S.day];
    const solvedThere = Array.isArray(saved) && saved[S.tier] && Number(saved[S.tier].s) > 0;
    const entries = absorb(data);
    data.days[S.day] = entries;
    completeDay();
    // Nothing is ever pruned. Pruning by the board's age deleted a result the
    // player had just saved on an old archive day, and a daily player adds
    // about 200 bytes a day: some 73 KB a year, against a quota of megabytes.
    data.streak = S.streak; data.best = S.bestStreak; data.lastFull = S.lastFull;
    if (storage.set(STORE, JSON.stringify(data))) {
      unsaved = null;
      entries.forEach((entry, tier) => { S.seen[tier] = entry.i; S.dirty[tier] = false; });
    } else {
      unsaved = data;
      unsavedBase = lastRaw;
      if (!S.storageWarned) {
        S.storageWarned = true;
        toast('This browser is not keeping your progress.');
      }
    }
    return !!solvedThere;
  }

  /** Opens a day's three puzzles: today, or any earlier day back to day 1. */
  function loadDay(day) {
    // Take in any save from another tab while the day on screen is still open,
    // so the carry keeps what this tab did on it.
    if (unsaved && S.runs.length) sync();
    S.today = dayNumber(new Date());
    day = Math.min(Math.max(1, day), S.today);
    S.day = day;
    S.newDay = false;
    S.puzzles = TIERS.map((_, tier) => makePuzzle(day, tier));
    const data = readStore();
    const saved = Array.isArray(data.days[day]) ? data.days[day] : [];
    S.streak = Number(data.streak) || 0;
    S.bestStreak = Number(data.best) || 0;
    S.lastFull = Number(data.lastFull) || 0;
    // Seen means what the store holds: a day opened from an unsaved snapshot
    // must still tell its own positions from another tab's later save.
    const stored = unsaved ? parseStore(unsavedBase).days[day] : saved;
    const pathOf = (entries, tier) => (Array.isArray(entries) && entries[tier] && typeof entries[tier].i === 'string' ? entries[tier].i : null);
    S.seen = TIERS.map((_, tier) => pathOf(stored, tier));
    // A snapshot position the store does not hold is a change not yet saved;
    // an untouched board is the same whether or not the store has a line for it.
    S.dirty = TIERS.map((_, tier) => (pathOf(saved, tier) ?? '') !== (S.seen[tier] ?? ''));
    S.runs = S.puzzles.map((p, tier) => {
      const entry = saved[tier] || {};
      const path = digits(entry.i);
      const solvedMoves = Number(entry.s) || 0;
      return { inputs: path, moves: Math.max(Number(entry.m) || 0, path.length), solved: solvedMoves > 0, solvedMoves };
    });
    const firstOpen = S.runs.findIndex((r) => !r.solved);
    selectTier(firstOpen < 0 ? 0 : firstOpen);
  }

  // What the thumbnail and the social card show (D-025): a board from the game's
  // own generator, part-way along its par line. Easy is solved at par, Medium is
  // seven moves in with you beside the sun and your shadow a step behind, Hard
  // is untouched. The day is fixed and never printed, the clock and the store
  // are not asked, and nothing moves: the same picture on any date.
  const POSE = { day: 764, tier: 1, inputs: '2230333' };

  function posePicture() {
    S.day = S.today = POSE.day;
    S.puzzles = TIERS.map((_, tier) => makePuzzle(POSE.day, tier));
    S.runs = S.puzzles.map((p, tier) => {
      const inputs = tier === POSE.tier ? digits(POSE.inputs) : [];
      const solvedMoves = tier < POSE.tier ? p.par : 0;
      return { inputs, moves: solvedMoves || inputs.length, solved: solvedMoves > 0, solvedMoves };
    });
    S.dirty = TIERS.map(() => false);
    S.seen = TIERS.map(() => null);
    selectTier(POSE.tier);
    S.mode = 'play';
  }

  function selectTier(tier) {
    S.tier = tier;
    S.practice = false;
    S.demo = null;
    S.fall = null;
    S.floats = [];
    S.parts = [];
    S.flash = 0;
    S.shake = 0;
    const p = puzzle();
    const state = replay(p, run().inputs);
    run().inputs = state.inputs;
    if (run().solved && !(state.you === p.sun && state.shadow === p.moon)) placeActors(p.sun, p.moon, -1);
    else placeActors(state.you, state.shadow, state.last);
  }

  function placeActors(you, shadow, last) {
    S.you = you; S.shadow = shadow; S.last = last;
    S.youAnim = slide(you, you);
    S.shadowAnim = slide(shadow, shadow);
  }

  // `start` once per unsolved puzzle per page load, however the player got to
  // it. Looking at a finished board again is not starting it.
  function markStart() {
    const key = `${S.day}:${S.tier}`;
    if (run().solved || started.has(key)) return;
    started.add(key);
    emit('start', { game: SLUG, day: S.day, tier: S.tier + 1, archive: archive() });
  }

  /**
   * The calendar moved on. Today's puzzles follow it; an archive day stays where
   * the player put it, and only the newest reachable day moves. Answers whether
   * a new day was loaded.
   */
  function followToday() {
    const today = dayNumber(new Date());
    if (today === S.today) return false;
    if (S.day !== S.today) { S.today = today; return false; }
    loadDay(today);
    return true;
  }

  function checkDay() {
    if (PICTURE || dayNumber(new Date()) === S.today) return;
    // Mid-puzzle on today's board, nothing is pulled away: it says so once.
    if (S.mode === 'play' && S.day === S.today) {
      if (!S.newDay) {
        S.newDay = true;
        toast(touch() ? 'New puzzles are out. Tap the home button.' : 'New puzzles are out. Press Esc.');
      }
      return;
    }
    followToday();
  }

  /** The previous or next day, from the title or mid-puzzle: it opens on that day's title screen. */
  function stepDay(delta) {
    const target = S.day + delta;
    if (target < 1 || target > dayNumber(new Date())) {
      sfx.bump();
      announce(target < 1 ? 'Day 1 is the first day.' : 'This is today. New puzzles come at midnight.');
      return;
    }
    S.mode = 'title';
    S.help = false;
    S.toast = null;
    loadDay(target);
    sfx.click();
    announce(titleSummary());
  }

  // ---- game flow ----
  function startPlay(tier) {
    ensureAudio();
    followToday();
    if (tier !== undefined && tier !== S.tier) selectTier(tier);
    S.mode = 'play';
    S.help = false;
    S.toast = null;
    sfx.click();
    markStart();
    announce(`Day ${S.day}, ${TIERS[S.tier].label} puzzle, par ${puzzle().par}. ${describeBoard()}`);
  }

  function goTitle() {
    S.mode = 'title';
    S.demo = null;
    S.help = false;
    S.practice = false;
    if (!followToday()) selectTier(S.tier);
    sfx.click();
    announce(titleSummary());
  }

  function move(dir) {
    if (S.mode !== 'play' || S.demo || S.fall) return;
    S.help = false;
    const wasSolved = run().solved;
    sync(); // another tab may have moved on, or solved this one
    if (run().solved && !wasSolved) return; // its notice is on screen; this key press is not a move
    if (locked()) {
      toast(touch() ? 'Solved. Tap Replay to practise it, or Next.' : 'Solved. R replays it for practice, N moves on.');
      sfx.bump();
      return;
    }
    ensureAudio();
    const p = puzzle();
    const r = turn(p.board, S.you, S.shadow, S.last, dir);
    const blocked = r.you === S.you;
    const moved = !blocked || r.shadow !== S.shadow;
    // The portal cannot see the board. Each counted move tells it how far this
    // puzzle has got, so a player who leaves unfinished leaves a number behind;
    // the portal keeps it to itself until then. Practice is not progress.
    if (S.practice) S.practiceMoves++;
    else { run().moves++; emit('progress', { moves: run().moves, tier: S.tier + 1, day: S.day, archive: archive() }); }
    touchTier();

    S.youAnim = blocked ? { from: S.you, to: S.you, t: 1, bump: dir, bt: 0 } : slide(S.you, r.you);
    if (blocked) sfx.bump(); else sfx.step();
    if (S.last >= 0) {
      if (r.shadow === S.shadow) S.shadowAnim = { from: S.shadow, to: S.shadow, t: 1, bump: S.last, bt: -SHADOW_DELAY / STEP_TIME };
      else { S.shadowAnim = { ...slide(S.shadow, r.shadow), t: -SHADOW_DELAY / STEP_TIME }; sfx.echo(); }
    }

    if (r.fell) {
      // Both moves stay counted: the lesson is the point, and the score is
      // honest about it. The rewind itself lives in the core (resolveFall).
      const back = resolveFall(p, history());
      setHistory(back.inputs);
      S.fall = { t: 0, back };
      S.you = r.you; S.shadow = r.shadow; S.last = dir;
      // Saved now, not after the animation: closing the tab mid-fall must not refund the move.
      if (!S.practice) writeStore();
      if (!S.fall) return; // the save found this puzzle solved in another tab, and said so
      sfx.fall();
      shake(6);
      float(cx(r.shadow), cy(r.shadow) - 22, 'fell', C.bad);
      announce(`Your shadow fell into a hole. The move that sent it there is taken back; both moves still count. ${describePieces(back)}`);
      return;
    }

    S.you = r.you; S.shadow = r.shadow; S.last = dir;
    history().push(dir);
    // The winning move is saved once, by solvedNow, with its result: saving the
    // position first told another tab "pieces on the goals, unsolved".
    // A practice board can stay on the goals; only a move that arrives finishes.
    if (moved && S.you === p.sun && S.shadow === p.moon) { solvedNow(); return; }
    if (!S.practice) {
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
    }
    if (doomed(p.board, S.shadow, S.last)) sfx.warn();
    announce(`${blocked ? 'Blocked. ' : ''}${describePieces(S)}`);
  }

  function finishFall() {
    const { back } = S.fall;
    const was = S.you;
    S.fall = null;
    S.you = back.you; S.shadow = back.shadow; S.last = back.last;
    S.youAnim = slide(was, back.you);
    // The shadow reappears where it stood before the move that aimed it at the hole.
    S.shadowAnim = { from: back.shadow, to: back.shadow, t: 0, bump: -1, bt: 1 };
    sync(); // anything another tab saved during the fall was held back until now
  }

  function celebrate(p) {
    sfx.win();
    if (!calm()) S.flash = 0.5;
    spawnParts(cx(p.sun), cy(p.sun), C.gold, 26, 220);
    spawnParts(cx(p.moon), cy(p.moon), C.lilac, 26, 220);
  }

  function solvedNow() {
    const p = puzzle();
    if (S.practice) {
      celebrate(p);
      const over = S.practiceMoves - p.par;
      toast(`Practice solved in ${S.practiceMoves}. ${over <= 0 ? 'Par!' : `${over} over par.`}`);
      return;
    }
    // Another tab may have solved this puzzle, or finished the day, a moment
    // ago. Its result stands, and it has already reported it.
    absorb(readStore());
    const r = run();
    if (r.solved) { writeStore(); return; } // the other tab's result and notice stand
    r.solved = true;
    r.solvedMoves = r.moves;
    // The save merges once more; if the store already held a solve of this
    // puzzle, that win was reported by its own tab and stands.
    if (writeStore()) return;
    celebrate(p);
    const over = r.solvedMoves - p.par;
    emit('gameover', { won: true, score: r.solvedMoves, par: p.par, tier: S.tier + 1, day: S.day, archive: archive() });
    const allDone = solvedCount() === TIERS.length;
    toast(`${over <= 0 ? 'Par! A star.' : `Solved, ${over} over par.`} ${allDone ? 'All three done.' : 'Next when ready.'}`);
  }

  function undo() {
    if (S.mode !== 'play' || S.demo || S.fall) return;
    sync();
    if (locked()) { announce('This puzzle is solved; undo is off. Replay it to practise.'); return; }
    const h = history();
    if (!h.length) { sfx.bump(); return; }
    const state = replay(puzzle(), h.slice(0, -1));
    setHistory(state.inputs);
    touchTier();
    const was = { you: S.you, shadow: S.shadow };
    S.you = state.you; S.shadow = state.shadow; S.last = state.last;
    S.youAnim = slide(was.you, state.you);
    S.shadowAnim = slide(was.shadow, state.shadow);
    if (!S.practice) {
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
    }
    sfx.undo();
    announce(`Undone. ${describePieces(S)}`);
  }

  function restart() {
    if (S.mode !== 'play' || S.fall) return;
    S.demo = null;
    const wasSolved = run().solved;
    sync(); // decides between a fresh start and practice, so it must know about other tabs
    if (run().solved && !wasSolved) return; // solved in another tab just now; that is news, not a practice request
    const p = puzzle();
    if (run().solved) {
      // A solved puzzle stays solved. Replaying it is practice, scored apart.
      S.practice = true;
      S.practiceMoves = 0;
      S.practiceInputs = [];
      toast('Practice run. Your result is already saved.');
    } else {
      run().inputs = [];
      touchTier();
      writeStore();
      if (run().solved) return; // solved in another tab meanwhile; the save said so
      toast(`Back to the start. The ${run().moves} moves so far still count.`);
    }
    const was = { you: S.you, shadow: S.shadow };
    S.you = p.you; S.shadow = p.shadow; S.last = -1;
    S.youAnim = slide(was.you, p.you);
    S.shadowAnim = slide(was.shadow, p.shadow);
    sfx.undo();
  }

  function nextPuzzle() {
    if (S.mode !== 'play') return;
    const open = [1, 2].map((k) => (S.tier + k) % TIERS.length).find((t) => !S.runs[t].solved);
    if (open === undefined) { goTitle(); return; }
    setTier(open);
  }

  function setTier(tier) {
    if (S.mode !== 'play' || S.fall || tier === S.tier) return;
    selectTier(tier);
    S.toast = null; // "solved" belongs to the puzzle just left
    sfx.click();
    markStart();
    announce(`${TIERS[tier].label} puzzle, par ${puzzle().par}. ${describeBoard()}`);
  }

  function showBestLine() {
    if (S.mode !== 'play' || S.fall) return;
    const wasSolved = run().solved;
    sync();
    if (run().solved && !wasSolved) return; // solved in another tab just now; its notice comes first
    // Only from a finished board: in a practice run this would throw the run away.
    if (!locked()) { announce(run().solved ? 'Leave the practice run (switch puzzle or go home) to see the par line.' : 'The par line opens once this puzzle is solved.'); return; }
    const { path } = solve(puzzle(), true);
    if (!path) return;
    placeActors(puzzle().you, puzzle().shadow, -1);
    S.help = false; // the rules panel would hide the whole demonstration
    S.demo = { path, i: 0, t: 0.4 };
    const spoken = `The par line: ${path.map((d) => DIR_NAMES[d]).join(', ')}.`;
    // In the compact shape the strip above the board already says it.
    if (L.heading) toast('Watch the par line.', spoken); else { S.toast = null; announce(spoken); }
  }

  function stepDemo() {
    const d = S.demo;
    const dir = d.path[d.i++];
    const r = turn(puzzle().board, S.you, S.shadow, S.last, dir);
    S.youAnim = r.you === S.you ? { from: S.you, to: S.you, t: 1, bump: dir, bt: 0 } : slide(S.you, r.you);
    if (S.last >= 0) {
      S.shadowAnim = r.shadow === S.shadow
        ? { from: S.shadow, to: S.shadow, t: 1, bump: S.last, bt: -SHADOW_DELAY / STEP_TIME }
        : { ...slide(S.shadow, r.shadow), t: -SHADOW_DELAY / STEP_TIME };
    }
    S.you = r.you; S.shadow = r.shadow; S.last = dir;
    sfx.step();
    if (d.i >= d.path.length) {
      S.demo = null;
      spawnParts(cx(S.you), cy(S.you), C.gold, 14);
      spawnParts(cx(S.shadow), cy(S.shadow), C.lilac, 14);
    }
  }

  function toggleMute() {
    S.muted = !S.muted;
    storage.set(STORE_MUTE, S.muted ? '1' : '0');
    if (S.muted) { if (audio) audio.suspend().catch(() => {}); }
    else { ensureAudio(); sfx.click(); }
    toast(S.muted ? 'Sound off' : 'Sound on');
  }

  // ---- onward ----
  // One count per decision. A second press while a slow phone is still opening
  // the next page is the same decision: it leaves again, but is not counted
  // again, or the one number this button exists to produce would be inflated.
  let countedAt = -Infinity;
  function countOnward() {
    const now = performance.now();
    if (now - countedAt < 10000) return;
    countedAt = now;
    emit('next_game', { day: S.day });
  }

  // The portal's sensor hears of this by message, and a message runs as a task
  // on the parent page: navigating on the same tick can unload that page first,
  // losing the count. A tenth of a second is less than a tap takes to feel slow.
  function goOnward() {
    if (!ONWARD) return;
    sfx.click();
    countOnward();
    setTimeout(() => onwardLink.click(), 100);
  }

  // ---- sharing ----
  function shareText() {
    const marks = S.runs.map((r, t) => shareMark(r.solved ? r.solvedMoves : 0, S.puzzles[t].par));
    // An archive day says so: "#3" posted on day 10 otherwise reads as played on the day.
    return `One Step Late #${S.day}${archive() ? ' (archive)' : ''}\n${marks.join('  ')}\n${SHARE_URL}`;
  }

  // `share` is reported only once the text really left: a cancelled sheet or a
  // refused clipboard is not a share, and this number is the growth loop.
  const shared = () => emit('share', { day: S.day, score: solvedCount() });
  let manualCopyCounted = false, focusBeforeCopy = null;
  const countCopy = () => { if (!manualCopyCounted) { manualCopyCounted = true; shared(); } };

  function share() {
    sync();
    if (!solvedCount()) { toast('Solve a puzzle first, then share it.'); return; }
    const message = shareText();
    // A phone gets the system share sheet; a desktop gets the clipboard, which is
    // what people there paste from. Either call has to run inside this gesture.
    if (touch() && navigator.share) {
      try {
        navigator.share({ text: message }).then(() => { shared(); toast('Shared'); }, (err) => {
          if (!err || err.name !== 'AbortError') copy(message);
        });
        return;
      } catch { /* some webviews throw instead of rejecting: copy instead */ }
    }
    copy(message);
  }

  function copy(message) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(message).then(() => { shared(); toast('Result copied. Paste it anywhere.'); }, () => openCopyBox(message));
        return;
      }
    } catch { /* fall through to the manual box */ }
    openCopyBox(message);
  }

  function openCopyBox(message) {
    copyText.value = message;
    if (copyBox.classList.contains('open')) return; // a second press while it is up
    manualCopyCounted = false;
    pressedBackdrop = releasedBackdrop = false;
    focusBeforeCopy = document.activeElement;
    copyBox.classList.add('open');
    // aria-modal only promises; inert keeps clicks and focus off the game behind it.
    canvas.inert = true;
    controls.inert = true;
    copyText.focus();
    copyText.setSelectionRange(0, message.length);
    try {
      if (document.execCommand('copy')) {
        countCopy();
        closeCopyBox();
        toast('Result copied. Paste it anywhere.');
      }
    } catch { /* the box stays open for a manual copy */ }
  }

  function closeCopyBox() {
    copyBox.classList.remove('open');
    canvas.inert = false;
    controls.inert = false;
    // Back to whatever opened it: the Share button in the controls, or the board.
    const back = focusBeforeCopy instanceof HTMLElement && focusBeforeCopy !== document.body ? focusBeforeCopy : canvas;
    back.focus({ preventScroll: true });
  }

  // A copy made by hand from the box is a share too; closing the box is not.
  copyText.addEventListener('copy', countCopy);
  copyClose.addEventListener('click', closeCopyBox);
  // The backdrop closes the dialog only when pressed and released on it: a text
  // selection dragged out of the box ends with a click on the backdrop too.
  // The release is checked where the pointer really is: a touch keeps the target
  // it started on even when the finger ends on the card.
  let pressedBackdrop = false, releasedBackdrop = false;
  // A press on the backdrop would take focus out of the dialog (and the
  // selection with it); only a full click on the backdrop leaves.
  copyBox.addEventListener('mousedown', (event) => { if (event.target === copyBox) event.preventDefault(); });
  copyBox.addEventListener('pointerdown', (event) => { pressedBackdrop = event.button === 0 && event.target === copyBox; });
  copyBox.addEventListener('pointerup', (event) => {
    releasedBackdrop = event.button === 0 && document.elementFromPoint(event.clientX, event.clientY) === copyBox;
  });
  copyBox.addEventListener('click', () => {
    const both = pressedBackdrop && releasedBackdrop;
    pressedBackdrop = releasedBackdrop = false;
    if (both) closeCopyBox();
  });
  copyBox.addEventListener('keydown', (event) => {
    // Handled here and stopped: on its way up to the window this Escape used to
    // find the dialog already closed and send the player to the title screen.
    event.stopPropagation();
    if (event.key === 'Escape') { event.preventDefault(); closeCopyBox(); return; }
    // aria-modal promises that focus stays here.
    if (event.key === 'Tab') {
      event.preventDefault();
      (document.activeElement === copyText ? copyClose : copyText).focus();
    }
  });

  // ---- update ----
  function update(dt) {
    S.clock += dt;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 24);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
    for (const a of [S.youAnim, S.shadowAnim]) {
      if (a.t < 1) a.t = Math.min(1, a.t + dt / STEP_TIME);
      if (a.bt < 1) a.bt = Math.min(1, a.bt + dt / 0.16);
    }
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.t += dt;
      if (p.t >= p.life) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.93; p.vy = p.vy * 0.93 + 180 * dt;
    }
    for (let i = S.floats.length - 1; i >= 0; i--) {
      S.floats[i].t += dt;
      if (S.floats[i].t > 1) S.floats.splice(i, 1);
    }
    if (S.toast) {
      S.toast.t += dt;
      if (S.toast.t > 3) S.toast = null;
    }
    if (S.fall) {
      S.fall.t += dt;
      if (S.fall.t >= FALL_TIME) finishFall();
    }
    if (S.demo) {
      S.demo.t -= dt;
      if (S.demo.t <= 0) { stepDemo(); if (S.demo) S.demo.t = DEMO_STEP; }
    }
    // A page left open over midnight must not keep offering yesterday.
    S.dayCheck -= dt;
    if (S.dayCheck <= 0) { S.dayCheck = 5; checkDay(); }
  }

  // ---- drawing ----
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
  const stars = Array.from({ length: 64 }, (_, i) => {
    const r = seeded(9001, i);
    return { x: r() * W, y: r() * 780, s: 0.6 + r() * 1.4, p: r() * 6.28 };
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.clientWidth || window.innerWidth, ch = canvas.clientHeight || window.innerHeight;
    // Below 480:780 both shapes are limited by width and scale alike, so the one
    // with the heading wins; above it the compact shape is always the larger.
    L = cw / ch > 0.62 ? LAYOUTS.compact : LAYOUTS.tall;
    view.dpr = dpr;
    view.scale = Math.min(cw / W, ch / L.H);
    view.ox = (cw - W * view.scale) / 2;
    view.oy = (ch - L.H * view.scale) / 2;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }

  const roundRect = (x, y, w, h, r) => {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  };

  function label(str, x, y, size, color, align = 'center', weight = '600', maxWidth = W) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y, maxWidth);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, L.H);
    g.addColorStop(0, '#120f2b');
    g.addColorStop(1, '#07061a');
    ctx.fillStyle = g;
    ctx.fillRect(-view.ox / view.scale, -view.oy / view.scale, W + (2 * view.ox) / view.scale, L.H + (2 * view.oy) / view.scale);
    ctx.fillStyle = '#d9d2ff';
    for (const s of stars) {
      if (s.y > L.H) continue;
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * wave(1.3, s.p));
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawOrb(x, y, r, look, kind, alpha = 1, scale = 1, spin = 0) {
    const you = kind === 'you';
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.scale(scale, scale);
    const glow = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.9);
    glow.addColorStop(0, you ? 'rgba(255, 209, 102, 0.34)' : 'rgba(140, 120, 240, 0.26)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2);
    ctx.fill();
    // The shadow wobbles a little: it is the same shape as you, and it should
    // never be mistaken for you at a glance.
    const wob = you ? 0 : wave(5) * 0.04;
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, you ? C.goldHi : C.shadeHi);
    body.addColorStop(1, you ? C.gold : C.shade);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * (1 + wob), r * (1 - wob), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = you ? C.goldDeep : C.lilac;
    ctx.lineWidth = 2;
    ctx.stroke();
    const lx = look >= 0 ? DX[look] * r * 0.18 : 0, ly = look >= 0 ? DY[look] * r * 0.18 : 0;
    ctx.fillStyle = you ? '#3a2600' : '#e4defe';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(side * r * 0.3 + lx, -r * 0.08 + ly, r * 0.1, r * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSun(x, y, size, lit) {
    ctx.save();
    ctx.globalAlpha = lit ? 1 : 0.85 + 0.15 * wave(2);
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 3;
    const turnAngle = calm() ? 0 : S.clock * 0.4;
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI / 4) * i + turnAngle;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * size * 0.31, y + Math.sin(a) * size * 0.31);
      ctx.lineTo(x + Math.cos(a) * size * 0.41, y + Math.sin(a) * size * 0.41);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMoon(x, y, size, lit, backdrop) {
    ctx.save();
    ctx.globalAlpha = lit ? 1 : 0.85 + 0.15 * wave(2, 1);
    ctx.strokeStyle = C.lilac;
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(x, y, size * 0.37, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.lilac;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.21, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = backdrop;
    ctx.beginPath();
    ctx.arc(x + size * 0.09, y - size * 0.06, size * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBoard() {
    const p = puzzle(), top0 = L.boardY;
    ctx.fillStyle = C.board;
    roundRect(BOARD_X - 6, top0 - 6, BOARD_W + 12, BOARD_H + 12, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(169, 156, 240, 0.22)';
    ctx.lineWidth = 2;
    ctx.stroke();
    for (let cell = 0; cell < CELLS; cell++) {
      const x = BOARD_X + (cell % COLS) * CELL, y = top0 + ((cell / COLS) | 0) * CELL;
      const kind = p.board[cell];
      if (kind === WALL) {
        ctx.fillStyle = C.wallEdge;
        roundRect(x + 4, y + 7, CELL - 8, CELL - 8, 10);
        ctx.fill();
        ctx.fillStyle = C.wall;
        roundRect(x + 4, y + 3, CELL - 8, CELL - 10, 10);
        ctx.fill();
        ctx.fillStyle = C.wallTop;
        roundRect(x + 10, y + 8, CELL - 20, 8, 4);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = (cell % COLS + ((cell / COLS) | 0)) % 2 ? C.tile : C.board;
      ctx.fillRect(x, y, CELL, CELL);
      // The two goal cells are tinted, so they read as places and not as decoration.
      if (cell === p.sun || cell === p.moon) {
        ctx.fillStyle = cell === p.sun ? 'rgba(255, 209, 102, 0.13)' : 'rgba(169, 156, 240, 0.15)';
        roundRect(x + 3, y + 3, CELL - 6, CELL - 6, 10);
        ctx.fill();
      }
      if (kind === HOLE) {
        const hx = x + CELL / 2, hy = y + CELL / 2;
        const g = ctx.createRadialGradient(hx, hy, 2, hx, hy, CELL * 0.38);
        g.addColorStop(0, '#000000');
        g.addColorStop(0.85, '#05041a');
        g.addColorStop(1, 'rgba(20, 10, 30, 1)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(hx, hy, CELL * 0.37, CELL * 0.33, 0, 0, Math.PI * 2);
        ctx.fill();
        // Holes are the only thing that can cost you a move, so their rim is the
        // one warm colour on the board apart from your own.
        ctx.strokeStyle = 'rgba(248, 113, 113, 0.6)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) { ctx.moveTo(BOARD_X + i * CELL, top0); ctx.lineTo(BOARD_X + i * CELL, top0 + BOARD_H); }
    for (let i = 1; i < ROWS; i++) { ctx.moveTo(BOARD_X, top0 + i * CELL); ctx.lineTo(BOARD_X + BOARD_W, top0 + i * CELL); }
    ctx.stroke();
    drawSun(cx(p.sun), cy(p.sun), CELL, S.you === p.sun);
    // The crescent is cut with the colour of the tinted cell under it.
    drawMoon(cx(p.moon), cy(p.moon), CELL, S.shadow === p.moon, (p.moon % COLS + ((p.moon / COLS) | 0)) % 2 ? '#2f2a54' : '#2b274b');
  }

  function actorPos(anim) {
    const k = ease(anim.t);
    let x = cx(anim.from) + (cx(anim.to) - cx(anim.from)) * k;
    let y = cy(anim.from) + (cy(anim.to) - cy(anim.from)) * k;
    if (anim.bump >= 0 && anim.bt >= 0 && anim.bt < 1) {
      const push = Math.sin(anim.bt * Math.PI) * 9;
      x += DX[anim.bump] * push;
      y += DY[anim.bump] * push;
    }
    return { x, y };
  }

  function drawArrow(x, y, dir, color, size = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((Math.PI / 2) * dir);
    ctx.scale(size, size);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(11, 3);
    ctx.lineTo(-11, 3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawActors() {
    const p = puzzle();
    const s = actorPos(S.shadowAnim);
    let alpha = 1, scale = 1, spin = 0;
    if (S.fall) {
      const k = Math.min(1, S.fall.t / FALL_TIME);
      alpha = 1 - k * 0.7;
      if (!calm()) { scale = Math.max(0.05, 1 - k); spin = k * 5; }
    } else if (S.shadowAnim.t < 1 && S.shadowAnim.from === S.shadowAnim.to) {
      alpha = 0.3 + 0.7 * Math.max(0, S.shadowAnim.t);
    }
    drawOrb(s.x, s.y, CELL * 0.27, S.last, 'shadow', alpha * 0.95, scale, spin);
    const you = actorPos(S.youAnim);
    drawOrb(you.x, you.y, CELL * 0.27, S.last, 'you');
    if (S.fall || S.mode !== 'play' || (locked() && !S.demo)) return;

    // What the shadow does next is already decided: it is the input you just
    // gave. Showing it turns guessing into planning, and red means it is too late.
    if (S.shadowAnim.t >= 1) {
      if (S.last >= 0) {
        const danger = doomed(p.board, S.shadow, S.last);
        const bob = (danger ? 5 : 3) * wave(danger ? 10 : 6);
        drawArrow(s.x + DX[S.last] * (CELL * 0.44 + bob), s.y + DY[S.last] * (CELL * 0.44 + bob), S.last, danger ? C.bad : C.lilac);
        if (danger) label('Undo!', s.x, s.y - CELL * 0.5, L.small, C.bad, 'center', '800');
      } else {
        label('waits', s.x, s.y - CELL * 0.48, L.small, C.lilac, 'center', '700');
      }
    }
    // Before the first move, name the two pieces: they are the same shape.
    if (!history().length && !S.demo) {
      label('you', you.x, you.y + CELL * 0.46, L.small, C.gold, 'center', '800');
      label('shadow', s.x, s.y + CELL * 0.46, L.small, C.lilac, 'center', '800');
    }
  }

  function drawParts() {
    for (const p of S.parts) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const f of S.floats) {
      ctx.globalAlpha = 1 - f.t;
      label(f.text, f.x, f.y - (calm() ? 0 : f.t * 30), 18, f.color, 'center', '800');
    }
    ctx.globalAlpha = 1;
  }

  // ---- buttons (logical rectangles; the same list draws and hit-tests) ----
  function row(items, y, h, x0 = 10, x1 = W - 10) {
    const gap = 8, w = (x1 - x0 - gap * (items.length - 1)) / items.length;
    return items.map(([id, text, primary], i) => ({ id, label: text, x: x0 + i * (w + gap), y, w, h, primary }));
  }

  function icons(withHome) {
    const size = L.icon, right = W - (L.heading ? 10 : 6);
    const list = [{ id: 'mute', icon: 'sound', x: right - size, y: L.iconY, w: size, h: size }];
    if (withHome) list.push({ id: 'home', icon: 'home', x: right - 2 * size - 6, y: L.iconY, w: size, h: size });
    return list;
  }

  function buttons() {
    if (S.mode === 'title') {
      const T = L.title;
      const list = icons(false).concat(dayArrows(), row(TIERS.map((t, i) => [`card${i}`, t.label]), T.cards, 60).map((b) => ({ ...b, card: true })));
      if (onward()) list.push(...row([['share', archive() ? `Share Day ${S.day}` : 'Share', true], ['onward', `Play ${ONWARD.title}`]], T.share, L.buttonH, 20, W - 20));
      else if (solvedCount()) list.push({ id: 'share', label: archive() ? `Share Day ${S.day}` : 'Share today’s result', x: 80, y: T.share, w: W - 160, h: L.buttonH, primary: true });
      return list;
    }
    const y = L.boardY + BOARD_H + (L.heading ? 18 : 12), h = L.buttonH;
    const key = (k) => (touch() ? '' : `  ${k}`);
    if (locked()) {
      const allDone = solvedCount() === TIERS.length;
      return icons(true).concat(row([
        ['next', allDone ? 'Done' : 'Next', true],
        ['share', 'Share', true],
        ['best', S.demo ? 'Playing' : 'Par line'],
        ['restart', 'Replay'],
      ], y, h));
    }
    return icons(true).concat(row([
      ['undo', `Undo${key('U')}`],
      ['restart', `Restart${key('R')}`],
      ['help', `${S.help ? 'Close' : 'Rules'}${key('H')}`],
    ], y, h));
  }

  // Either side of the day line on the title screen, each only where there is a day to go to.
  const ARROW = 56;
  function dayArrows() {
    const y = L.title.day - ARROW / 2, list = [];
    if (S.day > 1) list.push({ id: 'prevday', icon: 'prev', x: 14, y, w: ARROW, h: ARROW });
    if (S.day < S.today) list.push({ id: 'nextday', icon: 'next', x: W - 14 - ARROW, y, w: ARROW, h: ARROW });
    return list;
  }

  function tabs() {
    const x1 = L.heading ? W - 10 : W - 6 - 2 * L.icon - 12;
    return row(TIERS.map((t, i) => [`tier${i}`, t.label]), L.tabsY, L.tabH, L.heading ? 10 : 6, x1).map((b, i) => ({ ...b, tier: i }));
  }

  const inside = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

  function drawIcon(b) {
    const x = b.x + b.w / 2, y = b.y + b.h / 2;
    ctx.fillStyle = S.hover === b.id ? '#262150' : '#1b1740';
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(169, 156, 240, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = C.text;
    ctx.strokeStyle = C.text;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    if (b.icon === 'home') {
      ctx.beginPath();
      ctx.moveTo(x - 11, y - 1); ctx.lineTo(x, y - 11); ctx.lineTo(x + 11, y - 1);
      ctx.moveTo(x - 7, y - 4); ctx.lineTo(x - 7, y + 10); ctx.lineTo(x + 7, y + 10); ctx.lineTo(x + 7, y - 4);
      ctx.stroke();
    } else if (b.icon === 'prev' || b.icon === 'next') {
      const back = b.icon === 'prev' ? 1 : -1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 5 * back, y - 11); ctx.lineTo(x - 6 * back, y); ctx.lineTo(x + 5 * back, y + 11);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 4); ctx.lineTo(x - 7, y - 4); ctx.lineTo(x, y - 10);
      ctx.lineTo(x, y + 10); ctx.lineTo(x - 7, y + 4); ctx.lineTo(x - 12, y + 4);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      if (S.muted) {
        ctx.moveTo(x + 5, y - 5); ctx.lineTo(x + 13, y + 5);
        ctx.moveTo(x + 13, y - 5); ctx.lineTo(x + 5, y + 5);
      } else {
        ctx.arc(x + 3, y, 6, -0.9, 0.9);
        ctx.moveTo(x + 7.5, y - 9.5);
        ctx.arc(x + 3, y, 11, -0.9, 0.9);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  function drawButton(b) {
    if (b.icon) { drawIcon(b); return; }
    if (b.card) { drawTierCard(b, Number(b.id.slice(4)), S.hover === b.id); return; }
    const down = S.press && S.press.id === b.id;
    const hot = S.hover === b.id;
    ctx.fillStyle = b.primary ? (down ? C.goldDeep : C.gold) : down ? '#2a2552' : hot ? '#262150' : '#1e1a42';
    roundRect(b.x, b.y + (down ? 2 : 0), b.w, b.h, 12);
    ctx.fill();
    if (!b.primary) {
      ctx.strokeStyle = 'rgba(169, 156, 240, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    label(b.label, b.x + b.w / 2, b.y + b.h / 2 + (down ? 2 : 0), 17, b.primary ? '#1a1300' : C.text, 'center', '700', b.w - 20);
  }

  /** "★ 5 moves" at par, "7 moves, +2" above it: one notation everywhere. */
  function resultText(moves, par) {
    const over = moves - par;
    return over <= 0 ? `★ ${moves} moves` : `${moves} moves, +${over}`;
  }

  function drawTierCard(b, tier, active) {
    const r = S.runs[tier], p = S.puzzles[tier];
    ctx.fillStyle = active ? '#262150' : '#17143a';
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = active ? C.gold : r.solved ? 'rgba(255, 209, 102, 0.45)' : 'rgba(169, 156, 240, 0.25)';
    ctx.lineWidth = active ? 2 : 1.5;
    ctx.stroke();
    const size = L.tabText;
    label(`${TIERS[tier].name} · ${TIERS[tier].label}`, b.x + b.w / 2, b.y + b.h * 0.32, size + 1, active || r.solved ? C.text : C.muted, 'center', '700', b.w - 8);
    label(r.solved ? resultText(r.solvedMoves, p.par) : `par ${p.par}`, b.x + b.w / 2, b.y + b.h * 0.7, size, r.solved ? C.gold : C.muted, 'center', '600', b.w - 8);
  }

  function drawDemoStrip(x, y) {
    const { path, i } = S.demo;
    const step = Math.min(22, 250 / path.length);
    path.forEach((dir, k) => {
      const color = k === i - 1 ? C.gold : k < i ? C.text : 'rgba(168, 162, 208, 0.55)';
      drawArrow(x + k * step + step / 2, y, dir, color, step / 26);
    });
  }

  function drawHud() {
    if (L.heading) {
      label('One Step Late', 12, 24, 21, C.text, 'left', '800');
      if (!PICTURE) label(`Day ${S.day}${archive() ? ' · archive' : ''}`, 12, 48, 16, C.gold, 'left', '700');
    }
    for (const t of tabs()) drawTierCard(t, t.tier, t.tier === S.tier);
    const p = puzzle(), r = run();
    const y = L.infoY;
    const day = L.heading || PICTURE ? '' : `Day ${S.day} · `;
    if (S.toast && toastOverInfo()) {
      // the toast is drawn here instead, for its three seconds
    } else if (S.newDay && !L.heading) {
      label(touch() ? 'New puzzles are out: tap home' : 'New puzzles are out: press Esc', BOARD_X, y, 17, C.gold, 'left', '800');
    } else if (S.demo) {
      label('Par line', BOARD_X, y, 18, C.text, 'left', '800');
      drawDemoStrip(BOARD_X + 84, y);
      label(`par ${p.par}`, BOARD_X + BOARD_W, y, 18, C.muted, 'right', '800');
    } else if (locked()) {
      const over = r.solvedMoves - p.par;
      label(`${day}Solved in ${r.solvedMoves}`, BOARD_X, y, 19, C.text, 'left', '800');
      label(over <= 0 ? '★ par' : `par ${p.par}, +${over}`, BOARD_X + BOARD_W, y, 19, C.gold, 'right', '800');
    } else {
      const moves = S.practice ? S.practiceMoves : r.moves;
      const over = moves - p.par;
      label(S.practice ? `Practice · ${moves} moves` : `${day}Moves ${moves}`, BOARD_X, y, 19, C.text, 'left', '800');
      const color = moves <= p.par ? C.good : over <= 2 ? C.warn : C.bad;
      label(`par ${p.par} (fewest possible)`, BOARD_X + BOARD_W, y, 16, color, 'right', '700');
    }
  }

  const RULES = [
    ['You step where you choose.', C.text],
    ['Then your shadow repeats the move', C.lilac],
    ['you made the turn before.', C.lilac],
    ['The arrow on it is that next step.', C.muted],
    ['You never walk into a hole.', C.text],
    ['Your shadow does. The move that aimed', C.bad],
    ['it there is taken back, and still counts.', C.bad],
    ['Walls, edges and each other block you;', C.muted],
    ['a blocked move still counts and is copied.', C.muted],
    ['Finish with you on the sun and your', C.gold],
    ['shadow on the moon, at the same time.', C.gold],
    ['Every move counts: undo and restart', C.text],
    ['do not give moves back.', C.text],
  ];
  const rulesText = () => RULES.map(([line]) => line).join(' ');

  function toggleHelp() {
    S.help = !S.help;
    sfx.click();
    if (S.help) announce(rulesText());
  }

  function drawHelp() {
    ctx.fillStyle = 'rgba(10, 8, 28, 0.94)';
    roundRect(BOARD_X - 6, L.boardY - 6, BOARD_W + 12, BOARD_H + 12, 14);
    ctx.fill();
    RULES.forEach(([str, color], i) => label(str, W / 2, L.boardY + 36 + i * 32, 17, color, 'center', '600'));
  }

  function drawFooter(y) {
    if (S.toast || !y) return;
    if (S.newDay) { label(touch() ? 'New puzzles are out: tap the home button' : 'New puzzles are out: press Esc', W / 2, y, 15, C.gold, 'center', '700'); return; }
    if (touch()) { label('Swipe, or tap toward a cell', W / 2, y, 15, C.muted, 'center', '500'); return; }
    const hint = S.mode === 'title'
      ? S.today > 1 ? 'Arrows or WASD · U undo · R restart · < > other days' : 'Arrow keys or WASD · U undo · R restart · L reads the board'
      : 'Arrows or WASD · 1 2 3 switch · Esc home · M sound';
    label(hint, W / 2, y, 15, C.muted, 'center', '500');
  }

  function drawPlay() {
    drawHud();
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBoard();
    drawActors();
    drawParts();
    ctx.restore();
    if (S.help) drawHelp();
    for (const b of buttons()) drawButton(b);
    drawFooter(L.footerY);
  }

  function untilMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
