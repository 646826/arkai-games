<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>One Step Late — Arkai</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b1f; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  /* dvh where it exists: on iOS 100vh is taller than the visible page while the
     address bar shows, which pushed the buttons under it and offset every tap. */
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; cursor: pointer; }
  /* The browser decides when focus should show. Chrome also shows it once a
     player who clicked starts using the arrows, so the ring is kept quiet:
     2px at 45% gold still clears 3:1 against the page. */
  canvas:focus-visible { outline: 2px solid rgba(255, 209, 102, 0.45); outline-offset: -2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The same actions as the canvas buttons, for screen readers and the Tab key.
     Hidden until one of them has focus, then shown as a bar. */
  #controls:focus-within { position: fixed; left: 8px; right: 8px; bottom: 8px; width: auto; height: auto; clip: auto; white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 12px; background: #1a1636; border: 1px solid #3b3470; }
  #controls button, #controls a { min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; padding: 0 12px; border-radius: 10px; border: 1px solid #3b3470; background: #1e1a42; color: #ece9ff; font: 600 16px system-ui, sans-serif; }
  #controls a[hidden] { display: none; }
  #controls button:focus, #controls a:focus { outline: 2px solid #ffd166; }
  #copybox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 6, 20, 0.82); }
  #copybox.open { display: flex; }
  #copybox .card { width: min(92vw, 420px); box-sizing: border-box; padding: 18px; border-radius: 16px; background: #1a1636; border: 1px solid #3b3470; color: #ece9ff; }
  #copybox p { margin: 0 0 10px; font-size: 16px; line-height: 1.4; }
  #copybox textarea { width: 100%; height: 100px; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #3b3470; background: #0d0b1f; color: #ffe7a8; font: 16px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: none; -webkit-user-select: text; user-select: text; }
  #copybox button { margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: #ffd166; color: #1a1300; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="One Step Late, a daily puzzle. Move with the arrow keys or WASD. Your shadow repeats your previous move one turn late. Bring yourself to the sun and your shadow to the moon at the same time. L describes the board, U undoes, R restarts, H shows the rules. Comma and period open the previous or next day. Press Tab for buttons."></canvas>
<div id="status" class="sr" aria-live="polite"></div>
<div id="controls" class="sr" role="group" aria-label="Game controls">
  <button type="button" data-act="dir0">Move up</button>
  <button type="button" data-act="dir1">Move right</button>
  <button type="button" data-act="dir2">Move down</button>
  <button type="button" data-act="dir3">Move left</button>
  <button type="button" data-act="undo">Undo</button>
  <button type="button" data-act="restart">Restart</button>
  <button type="button" data-act="board">Describe the board</button>
  <button type="button" data-act="help">Rules</button>
  <button type="button" data-act="best">Show the par line of a solved puzzle</button>
  <button type="button" data-act="next">Next puzzle</button>
  <button type="button" data-act="share">Share result</button>
  <a id="onward" href="#" target="_top" hidden>Play the next daily puzzle</a>
  <button type="button" data-act="card0">Easy puzzle</button>
  <button type="button" data-act="card1">Medium puzzle</button>
  <button type="button" data-act="card2">Hard puzzle</button>
  <button type="button" data-act="mute">Sound on or off</button>
  <button type="button" data-act="home">Title screen</button>
  <button type="button" data-act="prevday">Previous day</button>
  <button type="button" data-act="nextday">Next day</button>
</div>
<div id="copybox" role="dialog" aria-modal="true" aria-labelledby="copytitle">
  <div class="card">
    <p id="copytitle">Your browser would not copy by itself. Select the text below, copy it, and paste it anywhere.</p>
    <textarea id="copytext" readonly></textarea>
    <button id="copyclose" type="button">Done</button>
  </div>
</div>
<script>
(() => {
  'use strict';

  // ---- puzzle core begin ----
  // Everything between the two markers is pure: no DOM, no clock, no storage.
  // scripts/tests/one-step-late.test.mjs runs this block on its own, because the
  // one promise a daily puzzle makes is that puzzle #N is the same board for
  // everyone, forever. A change here that renumbers or reshapes old days breaks
  // every result anyone has already shared, and that test exists to say so.

  const COLS = 6, ROWS = 6, CELLS = COLS * ROWS;
  const FLOOR = 0, WALL = 1, HOLE = 2;
  // Directions are indices, 0 up, 1 right, 2 down, 3 left, so an input history
  // stores as a string of digits and the share text never has to describe a move.
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];

  // Day 1 is the launch date. Moving it renumbers every puzzle ever shared.
  const EPOCH_UTC = Date.UTC(2026, 8, 16);
  const DAY_MS = 86400000;
  // A missed day need not always end the streak: one grace per this many days, spent automatically.
  const FREEZE_COOLDOWN = 30;

  // The whole difficulty curve. `lead` is how many moves the shadow must add to
  // the walk you would take alone: a puzzle where you can ignore your shadow is a
  // maze, not this game, and it is rejected rather than shipped.
  const TIERS = [
    { name: 'I', label: 'Easy', par: [5, 7], lead: 2, walls: [5, 8], holes: [1, 3] },
    { name: 'II', label: 'Medium', par: [8, 11], lead: 3, walls: [5, 9], holes: [2, 4] },
    { name: 'III', label: 'Hard', par: [12, 16], lead: 4, walls: [6, 10], holes: [2, 5] },
  ];
  // At most this many distinct move sequences reach the goal in par moves. A
  // board with dozens of optimal lines reads as "I got lucky", not "I found it".
  const MAX_OPTIMAL_LINES = 2;
  const MAX_ATTEMPTS = 4000;

  const neighbour = (cell, dir) => {
    const x = (cell % COLS) + DX[dir], y = ((cell / COLS) | 0) + DY[dir];
    return x < 0 || y < 0 || x >= COLS || y >= ROWS ? -1 : y * COLS + x;
  };

  /**
   * One turn. You step first: walls, the edge, holes and your shadow stop you —
   * you can see the holes. Then your shadow repeats the input you gave on the
   * previous turn (on the very first turn it has nothing to repeat and waits).
   * Walls, the edge and you stop it. Holes do not: it steps in and falls.
   */
  function turn(board, you, shadow, last, dir) {
    let nextYou = neighbour(you, dir);
    if (nextYou < 0 || board[nextYou] !== FLOOR || nextYou === shadow) nextYou = you;
    if (last < 0) return { you: nextYou, shadow, fell: false };
    let nextShadow = neighbour(shadow, last);
    if (nextShadow < 0 || board[nextShadow] === WALL || nextShadow === nextYou) nextShadow = shadow;
    return { you: nextYou, shadow: nextShadow, fell: board[nextShadow] === HOLE };
  }

  /**
   * True when the shadow's next step is already a hole. Its next step is the
   * input you gave last, and you can never stand in a hole to block it, so from
   * here every move drops it: the mistake was the previous input, not the next.
   */
  function doomed(board, shadow, last) {
    if (last < 0) return false;
    const n = neighbour(shadow, last);
    return n >= 0 && board[n] === HOLE;
  }

  /**
   * Fewest turns to the goal, by breadth-first search over (you, shadow, last
   * input), plus how many different input sequences reach it in that many turns.
   */
  function solve(puzzle, wantPath, maxDepth = 63) {
    const { board, you, shadow, sun, moon } = puzzle;
    const id = (a, b, last) => (a * CELLS + b) * 5 + last + 1;
    const dist = new Int8Array(CELLS * CELLS * 5).fill(-1);
    const ways = new Float64Array(dist.length);
    const from = wantPath ? new Int32Array(dist.length) : null;
    let frontier = [id(you, shadow, -1)];
    dist[frontier[0]] = 0;
    ways[frontier[0]] = 1;
    for (let depth = 1; frontier.length && depth <= maxDepth; depth++) {
      const next = [];
      for (const state of frontier) {
        const last = (state % 5) - 1, pair = (state / 5) | 0;
        const a = (pair / CELLS) | 0, b = pair % CELLS;
        for (let dir = 0; dir < 4; dir++) {
          const r = turn(board, a, b, last, dir);
          if (r.fell) continue;
          const key = id(r.you, r.shadow, dir);
          if (dist[key] < 0) {
            dist[key] = depth;
            if (from) from[key] = state;
            next.push(key);
          }
          if (dist[key] === depth) ways[key] += ways[state];
        }
      }
      let lines = 0, firstWin = -1;
      for (const key of next) {
        const pair = (key / 5) | 0;
        if (((pair / CELLS) | 0) !== sun || pair % CELLS !== moon) continue;
        lines += ways[key];
        if (firstWin < 0) firstWin = key;
      }
      if (lines) {
        let path = null;
        if (from) {
          path = [];
          for (let key = firstWin; dist[key] > 0; key = from[key]) path.push((key % 5) - 1);
          path.reverse();
        }
        return { par: depth, lines, path };
      }
      frontier = next;
    }
    return { par: Infinity, lines: 0, path: null };
  }

  /** Fewest steps for you alone, shadow ignored: the maze underneath the puzzle. */
  function walkAlone(board, from, to) {
    const seen = new Uint8Array(CELLS);
    seen[from] = 1;
    let frontier = [from];
    for (let depth = 1; frontier.length; depth++) {
      const next = [];
      for (const cell of frontier) {
        for (let dir = 0; dir < 4; dir++) {
          const n = neighbour(cell, dir);
          if (n < 0 || board[n] !== FLOOR || seen[n]) continue;
          if (n === to) return depth;
          seen[n] = 1;
          next.push(n);
        }
      }
      frontier = next;
    }
    return Infinity;
  }

  // mulberry32 over an FNV-1a mix of the inputs: integer arithmetic only, so
  // every engine draws the same board from the same day.
  function seeded(...parts) {
    let h = 2166136261 >>> 0;
    for (const part of parts) {
      h = Math.imul(h ^ (part & 0xffff), 16777619) >>> 0;
      h = Math.imul(h ^ (part >>> 16), 16777619) >>> 0;
    }
    let a = h | 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function draw(day, tier, attempt) {
    const spec = TIERS[tier];
    const rand = seeded(day, tier, attempt);
    const between = ([lo, hi]) => lo + Math.floor(rand() * (hi - lo + 1));
    const walls = between(spec.walls), holes = between(spec.holes);
    const order = Array.from({ length: CELLS }, (_, i) => i);
    for (let i = CELLS - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const swap = order[i]; order[i] = order[j]; order[j] = swap;
    }
    const board = new Uint8Array(CELLS);
    let k = 0;
    for (let i = 0; i < walls; i++) board[order[k++]] = WALL;
    for (let i = 0; i < holes; i++) board[order[k++]] = HOLE;
    return { board, you: order[k], shadow: order[k + 1], sun: order[k + 2], moon: order[k + 3] };
  }

  /** A board that always works, for a day the generator cannot fill. */
  function fallbackPuzzle(day, tier) {
    const board = new Uint8Array(CELLS);
    board[14] = WALL;
    board[21] = HOLE;
    const puzzle = { board, you: 0, shadow: 5, sun: 32, moon: 35 };
    return { ...puzzle, par: solve(puzzle, false).par, day, tier, attempt: -1 };
  }

  /** The puzzle for a day and tier. Same arguments, same board, on any machine. */
  function makePuzzle(day, tier) {
    const spec = TIERS[tier];
    for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
      const puzzle = draw(day, tier, attempt);
      // A board longer than the tier allows is rejected anyway; stop looking there.
      const { par, lines } = solve(puzzle, false, spec.par[1]);
      if (par < spec.par[0] || par > spec.par[1] || lines > MAX_OPTIMAL_LINES) continue;
      if (par - walkAlone(puzzle.board, puzzle.you, puzzle.sun) < spec.lead) continue;
      return { ...puzzle, par, day, tier, attempt };
    }
    // Ten years of days were generated in testing and none got here. If one
    // ever does, a plain board beats a frozen tab.
    return fallbackPuzzle(day, tier);
  }

  /** Where a stored input history leaves the pieces. A history never contains a fall. */
  function replay(puzzle, inputs) {
    let you = puzzle.you, shadow = puzzle.shadow, last = -1;
    const kept = [];
    for (const dir of inputs) {
      const r = turn(puzzle.board, you, shadow, last, dir);
      if (r.fell) break; // only a corrupt store gets here
      you = r.you; shadow = r.shadow; last = dir;
      kept.push(dir);
    }
    return { you, shadow, last, inputs: kept };
  }

  /**
   * What a fall leaves behind. The shadow's step was the previous input, so the
   * state just before the fall was already doomed; the input that aimed it is
   * taken back too. That state is never doomed: its own step went through.
   */
  function resolveFall(puzzle, inputs) {
    return replay(puzzle, inputs.slice(0, -1));
  }

  /**
   * One day's saved results, merged with what this tab holds. Two tabs of the
   * same game write to one store; the later write must not unsolve a puzzle the
   * other tab solved, or lower a move count the player already spent.
   * For an unsolved puzzle the position is this tab's only where `mine[tier]`
   * says so: the tab changed it and has not saved yet, or the store still holds
   * what the tab last saw. Otherwise another tab moved on and its position wins.
   * Entries are { i: input digits, m: moves spent, s: moves at first solve or 0 }.
   */
  function mergeDay(saved, current, mine) {
    return current.map((cur, tier) => {
      const old = (Array.isArray(saved) && saved[tier]) || {};
      const m = Math.max(Number(old.m) || 0, cur.m);
      const oldPath = typeof old.i === 'string' ? old.i : null;
      if (Number(old.s) > 0) return { i: oldPath ?? cur.i, m, s: Number(old.s) };
      const ours = !mine || mine[tier] || oldPath === null;
      return { i: ours ? cur.i : oldPath, m, s: cur.s };
    });
  }

  /**
   * Whether this tab's position on a puzzle should win a merge: it changed the
   * puzzle and has not saved yet, or the store still holds what it last saw.
   * Anything else means another tab moved on since.
   */
  function ownsPosition(stored, seen, dirty) {
    return !!dirty || stored === null || stored === seen;
  }

  /**
   * What a saved board holds that is the player's own doing: the path, and any
   * notes written on it. A missing line and an untouched board read the same.
   */
  function boardKey(entries, tier) {
    const e = Array.isArray(entries) && entries[tier];
    return e ? `${typeof e.i === 'string' ? e.i : ''}|${typeof e.g === 'string' ? e.g : ''}` : '|';
  }

  /**
   * What a tab could not save, carried onto a store another tab has written
   * since. `base` is the store the snapshot was built on: a position this tab
   * changed from it wins, one it did not change is the other tab's to move on.
   * The open day is left to absorb, which holds it in memory. Dropping the
   * snapshot whole lost every unsaved day but the one on screen; letting it win
   * everywhere rolled the other tab back. The streak comes from whichever side
   * finished the later day.
   */
  function carryUnsaved(fresh, snapshot, openDay, base) {
    const days = { ...fresh.days };
    for (const [day, entries] of Object.entries(snapshot.days || {})) {
      if (Number(day) === openDay || !Array.isArray(entries)) continue;
      const was = base && base.days ? base.days[day] : undefined;
      days[day] = mergeDay(days[day], entries, entries.map((_, tier) => boardKey(entries, tier) !== boardKey(was, tier)));
    }
    const from = (Number(snapshot.lastFull) || 0) > (Number(fresh.lastFull) || 0) ? snapshot : fresh;
    return { ...fresh, days, streak: from.streak, lastFull: from.lastFull, freezeUsedDay: from.freezeUsedDay, best: Math.max(Number(fresh.best) || 0, Number(snapshot.best) || 0) };
  }

  // Movement is positional: arrows, and WASD by where the keys sit, so ZQSD
  // walks on AZERTY. Commands are read by the printed letter, so Z undoes on
  // QWERTZ; a non-Latin letter falls back to the Latin one on the same key, so
  // U still undoes on a Cyrillic layout. Where a layout prints a command on a
  // WASD position (Colemak R on S, Workman H on D) the position wins: a lost
  // letter has a button, while R read as a restart would throw progress away.
  const KEY_DIRS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  const ARROW_DIRS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
  // The punctuation that steps through days, by position, for layouts that print a letter there.
  const PUNCT_KEYS = { Comma: ',', Period: '.' };
  const own = (table, name) => Object.prototype.hasOwnProperty.call(table, name);

  /** What a key press means: a direction, a puzzle digit, or a command letter. */
  function readKey(rawCode, rawKey) {
    const code = String(rawCode || ''), key = String(rawKey || '');
    // An arrow is an arrow whatever reported it: the numpad with NumLock off,
    // a remapper, or an on-screen keyboard that sends no physical code at all.
    let dir = own(ARROW_DIRS, key) ? ARROW_DIRS[key] : own(KEY_DIRS, code) ? KEY_DIRS[code] : -1;
    // With it on, 1 2 3 pick a puzzle; the top row counts by position, since
    // AZERTY types symbols there without Shift.
    const digit = /^Digit[123]$/.test(code) || (/^Numpad[123]$/.test(code) && /^[123]$/.test(key)) ? Number(code.slice(-1)) - 1 : -1;
    let letter = key.length === 1 ? key.toLowerCase() : key;
    // Only for other scripts: Turkish ı on the R key is a Latin letter, and
    // reading it as R would restart the puzzle. Thai vowels are marks, not letters.
    // Checked on the whole key, which can be two code points (Arabic لا on B).
    // Cyrillic puts б and ю where the comma and period are; those count by position too.
    if (/^[\p{L}\p{M}]+$/u.test(key) && /[^\p{Script=Latin}\p{Script=Inherited}\p{Script=Common}]/u.test(key)) {
      if (/^Key[A-Z]$/.test(code)) letter = code.slice(3).toLowerCase();
      else if (own(PUNCT_KEYS, code)) letter = PUNCT_KEYS[code];
    }
    return { dir, digit, letter: dir >= 0 ? '' : letter };
  }

  /** -1, +1 or 0: whether a key steps to the previous day, the next, or neither. */
  function dayStep(letter) {
    if (letter === ',' || letter === '<' || letter === '[') return -1;
    if (letter === '.' || letter === '>' || letter === ']') return 1;
    return 0;
  }

  /** Day number for a local calendar date: the puzzle turns over at your midnight, like every daily. */
  function dayNumber(date) {
    const utc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.max(1, Math.floor((utc - EPOCH_UTC) / DAY_MS) + 1);
  }

  /**
   * The day named by the archive picker's `?date=YYYY-MM-DD` (see
   * /archive/ and frame-forward.js), or null if the param is absent,
   * malformed, or not a real calendar date. y/m/d are treated as the
   * visitor's own local calendar date, exactly like `dayNumber(new Date())`
   * is at boot — reused via a plain date-like object instead of a real
   * `new Date(y, mo, d)`, which the puzzle core's own purity test below
   * forbids inside this block. Needs no upper/lower bound of its own: a
   * date before day one or after today comes out exactly like never having
   * loaded the param, because `loadDay` already clamps both ends for
   * prevday/nextday.
   */
  function daysInMonth(y, mo) {
    if (mo === 1) return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0) ? 29 : 28;
    return [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo];
  }
  function dayFromDateParam(raw) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw || '');
    if (!m) return null;
    const y = Number(m[1]), mo = Number(m[2]) - 1, d = Number(m[3]);
    if (mo < 0 || mo > 11 || d < 1 || d > daysInMonth(y, mo)) return null;
    return dayNumber({ getFullYear: () => y, getMonth: () => mo, getDate: () => d });
  }

  /**
   * The streak once all three puzzles of `day` are solved, or null if it does
   * not change. Only on the day itself: finishing yesterday from the archive
   * would buy a missed day back. Only forward: a day already counted, by this
   * tab or another, is not counted again. A single missed day still extends
   * the streak, and marks `freezeUsed`, if a freeze is available — anything
   * missed longer than that spends no freeze and starts over, same as before.
   */
  function streakAfter(streak, lastFull, day, today, freezeAvailable) {
    if (day !== today || lastFull >= day) return null;
    if (lastFull === day - 1) return { streak: streak + 1, lastFull: day };
    if (freezeAvailable && lastFull > 0 && lastFull === day - 2) return { streak: streak + 1, lastFull: day, freezeUsed: true };
    return { streak: 1, lastFull: day };
  }

  // day 2 can only reach the freeze branch when lastFull is the never-played sentinel (0), never a real missed day; every stored freezeUsedDay === 2 is that bug's leftover, so it is safe to always clear it on load.
  function cleanFreezeUsedDay(freezeUsedDay) {
    return freezeUsedDay === 2 ? 0 : freezeUsedDay;
  }

  /**
   * The line under the title. `picture` is the thumbnail and the social card:
   * photographed once and shown for months, so it names no day at all.
   */
  function titleDay(day, date, past, picture) {
    if (picture) return 'Three new puzzles every day';
    return past ? `Day ${day} · ${date}` : `Day ${day} · three new puzzles every day`;
  }

  /** One mark of the share text per tier, nothing about the board itself. */
  function shareMark(result, par) {
    if (!result) return '⬛';
    const over = result - par;
    if (over <= 0) return '⭐';
    if (over <= 2) return '🟢+' + over;
    if (over <= 6) return '🟡+' + over;
    return '🔴+' + over;
  }

  /**
   * The next daily puzzle, as the portal's game page names it in this frame's
   * address: `#next=ink-side-down&title=Ink+Side+Down`. The page knows the
   * catalogue and the game does not, so without it nothing is offered: not in
   * this file opened on its own, not in a copy from the games repository, not
   * in a screenshot. Only a slug and a plain title get through — anyone can
   * type a fragment, and the button must not become a place to write somebody
   * else's message. The title pattern is ONWARD_TITLE in
   * site/scripts/lib/onward.mjs; a test holds the two together.
   */
  function readOnward(fragment, self) {
    const params = new URLSearchParams(String(fragment || '').replace(/^#/, ''));
    const slug = params.get('next') || '', title = params.get('title') || '';
    if (slug === self || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(slug) || !/^[A-Za-z0-9][A-Za-z0-9 '’-]{0,23}$/.test(title)) return null;
    return { slug, title, path: `/games/${slug}/` };
  }

  // A friend's result, carried in the URL a share links to (D-052, replacing the
