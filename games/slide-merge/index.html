<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Slide Merge — Arkai</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a16; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Slide Merge. Slide every tile at once with the arrow keys, WASD or a swipe; equal numbers merge into their sum. Chase the 2048 tile and keep going."></canvas>
<script>
(() => {
  'use strict';

  // ---- geometry (logical pixels, 540x720, letterboxed into whatever frame we get) ----
  const W = 540, H = 720;
  const N = 4;                                  // 4x4 — the only size this game is
  const PAD = 12, CELL = 99;
  const BOARD = N * CELL + (N + 1) * PAD;       // 456
  const BX = (W - BOARD) / 2, BY = 148;         // 42, 148 — board top-left
  const PICTURE_TOP = 6, PICTURE_SIDE = 610;    // the square the picture frames: score panels (14) to board edge (604)
  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  // ---- animation budget, the whole product in three numbers ----
  // A 2048 that redraws instantly reads as broken even though every rule is
  // right: the eye never sees which tile went where, so a merge looks like a
  // tile vanishing. 110 ms is long enough to follow and short enough that the
  // next key is already accepted while the pop is still settling.
  const SLIDE_MS = 110, POP_MS = 140, GROW_MS = 130;
  const BUMP_MS = 150;            // the nudge a blocked direction gives the board

  // ---- difficulty, in three named numbers ----
  // A 4 is a gift on an empty board and a brick on a crowded one, so its spawn
  // rate climbs with the biggest tile you own. The game gets harder exactly as
  // you get better at it and never before — no timer, no artificial pressure.
  const SPAWN_FOUR_EARLY = 0.10, SPAWN_FOUR_LATE = 0.24, SPAWN_RAMP_TILE = 512;

  const WIN_TILE = 2048;
  const SWIPE_MIN = 26;           // client px — below this a drag is a tap, not a swipe
  // The keys keep the game's first name on purpose: nobody sees a storage key, and
  // renaming them would wipe every player's saved records for a word that is not shown.
  const STORE_BEST = 'arkai:merge-2048:best', STORE_MUTE = 'arkai:merge-2048:muted';

  // ---- palette ----
  const BG = '#0b1020', BAR = '#070a16', ACCENT = '#f5a524';
  const INK = '#e6ebff', INK_DIM = 'rgba(190, 201, 240, 0.62)';
  const PANEL = '#161d38', SLOT = 'rgba(255, 255, 255, 0.045)';

  // The heat ramp, and the one ink that survives all of it.
  //
  // Pale sand at 2 and an incandescent 2048 are *both* light, so lightness has
  // to dip in between: exactly the journey a bar of iron makes in a forge, dark
  // at its hottest until it starts to glow. The trough sits at 128, where the
  // glow below switches on.
  //
  // Every fill is derived from that curve rather than picked by eye, because two
  // numbers had to hold at once. Ink #2b1508 clears WCAG AA 4.5:1 on every step
  // including the darkened lower half of the tile's own gradient — the worst
  // case is 4.57:1 on the 128. The ramp this replaced put near-white text on
  // mid-orange tiles at 2.3:1, which is a number a player cannot read, and a
  // 2048 whose digits you squint at has failed at its only job. Steps down the
  // playing arm are a uniform 1.21:1 apart instead of the 1.17:1 that made the
  // early board one flat sheet of cream.
  const INK_TILE = '#2b1508';
  const RAMP = [
    [2, '#fbf5e0', INK_TILE],
    [4, '#f2deb1', INK_TILE],
    [8, '#ecc789', INK_TILE],
    [16, '#eaaf67', INK_TILE],
    [32, '#ec9549', INK_TILE],
    [64, '#ef782d', INK_TILE],
    [128, '#f15716', INK_TILE],
    [256, '#ff6912', INK_TILE],
    [512, '#ff8119', INK_TILE],
    [1024, '#ff9a26', INK_TILE],
    [2048, '#ffb338', INK_TILE],
    [4096, '#ffcb5c', INK_TILE],
    [8192, '#ffe085', INK_TILE],
    [16384, '#ffefb0', INK_TILE],
  ];
  const tint = (v) => {
    for (let i = RAMP.length - 1; i >= 0; i--) if (v >= RAMP[i][0]) return RAMP[i];
    return RAMP[0];
  };
  // Heat has a second channel: above 128 a tile starts casting light, and by
  // 8192 it is the brightest thing on the screen. Colour alone runs out of
  // headroom past bright orange; a bloom does not.
  const glowOf = (v) => Math.max(0, Math.min(1, (Math.log2(v) - 7) / 6));

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Set by the generator that photographs the game for its catalogue thumbnail
  // and its social card, before any script here runs. Under it the game opens on
  // posePicture()'s board instead of the title, and holds it: nothing moves,
  // nothing is random, nothing is stored, played or reported.
  const PICTURE = window.__arkaiPicture === true;

  // localStorage throws outright in private mode, and an uncaught throw here is
  // a blank page rather than a game without a best score.
  const storage = {
    get(key) { try { return PICTURE ? null : localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { if (PICTURE) return false; localStorage.setItem(key, value); return true; } catch { return false; } },
  };

  // ---- portal events (same-origin parent only) ----
  const emit = (event, data) => {
    if (PICTURE) return;                          // a photograph is not a run
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'game-event', event, data: data || {} }, location.origin);
      }
    } catch { /* not embedded */ }
  };
  // A throw nobody caught is a bug a player has just met, and until now only they knew.
  // Said once per page: a frame that throws sixty times a second is one fact, not sixty.
  // Only this page's own script counts (an extension's error is not the game breaking),
  // and the line travels with it: this file ships byte for byte, so the line is exact.
  let crashed = false;
  window.addEventListener('error', (e) => {
    if (crashed || !String(e.filename).startsWith(location.origin + location.pathname)) return;
    crashed = true;
    emit('crash', { line: e.lineno });
  });

  const S = {
    mode: 'title',              // title | playing | won | paused | gameover
    grid: new Array(N * N).fill(0),
    score: 0, best: Number(storage.get(STORE_BEST)) || 0, newBest: false,
    prev: null,                 // one step of undo: { grid, score, reached, moves, newBest }
    reached: false,             // 2048 already celebrated this run
    winSent: false,             // the portal was told this run is won; undo leaves it alone
    moves: 0,
    slides: [], pops: [], spawn: null, animT: 1e9, queued: null,
    bump: null,
    muted: storage.get(STORE_MUTE) === '1',
    clock: 0, shake: 0, flash: 0, overT: 0,
    parts: [], floats: [], dust: [],
    press: null, pressT: 0, confirmT: 0,
  };

  // ---- sound (synthesised, no assets) ----
  let audio = null;
  const ensureAudio = () => {
    if (audio || S.muted) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audio = new Ctx();
    } catch { audio = null; }
  };
  const tone = (freq, dur = 0.07, type = 'triangle', vol = 0.05, delay = 0, glide = 1) => {
    if (S.muted || !audio || audio.state !== 'running') return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    // A merge is a *rising* blip: the pitch bends up while the tile pops, so the
    // ear hears the same "something grew" the eye does.
    if (glide !== 1) osc.frequency.exponentialRampToValueAtTime(freq * glide, t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  };
  const clickSound = (freq = 150, vol = 0.028) => tone(freq, 0.035, 'sine', vol);
  // Pitch tracks the tile: a 4 chirps, a 1024 rings. Twelve merges in one move
  // would be a burst of noise, so only the three loudest are voiced.
  const mergeSound = (v, i) => tone(170 * Math.pow(2, Math.log2(v) / 4.2), 0.1, 'triangle', 0.05, i * 0.045, 1.45);
  const winChord = () => {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.55, 'triangle', 0.045, i * 0.075));
  };

  // ---- small helpers ----
  const idx = (r, c) => r * N + c;
  const at = (r, c) => S.grid[idx(r, c)];
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const tileRect = (r, c) => ({ x: BX + PAD + c * (CELL + PAD), y: BY + PAD + r * (CELL + PAD) });

  function peakTile() {
    let m = 0;
    for (const v of S.grid) if (v > m) m = v;
    return m;
  }
  // 0 at an empty board, 1 once the 2048 is on it. Drives the room's warmth, the
  // progress bar and the board's rim, so all three agree without three rules.
  const heat = () => clamp01((Math.log2(peakTile() || 2) - 1) / (Math.log2(WIN_TILE) - 1));

  function fourChance() {
    const t = clamp01((Math.log2(peakTile() || 2) - 1) / (Math.log2(SPAWN_RAMP_TILE) - 1));
    return SPAWN_FOUR_EARLY + (SPAWN_FOUR_LATE - SPAWN_FOUR_EARLY) * t;
  }

  function spawnTile() {
    const free = [];
    for (let i = 0; i < S.grid.length; i++) if (!S.grid[i]) free.push(i);
    if (!free.length) return null;
    const i = free[Math.floor(Math.random() * free.length)];
    S.grid[i] = Math.random() < fourChance() ? 4 : 2;
    return { r: Math.floor(i / N), c: i % N };
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 170;
      S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, t: 0, color });
    }
  }
  const floatText = (x, y, text, color) => S.floats.push({ x, y, text, color, t: 0 });

  // ---- the rules ----
  // Each line is walked from the destination edge inwards, so the first tile a
  // line meets is one that has already stopped moving. That ordering — plus the
  // k++ that consumes a merged pair whole — is what makes 4·4·4 collapse into
  // 8·4 rather than 8·8, and a tile that just merged refuse to merge again in
  // the same move. Both are the rules real 2048 plays by.
  function lineCells(dir, i) {
    const cells = [];
    for (let k = 0; k < N; k++) {
      if (dir === 'left') cells.push([i, k]);
      else if (dir === 'right') cells.push([i, N - 1 - k]);
      else if (dir === 'up') cells.push([k, i]);
      else cells.push([N - 1 - k, i]);
    }
    return cells;
  }

  /** @returns {null|{next:number[], slides:object[], pops:object[], gained:number, peak:number}} */
  function resolve(dir) {
    const next = new Array(N * N).fill(0);
    const slides = [], pops = [];
    let gained = 0, peak = 0, moved = false;

    for (let i = 0; i < N; i++) {
      const cells = lineCells(dir, i);
      const src = [];
      for (const [r, c] of cells) if (at(r, c)) src.push({ r, c, v: at(r, c) });
      let write = 0;
      for (let k = 0; k < src.length; k++, write++) {
        const [dr, dc] = cells[write];
        if (k + 1 < src.length && src[k].v === src[k + 1].v) {
          const v = src[k].v * 2;
          next[idx(dr, dc)] = v;
          slides.push({ v: src[k].v, fr: src[k].r, fc: src[k].c, tr: dr, tc: dc });
          slides.push({ v: src[k + 1].v, fr: src[k + 1].r, fc: src[k + 1].c, tr: dr, tc: dc });
          pops.push({ r: dr, c: dc, v });
          gained += v;
          if (v > peak) peak = v;
          moved = true;
          k++;
        } else {
          next[idx(dr, dc)] = src[k].v;
          slides.push({ v: src[k].v, fr: src[k].r, fc: src[k].c, tr: dr, tc: dc });
          if (src[k].r !== dr || src[k].c !== dc) moved = true;
        }
      }
    }
    return moved ? { next, slides, pops, gained, peak } : null;
  }

  function canMove() {
    for (let i = 0; i < S.grid.length; i++) if (!S.grid[i]) return true;
    // A full board is not a finished board. One equal pair of neighbours is a
    // legal move, and declaring the run over because the cells ran out is the
    // single commonest bug in a hand-rolled 2048 — it ends good runs early and
    // the player has no way to tell it from bad luck.
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = at(r, c);
        if (c + 1 < N && at(r, c + 1) === v) return true;
        if (r + 1 < N && at(r + 1, c) === v) return true;
      }
    }
    return false;
  }

  const DIR_VEC = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

  function doMove(dir) {
    const res = resolve(dir);
    if (!res) {
      // A blocked direction is information, not an error: without the nudge the
      // player cannot tell "that wall is solid" from "my key was dropped".
      S.bump = { v: DIR_VEC[dir], t: 0 };
      clickSound(105, 0.018);
      return;
    }

    S.prev = { grid: S.grid.slice(), score: S.score, reached: S.reached, moves: S.moves, newBest: S.newBest };
    S.grid = res.next;
    S.score += res.gained;
    S.moves++;
    S.slides = res.slides;
    S.pops = res.pops;
    S.animT = 0;
    S.spawn = spawnTile();
    S.bump = null;
    S.confirmT = 0;                    // a real move disarms a half-pressed NEW

    clickSound(res.pops.length ? 200 : 150);
    const loud = res.pops.slice().sort((a, b) => b.v - a.v);
    loud.slice(0, 3).forEach((p, i) => mergeSound(p.v, i));
    for (const p of res.pops) {
      const rect = tileRect(p.r, p.c);
      const [, fill] = tint(p.v);
      // Above the tile, not on it: a pale "+8" printed across a pale tile is a
      // smudge, and the number it smudges is the one the player wants to read.
      floatText(rect.x + CELL / 2, rect.y - 4, '+' + p.v, fill);
      burst(rect.x + CELL / 2, rect.y + CELL / 2, fill, 6 + Math.min(18, Math.log2(p.v) * 2));
    }
    // Shake is reserved for merges that actually matter: everything shaking all
    // the time is the same as nothing shaking.
    if (res.peak >= 128) S.shake = Math.min(11, (Math.log2(res.peak) - 6) * 1.7);
    if (S.score > S.best) { S.best = S.score; S.newBest = true; storage.set(STORE_BEST, String(S.best)); }

    if (!S.reached && res.peak >= WIN_TILE) {
      S.reached = true;
      S.mode = 'won';
      S.overT = 0;
      S.flash = 0.5;
      S.shake = 12;
      winChord();
      // The run is won the moment 2048 exists, and this is where the portal hears
      // it: most winners close the tab or press R from here, and neither reaches
      // gameOver(). Once per run — undo can take 2048 back and the player can make
      // it again, which is still one won run — and gameOver() then stays silent,
      // so a run is never both a win and an end.
      if (!S.winSent) { S.winSent = true; emit('gameover', { won: true, score: S.score, moves: S.moves }); }
      // The board is *not* checked here on purpose: the celebration comes first
      // even when that same move filled the last square. keepGoing() asks the
      // question the moment the player dismisses it, so a win that is also the
      // end of the run still ends the run.
    } else if (!canMove()) {
      gameOver();
    }
  }

  // Leaving the win screen is the only place where a run can already be over
  // without anyone having looked. Every path that *continues* the run from 'won'
  // goes through here (R and NEW start a new run instead, which is why the win is
  // reported when 2048 appears, not here); without it the winning-and-final move left the game in 'playing' on a dead
  // board, bumping forever, and the portal never heard the run finish.
  function keepGoing() {
    S.mode = 'playing';
    if (!canMove()) gameOver();
  }

  function requestMove(dir) {
    if (S.mode === 'title') { start(); return; }
    if (S.mode === 'won') keepGoing();                 // an arrow means "keep going"
    if (S.mode !== 'playing') return;
    // Queue instead of drop. Held keys repeat every ~33 ms and a two-key flick
    // is faster than one slide; swallowing the second one feels like a missed
    // input rather than a game that is busy.
    if (S.animT < SLIDE_MS) { S.queued = dir; return; }
    doMove(dir);
  }

  function reset() {
    S.grid = new Array(N * N).fill(0);
    S.score = 0; S.newBest = false; S.moves = 0;
    S.prev = null; S.reached = false; S.winSent = false;
    S.slides = []; S.pops = []; S.spawn = null; S.animT = 1e9; S.queued = null;
    S.bump = null; S.shake = 0; S.flash = 0; S.overT = 0; S.confirmT = 0;
    S.parts = []; S.floats = [];
    spawnTile();
    spawnTile();
  }

  // The board the picture is taken of: a run some 460 moves old, the big tiles
  // stacked along the bottom edge and every step of the heat ramp from sand to
  // the glowing 512 on it at once. Literal on purpose — two photographs must be
  // the same photograph — and the score is the one these tiles add up to: what
  // merging them from 2s pays, less the 4s that arrived ready-made.
  function posePicture() {
    S.grid = [
      2, 0, 4, 0,
      4, 16, 8, 2,
      8, 32, 64, 16,
      512, 256, 128, 32,
    ];
    S.score = 7068; S.best = 11504; S.moves = 465;
    S.mode = 'playing';
  }

  function start() {
    reset();
    S.mode = 'playing';
    ensureAudio();
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
    tone(392, 0.09, 'triangle', 0.045);
    tone(587.33, 0.12, 'triangle', 0.045, 0.07);
    emit('start', { game: 'slide-merge' });
  }

  function gameOver() {
    S.mode = 'gameover';
    S.overT = 0;
    S.shake = 12;
    S.flash = 0.34;
    tone(330, 0.16, 'sawtooth', 0.045);
    tone(220, 0.22, 'sawtooth', 0.045, 0.12);
    tone(147, 0.34, 'sawtooth', 0.045, 0.26);
    if (!S.winSent) emit('gameover', { won: false, score: S.score, best: S.best, moves: S.moves, peak: peakTile() });
  }

  const canUndo = () => !!S.prev && (S.mode === 'playing' || S.mode === 'won');

  function undo() {
    if (!canUndo()) return;
    S.grid = S.prev.grid;
    S.score = S.prev.score;
    S.reached = S.prev.reached;
    S.moves = S.prev.moves;
    // The stored best stays where it is — a score really was reached — but the
    // amber "you just beat it" highlight belongs to a move that no longer exists.
    S.newBest = S.prev.newBest;
    // One step and the button says so: dropping the snapshot is what makes the
    // second press impossible, rather than a disabled flag that can drift out of
    // sync with the board it is supposed to describe.
    S.prev = null;
    S.slides = []; S.pops = []; S.spawn = null; S.animT = 1e9; S.queued = null;
    S.floats = [];
    if (S.mode === 'won') S.mode = 'playing';
    tone(520, 0.08, 'sine', 0.04, 0, 0.6);
  }

  // A mis-tap on NEW costs the whole run and undo cannot bring it back — the one
  // irreversible button on the screen, sitting a thumb's width from a board you
  // swipe at. So the first press only arms it. A run that has scored nothing has
  // nothing to lose, and asking twice for that would be ceremony.
  function requestFresh() {
    if (S.mode === 'playing' && S.score > 0 && S.confirmT <= 0) {
      S.confirmT = 2.5;
      clickSound(240, 0.03);
      return;
    }
    S.confirmT = 0;
    start();
  }

  function toggleMute() {
    S.muted = !S.muted;
    storage.set(STORE_MUTE, S.muted ? '1' : '0');
    if (!S.muted) {
      ensureAudio();
      if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
      tone(700, 0.08, 'triangle', 0.045);
    }
  }

  // ---- update ----
  function update(dt) {
    S.clock += dt;
    S.animT += dt * 1000;
    S.pressT = Math.max(0, S.pressT - dt);
    S.confirmT = Math.max(0, S.confirmT - dt);
    if (S.pressT === 0) S.press = null;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 32);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
    if (S.mode === 'gameover' || S.mode === 'won') S.overT += dt;
    if (S.bump) { S.bump.t += dt * 1000; if (S.bump.t >= BUMP_MS) S.bump = null; }

    for (const d of S.dust) {
      d.y -= d.s * dt;
      d.x += Math.sin(S.clock * 0.6 + d.p) * 6 * dt;
      if (d.y < -6) { d.y = H + 6; d.x = Math.random() * W; }
    }
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.t += dt;
      if (p.t >= p.life) { S.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.93; p.vy = p.vy * 0.93 + 300 * dt;
    }
    for (let i = S.floats.length - 1; i >= 0; i--) {
      S.floats[i].t += dt;
      if (S.floats[i].t > 0.95) S.floats.splice(i, 1);
    }

    if (S.queued && S.animT >= SLIDE_MS && S.mode === 'playing') {
      const dir = S.queued;
      S.queued = null;
      doMove(dir);
    }
  }

  // ---- view: one logical board, letterboxed into any frame ----
  const view = { scale: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };

  function resize() {
    // Capped at 2: a 3x phone would render nine times the pixels for no visible
    // gain. Below the device ratio the board is measurably blurry in the hand.
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = canvas.clientWidth || window.innerWidth || W;
    const ch = canvas.clientHeight || window.innerHeight || H;
    view.dpr = dpr; view.cw = cw; view.ch = ch;
    view.scale = Math.min(cw / W, ch / H);
    view.ox = (cw - W * view.scale) / 2;
    view.oy = (ch - H * view.scale) / 2;
    if (PICTURE) {
      // The picture is square and the game is 3:4: letterboxed, the board is
      // under two thirds of the frame. So the camera takes the square that holds
      // the HUD and the board, and the buttons and key hints fall below its edge.
      view.scale = Math.min(cw, ch) / PICTURE_SIDE;
      view.ox = cw / 2 - (W / 2) * view.scale;
      view.oy = (ch - PICTURE_SIDE * view.scale) / 2 - PICTURE_TOP * view.scale;
    }
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }

  const toLogical = (clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    const px = (clientX - rect.left) * (view.cw / rect.width || 1);
    const py = (clientY - rect.top) * (view.ch / rect.height || 1);
    return { x: (px - view.ox) / view.scale, y: (py - view.oy) / view.scale };
  };

  // ---- drawing ----
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawRoom() {
    ctx.fillStyle = BG;
    ctx.fillRect(-16, -16, W + 32, H + 32);
    const t = S.clock, warm = heat();
    // Two slow lights behind the board. The second one carries the board's heat,
    // so the whole room warms up as the run gets dangerous — the same signal as
    // the tile colours, told again at the size of the screen.
    const lights = [
      [W * 0.24 + Math.sin(t * 0.21) * 64, 180 + Math.cos(t * 0.17) * 54, 320, `rgba(86, 104, 232, ${0.15 + 0.05 * Math.sin(t * 0.5)})`],
      [W * 0.78 + Math.cos(t * 0.13) * 72, 560 + Math.sin(t * 0.19) * 62, 340, `rgba(245, 165, 36, ${0.04 + 0.14 * warm})`],
    ];
    for (const [x, y, r, color] of lights) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(11, 16, 32, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (const d of S.dust) {
      ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(S.clock * 1.7 + d.p));
      ctx.fillStyle = '#cdd7ff';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function panel(x, y, w, h, label, value, accent) {
    ctx.fillStyle = PANEL;
    roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 11px ${FONT}`;
    ctx.fillStyle = INK_DIM;
    ctx.fillText(label, x + w / 2, y + 18);
    ctx.font = `800 24px ${FONT}`;
    ctx.fillStyle = accent;
    // Five digits at 24 px overflow a 105 px panel, so the number shrinks to fit
    // rather than sliding out over the panel beside it.
    const fit = Math.min(1, (w - 16) / Math.max(1, ctx.measureText(value).width));
    if (fit < 1) ctx.font = `800 ${Math.round(24 * fit)}px ${FONT}`;
    ctx.fillText(value, x + w / 2, y + 46);
  }

  function drawHud() {
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = `800 27px ${FONT}`;
    ctx.fillStyle = INK;
    ctx.fillText('SLIDE', 42, 38);
    const wordW = ctx.measureText('SLIDE ').width;
    ctx.fillStyle = ACCENT;
    ctx.fillText('MERGE', 42 + wordW, 38);

    // Progress to 2048, in the same heat the tiles use: the bar and the board
    // always tell the same story.
    const bw = 196, bh = 8, bx = 42, by = 74;
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    roundRect(bx, by, bw, bh, 4);
    ctx.fill();
    const warm = heat();
    if (warm > 0) {
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#f7eedd');
      g.addColorStop(0.55, ACCENT);
      g.addColorStop(1, '#ff8a12');
      ctx.fillStyle = g;
      roundRect(bx, by, Math.max(bh, bw * warm), bh, 4);
      ctx.fill();
    }
    ctx.font = `600 12px ${FONT}`;
    ctx.fillStyle = INK_DIM;
    const peak = peakTile();
    ctx.fillText(peak >= WIN_TILE ? `hottest tile ${peak} — keep going` : `hottest tile ${peak || 2} of ${WIN_TILE}`, 42, 102);

    panel(278, 14, 105, 62, 'SCORE', String(S.score), INK);
    panel(393, 14, 105, 62, 'BEST', String(S.best), S.newBest ? ACCENT : INK);
  }

  const BUTTONS = [
    { id: 'undo', x: 42, y: 620, w: 176, h: 64 },
    { id: 'fresh', x: 230, y: 620, w: 120, h: 64 },
    { id: 'sound', x: 362, y: 620, w: 136, h: 64 },
  ];
  const buttonAt = (p) => BUTTONS.find((b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) || null;

  function drawButton(b) {
    const live = b.id === 'undo' ? canUndo() : true;
    const held = S.press === b.id;
    ctx.globalAlpha = live ? 1 : 0.38;
    ctx.fillStyle = held ? 'rgba(245, 165, 36, 0.22)' : PANEL;
    roundRect(b.x, b.y, b.w, b.h, 12);
    ctx.fill();
    ctx.strokeStyle = b.id === 'undo' && live ? 'rgba(245, 165, 36, 0.55)' : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 14px ${FONT}`;
    if (b.id === 'undo') {
      // The count is the whole message: one step exists or it does not, and the
      // label changes the instant it is spent instead of quietly doing nothing.
      ctx.fillStyle = live ? ACCENT : INK_DIM;
      ctx.fillText(live ? 'UNDO  1 LEFT' : 'UNDO  0 LEFT', b.x + b.w / 2, b.y + b.h / 2);
    } else if (b.id === 'fresh') {
      ctx.fillStyle = S.confirmT > 0 ? ACCENT : INK;
      ctx.fillText(S.confirmT > 0 ? 'SURE?' : 'NEW', b.x + b.w / 2, b.y + b.h / 2);
    } else {
      ctx.fillStyle = S.muted ? INK_DIM : INK;
      ctx.fillText(S.muted ? 'SOUND OFF' : 'SOUND ON', b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawBoard() {
    const warm = heat();
    ctx.save();
    if (S.bump) {
      const k = Math.sin(Math.PI * (S.bump.t / BUMP_MS)) * 7;
      ctx.translate(S.bump.v[0] * k, S.bump.v[1] * k);
    }
    // The rim carries the heat too, so the board itself looks hot long before
    // any single tile is big enough to notice on its own.
    ctx.shadowColor = `rgba(245, 165, 36, ${0.1 + 0.4 * warm})`;
    ctx.shadowBlur = 14 + 30 * warm;
    ctx.fillStyle = '#141a33';
    roundRect(BX, BY, BOARD, BOARD, 18);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(245, 165, 36, ${0.12 + 0.35 * warm})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const p = tileRect(r, c);
        ctx.fillStyle = SLOT;
        roundRect(p.x, p.y, CELL, CELL, 11);
        ctx.fill();
      }
    }
    drawTiles();
    ctx.restore();
  }

  function drawTile(x, y, v, scale) {
    const [, fill, ink] = tint(v);
    const g = glowOf(v);
    const digits = String(v).length;
    ctx.save();
    ctx.translate(x + CELL / 2, y + CELL / 2);
    if (scale !== 1) ctx.scale(scale, scale);
    if (g > 0) { ctx.shadowColor = fill; ctx.shadowBlur = 6 + 30 * g; }
    const grad = ctx.createLinearGradient(0, -CELL / 2, 0, CELL / 2);
    grad.addColorStop(0, fill);
    grad.addColorStop(1, shade(fill, -0.07));
    ctx.fillStyle = grad;
    roundRect(-CELL / 2, -CELL / 2, CELL, CELL, 11);
    ctx.fill();
    ctx.shadowBlur = 0;
    // A one-pixel lip along the upper edge: the cheapest way to make a flat
    // rectangle read as a physical tile rather than a coloured hole.
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-CELL / 2 + 12, -CELL / 2 + 1);
    ctx.lineTo(CELL / 2 - 12, -CELL / 2 + 1);
    ctx.stroke();
    ctx.fillStyle = ink;
    ctx.font = `800 ${digits <= 2 ? 42 : digits === 3 ? 36 : digits === 4 ? 30 : 24}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(v), 0, 2);
    ctx.restore();
  }

  // Mixing towards black or white beats a second hand-picked hex per tile: the
  // gradient stays in step with the ramp when the ramp is edited.
  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
      const m = amount < 0 ? v * (1 + amount) : v + (255 - v) * amount;
      return Math.round(Math.max(0, Math.min(255, m)));
    });
    return `rgb(${ch[0]}, ${ch[1]}, ${ch[2]})`;
  }

  function drawTiles() {
    if (S.mode === 'title') return;
    const slide = S.animT / SLIDE_MS;
    if (slide < 1 && S.slides.length) {
      // Mid-slide the settled grid is a lie — the merged tile does not exist yet
      // and the spawn has not appeared — so the travelling tiles are the only
      // thing drawn. A merging pair simply arrives on the same square.
      const k = easeOut(slide);
      for (const s of S.slides) {
        const a = tileRect(s.fr, s.fc), b = tileRect(s.tr, s.tc);
        drawTile(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, s.v, 1);
      }
      return;
    }
    const after = S.animT - SLIDE_MS;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = at(r, c);
        if (!v) continue;
        const p = tileRect(r, c);
        let scale = 1;
        if (after < POP_MS && S.pops.some((q) => q.r === r && q.c === c)) {
          scale = 1 + 0.26 * Math.sin(Math.PI * (after / POP_MS));       // overshoot, then settle
        } else if (S.spawn && S.spawn.r === r && S.spawn.c === c && after < GROW_MS) {
          scale = 0.14 + 0.86 * easeOut(after / GROW_MS);
        }
        drawTile(p.x, p.y, v, scale);
      }
    }
  }

  function drawOverlay(title, lines, accent) {
    ctx.fillStyle = 'rgba(7, 10, 22, 0.86)';
    ctx.fillRect(-16, -16, W + 32, H + 32);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = accent;
    // Shrunk to fit rather than trusting that the longest title happens to be
    // short enough: "NO MOVES LEFT" at 50 px is already touching both margins,
    // and the next overlay someone adds would run straight off the board.
    ctx.font = `800 50px ${FONT}`;
    const room = W - 80;
    const wide = ctx.measureText(title).width;
    if (wide > room) ctx.font = `800 ${Math.floor(50 * (room / wide))}px ${FONT}`;
    ctx.fillText(title, W / 2, H / 2 - 110);
    ctx.font = `500 18px ${FONT}`;
    lines.forEach((line, i) => {
      ctx.fillStyle = i === 0 ? INK : INK_DIM;
      ctx.fillText(line, W / 2, H / 2 - 46 + i * 30);
    });
  }

  function draw() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    // The picture's square is wider than the board's frame, so there the room
    // runs on to the edges instead of stopping at two bars.
    ctx.fillStyle = PICTURE ? BG : BAR;
    ctx.fillRect(0, 0, view.cw, view.ch);

    ctx.save();
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);
    ctx.beginPath();
    if (PICTURE) ctx.rect(-W, 0, W * 3, H);
    else ctx.rect(0, 0, W, H);
    ctx.clip();                                   // the letterbox bars stay clean
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);

    drawRoom();
    drawHud();
    drawBoard();
    for (const b of BUTTONS) drawButton(b);

    for (const p of S.parts) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
    }
    ctx.globalAlpha = 1;
    for (const f of S.floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.95);
      ctx.font = `800 20px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // A dark rim under the glyphs, because the score text has to cross both
      // the near-black board and a cream 4 on its way up.
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(7, 10, 22, 0.85)';
      ctx.strokeText(f.text, f.x, f.y - f.t * 40);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y - f.t * 40);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `500 12px ${FONT}`;
    ctx.fillStyle = 'rgba(190, 201, 240, 0.45)';
    ctx.fillText('Arrow keys · WASD · swipe    U undo    M sound    P pause', W / 2, 704);

    if (S.flash > 0) {
      ctx.fillStyle = `rgba(245, 165, 36, ${S.flash * 0.42})`;
      ctx.fillRect(-16, -16, W + 32, H + 32);
    }

    if (S.mode === 'title') {
      drawOverlay('SLIDE MERGE', [
        'Slide every tile at once. Equal numbers merge.',
        'Arrow keys, WASD, or swipe anywhere.',
        'The board heats up as the numbers climb —',
        'reach 2048, then keep going.',
        '',
        'Tap or press Space to play',
      ], ACCENT);
      if (S.best > 0) {
        ctx.fillStyle = INK;
        ctx.font = `800 20px ${FONT}`;
        ctx.fillText(`Best ${S.best}`, W / 2, H / 2 + 158);
      }
    } else if (S.mode === 'paused') {
      drawOverlay('PAUSED', ['Tap or press P to continue'], INK);
    } else if (S.mode === 'won') {
      drawOverlay('LEGENDARY!', [
        'You built the 2048 tile.',
        `Score ${S.score} in ${S.moves} moves.`,
        'There is no ceiling above it — 4096 is next.',
        '',
        S.overT > 0.5 ? 'Tap, press Space, or just keep sliding' : '',
      ], ACCENT);
    } else if (S.mode === 'gameover') {
      drawOverlay('NO MOVES LEFT', [
        `Score ${S.score} · hottest tile ${peakTile()}`,
        S.newBest ? 'New personal best!' : `Best ${S.best}`,
        '',
        S.overT > 0.7 ? 'Tap or press Space to play again' : '',
      ], S.newBest ? ACCENT : '#f06a5a');
    }

    ctx.restore();
  }

  // ---- input ----
  const KEY_DIRS = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
  };

  // Space and Enter mean "the thing this screen is waiting for" — and during
  // play that is nothing at all. A stray Space must never restart a live run.
  function primary() {
    if (S.mode === 'title') return start();
    if (S.mode === 'paused') { S.mode = 'playing'; return; }
    if (S.mode === 'won' && S.overT > 0.5) { keepGoing(); return; }
    if (S.mode === 'gameover' && S.overT > 0.7) return start();
  }

  window.addEventListener('keydown', (e) => {
    const dir = KEY_DIRS[e.code];
    if (dir) {
      e.preventDefault();
      requestMove(dir);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primary(); return; }
    if (e.code === 'KeyU' || e.code === 'KeyZ') { e.preventDefault(); undo(); return; }
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'KeyR') {
      e.preventDefault();
      if (S.mode !== 'title') requestFresh();
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') {
      e.preventDefault();
      if (S.mode === 'playing') S.mode = 'paused';
      else if (S.mode === 'paused') S.mode = 'playing';
    }
  });

  let swipe = null;

  canvas.addEventListener('pointerdown', (e) => {
    canvas.focus();
    // While an overlay is up it owns every pixel, buttons included. They are
    // drawn under an 86% scrim and look disabled, and the overlay's own words
    // are "tap to continue" — so testing the buttons first meant a tap during a
    // pause hit NEW through the scrim and wiped the run it promised to resume.
    if (S.mode !== 'playing') { primary(); return; }
    const p = toLogical(e.clientX, e.clientY);
    const b = buttonAt(p);
    if (b) {
      S.press = b.id; S.pressT = 0.12;
      if (b.id === 'sound') { toggleMute(); return; }
      if (b.id === 'fresh') { requestFresh(); return; }
      if (b.id === 'undo' && canUndo()) { undo(); return; }
      if (b.id === 'undo') return;
    }
    // A bare tap on the board does nothing: tying a move (or a pause) to it
    // would fire on every aborted swipe, and a game that pauses when you touch
    // the playfield is a game that looks frozen to anyone watching.
    swipe = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener('pointermove', (e) => {
    // A drag released outside the frame never delivers pointerup here, and the
    // stale swipe then steers on the next ordinary mouse move.
    if (swipe && e.pointerType === 'mouse' && e.buttons === 0) swipe = null;
    if (!swipe || S.mode !== 'playing') return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;
    // One swipe is one move. Re-anchoring here would turn a long flick into a
    // stream of moves, which on a board this small is a ruined run.
    swipe = null;
    if (Math.abs(dx) > Math.abs(dy)) requestMove(dx > 0 ? 'right' : 'left');
    else requestMove(dy > 0 ? 'down' : 'up');
  });

  const endSwipe = () => { swipe = null; };
  canvas.addEventListener('pointerup', endSwipe);
  canvas.addEventListener('pointercancel', endSwipe);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.mode === 'playing' && !PICTURE) S.mode = 'paused';   // no PAUSED over the picture
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // ---- loop ----
  let last = 0;
  function frame(now) {
    // Booked before anything that can throw: one bad frame must not stop every frame
    // after it and leave the game frozen on its last picture (Pair Flip, 48ad915).
    requestAnimationFrame(frame);
    if (!last) last = now;
    // Clamped so a tab restored after a minute in the background resumes on the
    // next frame instead of integrating a minute of drift in one step.
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (view.cw !== (canvas.clientWidth || view.cw) || view.ch !== (canvas.clientHeight || view.ch)) resize();
    if (!PICTURE) update(dt);                     // the pose is drawn every frame and never advances
    draw();
    if (PICTURE) window.__arkaiPosed = true;      // the posed frame is on the canvas; the generator waits for this
  }

  // Dust is scattered by Math.random, so the picture goes without it.
  for (let i = 0; i < (PICTURE ? 0 : 46); i++) {
    S.dust.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.6 + Math.random() * 1.7, s: 6 + Math.random() * 18,
      p: Math.random() * Math.PI * 2, a: 0.07 + Math.random() * 0.2,
    });
  }
  if (PICTURE) posePicture();
  else reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
