    const caption = t < 0.5 ? 'a dark box' : t < 1.5 ? 'a beam goes in here…' : t < 2.5 ? '…and comes out there' : 'so a mirror must be here';
    label(caption, W / 2, y0 + px * (n + 2) + 18, 16, t >= 2.5 ? C.inkHi : C.muted, 'center', '700');
  }

  function drawTitle() {
    const T = L.title;
    label('BLIND CORNERS', W / 2, T.name, T.nameSize, C.text, 'center', '900');
    const past = archive();
    label(titleDay(S.day, past ? dayDate(S.day) : '', past, PICTURE), W / 2, T.day, 17, C.inkHi, 'center', '700', W - 2 * (14 + ARROW + 6));
    drawLane(T.lanes);

    const lines = [
      ['Mirrors hide in the dark box.', C.text],
      ['Fire beams in. See where they come out.', C.text],
      ['Mark where the mirrors must be.', C.inkHi],
      ['Fewer beams is better: match par for a star.', C.muted],
    ];
    lines.forEach(([str, color], i) => label(str, W / 2, T.lines + i * T.lineGap, 18, color, 'center', '600'));

    const allDone = solvedCount() === TIERS.length;
    ctx.globalAlpha = allDone ? 1 : 0.8 + 0.2 * wave(3);
    const go = touch() ? 'Tap' : 'Tap or press Space';
    const done = past ? `Day ${S.day} is done` : `Next puzzles in ${untilMidnight()}`;
    label(allDone ? done : `${go} to ${solvedCount() || S.runs.some((r) => r.moves) ? 'continue' : 'play'}`, W / 2, T.cta, 21, allDone ? C.text : C.inkHi, 'center', '800');
    ctx.globalAlpha = 1;
    // Finished for today is the moment an earlier day is worth offering.
    const again = allDone ? (!past && S.day > 1 ? '‹ plays earlier days' : 'Tap a puzzle to see it again') : '';
    const sub = past
      ? again || 'Earlier days do not count toward the streak'
      : [again, S.bestStreak ? `Streak ${liveStreak()} · best ${S.bestStreak}` : ''].filter(Boolean).join('  ·  ');
    if (sub) label(sub, W / 2, T.sub, 15, C.muted, 'center', '600');
    for (const b of buttons()) drawButton(b);
    drawFooter(T.footer);
  }

  // In the compact shape the toast takes the place of the info line for its
  // three seconds, par-line strip included.
  const toastOverInfo = () => !L.heading && S.mode === 'play';

  function drawToast() {
    if (!S.toast) return;
    const a = Math.min(1, S.toast.t * 6, (3 - S.toast.t) * 3);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = `700 15px ${FONT}`;
    const w = Math.min(W - 16, ctx.measureText(S.toast.text).width + 32);
    const y = S.mode === 'title' ? L.title.footer - 18 : L.toastY;
    const h = toastOverInfo() ? 28 : 36; // compact: clear of the board frame
    ctx.fillStyle = '#26345a';
    roundRect((W - w) / 2, y, w, h, h / 2);
    ctx.fill();
    label(S.toast.text, W / 2, y + h / 2, 15, C.text, 'center', '700');
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = view.scale * view.dpr;
    ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
    drawBackground();
    if (S.mode === 'title') drawTitle();
    else drawPlay();
    drawToast();
    if (S.flash > 0) {
      ctx.fillStyle = `rgba(210, 245, 255, ${S.flash * 0.22})`;
      ctx.fillRect(0, 0, W, L.H);
    }
  }

  // ---- input ----
  const toLogical = (event) => {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left - view.ox) / view.scale, y: (event.clientY - rect.top - view.oy) / view.scale };
  };

  /** The port or the square of the box under a point, as a hit target: { id: 'port7' } or { id: 'cell12' }. */
  function hitBoard(x, y) {
    if (S.mode !== 'play' || S.help) return null;
    const n = size(), px = cellPx();
    const rx = Math.floor((x - BOARD_X) / px), ry = Math.floor((y - L.boardY) / px);
    if (rx < 0 || ry < 0 || rx > n + 1 || ry > n + 1) return null;
    const port = ringPort(n, rx, ry);
    if (port >= 0) return { id: `port${port}` };
    if (rx >= 1 && rx <= n && ry >= 1 && ry <= n) return { id: `cell${(ry - 1) * n + (rx - 1)}` };
    return null;
  }

  const hitButton = (x, y) => [...buttons(), ...(S.mode === 'play' ? tabs() : [])].find((b) => inside(b, x, y)) || hitBoard(x, y);

  function press(id) {
    if (id === 'share') share();
    else if (id === 'mute') toggleMute();
    else if (id === 'home') goTitle();
    else if (id === 'next') nextPuzzle();
    else if (id === 'best') toggleLine();
    else if (id === 'check') check();
    else if (id === 'clear') clearMarks();
    else if (id === 'help') toggleHelp();
    else if (id === 'prevday') stepDay(-1);
    else if (id === 'nextday') stepDay(1);
    else if (id === 'onward') goOnward();
    else if (id.startsWith('port')) { S.keys = false; fire(Number(id.slice(4))); }
    else if (id.startsWith('cell')) { S.keys = false; cycleMark(Number(id.slice(4))); }
    else if (id.startsWith('tier')) setTier(Number(id.slice(4)));
    else if (id.startsWith('card')) {
      const tier = Number(id.slice(4));
      if (S.mode === 'title') startPlay(tier); else setTier(tier);
    }
  }

  canvas.addEventListener('pointerdown', (event) => {
    // Only the first finger, and only the main mouse button: a second finger or
    // a right click must never become a counted roll.
    if (!event.isPrimary || (event.pointerType === 'mouse' && event.button !== 0)) return;
    canvas.focus({ preventScroll: true, focusVisible: false });
    ensureAudio();
    const at = toLogical(event);
    const b = hitButton(at.x, at.y);
    S.press = { id: b ? b.id : null, x: at.x, y: at.y, pointer: event.pointerId };
    try { canvas.setPointerCapture(event.pointerId); } catch { /* not supported */ }
  });

  canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType !== 'mouse') return;
    const at = toLogical(event);
    const b = hitButton(at.x, at.y);
    S.hover = b ? b.id : null;
  });

  canvas.addEventListener('pointerup', (event) => {
    const start = S.press;
    if (!start || start.pointer !== event.pointerId) return;
    S.press = null;
    ensureAudio();
    const at = toLogical(event);
    if (start.id) {
      // Pressed and released on the same thing: a finger that slid off a port did not fire it.
      const b = hitButton(at.x, at.y);
      if (b && b.id === start.id) press(b.id);
      return;
    }
    if (S.mode === 'title') { startPlay(); return; }
    if (S.help) S.help = false;
  });

  canvas.addEventListener('pointercancel', (event) => {
    if (S.press && S.press.pointer === event.pointerId) S.press = null;
  });

  window.addEventListener('keydown', (event) => {
    // While the copy dialog is open the box is not there to play, wherever focus went.
    if (copyBox.classList.contains('open')) {
      if (event.key === 'Escape') closeCopyBox();
      return;
    }
    // Keys typed in the dialog or on the accessible buttons are theirs.
    if (event.target instanceof Element && event.target.closest('#copybox, #controls')) return;
    // Ctrl+R, Cmd+W, Ctrl+S belong to the browser.
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const code = event.code;
    const { dir, digit, letter } = readKey(code, event.key);
    const space = code === 'Space' || event.key === ' ';
    if (dir >= 0 || space || letter === 'Backspace' || letter === '/') event.preventDefault();
    // Every beam is counted, so a held key must not turn into thirty of them.
    if (event.repeat && dir < 0) return;
    ensureAudio();
    if (dir >= 0) {
      if (S.mode === 'title') startPlay(); else moveCursor(dir);
      return;
    }
    const step = dayStep(letter);
    if (step) { stepDay(step); return; }
    if (letter === 'm') { toggleMute(); return; }
    if (letter === 'l') { announce(S.mode === 'play' ? describeBoard() : `Day ${S.day}. Start a puzzle to hear its box.`); return; }
    if (letter === 'h' || letter === '?') { if (S.mode === 'title') announce(rulesText()); else toggleHelp(); return; }
    if (S.mode === 'title') {
      if (space || letter === 'Enter') startPlay();
      else if (letter === 'c') share();
      else if (digit >= 0) startPlay(digit);
      return;
    }
    if (space || letter === 'Enter') { if (locked()) nextPuzzle(); else act(); return; }
    if (letter === '/') { markAtCursor(SLASH); return; }
    if (letter === '\\') { markAtCursor(BACK); return; }
    if (letter === 'Backspace' || letter === 'Delete') { markAtCursor(EMPTY); return; }
    if (letter === 'k') { check(); return; }
    if (letter === 'x') { clearMarks(); return; }
    if (letter === 'n') { if (locked()) nextPuzzle(); return; }
    if (letter === 'b') { toggleLine(); return; }
    if (letter === 'c') { share(); return; }
    if (digit >= 0) { setTier(digit); return; }
    if (letter === 'Escape') { if (S.help) S.help = false; else goTitle(); }
  });

  controls.addEventListener('click', (event) => {
    const button = event.target instanceof Element ? event.target.closest('button[data-act]') : null;
    if (!button || copyBox.classList.contains('open')) return;
    ensureAudio();
    const name = button.dataset.act;
    if (name.startsWith('dir')) {
      if (S.mode === 'title') startPlay();
      else moveCursor(Number(name.slice(3)));
    } else if (name === 'act') {
      if (S.mode === 'title') startPlay(); else act();
    } else if (name === 'board') {
      announce(S.mode === 'play' ? describeBoard() : `Day ${S.day}. Start a puzzle to hear its box.`);
    } else if ((name === 'next' || name === 'check') && S.mode === 'title') {
      startPlay();
    } else if (name === 'help' && S.mode === 'title') {
      announce(rulesText());
    } else {
      press(name);
    }
  });

  // Another tab of this game saved something: take it in, so neither tab
  // overwrites the other's solved puzzles or positions on its next roll.
  window.addEventListener('storage', (event) => {
    if (event.key === STORE && S.runs.length) absorb(readStore());
  });

  // ---- loop ----
  let lastTime = 0, running = true;
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (running) {
      update(dt);
      render();
      // The generator waits for this before it photographs (POSED_FLAG in picture-flag.mjs).
      if (PICTURE) window.__arkaiPosed = true;
    }
    requestAnimationFrame(frame);
  }

  // A turn-based game has no clock to stop, but a hidden tab should not keep
  // drawing, and sound must not start again on its own.
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (audio) {
      if (document.hidden) audio.suspend().catch(() => {});
      else if (!S.muted) audio.resume().catch(() => {});
    }
    if (!document.hidden && S.runs.length) { absorb(readStore()); checkDay(); }
  });

  window.addEventListener('resize', resize);
  resize();
  if (PICTURE) posePicture();
  else {
    loadDay(dayNumber(new Date()));
    // No start screen in the way: the page opens on the first box still unsolved,
    // and the title screen is where a finished day (or the home button) leads.
    if (solvedCount() < TIERS.length) S.mode = 'play';
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
