<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Trunk Line — Arkai</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a130a; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; cursor: pointer; }
  canvas:focus-visible { outline: 2px solid rgba(154, 230, 76, 0.5); outline-offset: -2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #controls:focus-within { position: fixed; left: 8px; right: 8px; bottom: 8px; width: auto; height: auto; clip: auto; white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 12px; background: #101c10; border: 1px solid #24391f; }
  #controls button, #controls a { min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; text-decoration: none; padding: 0 12px; border-radius: 10px; border: 1px solid #24391f; background: #172717; color: #eaffe4; font: 600 15px system-ui, sans-serif; }
  #controls a[hidden] { display: none; }
  #controls button:focus, #controls a:focus { outline: 2px solid #9ae64c; }
  #copybox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(4, 10, 4, 0.82); }
  #copybox.open { display: flex; }
  #copybox .card { width: min(92vw, 420px); box-sizing: border-box; padding: 18px; border-radius: 16px; background: #101c10; border: 1px solid #24391f; color: #eaffe4; }
  #copybox p { margin: 0 0 10px; font-size: 15px; line-height: 1.4; }
  #copybox textarea { width: 100%; height: 100px; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #24391f; background: #0a130a; color: #cdf5b8; font: 15px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: none; -webkit-user-select: text; user-select: text; }
  #copybox button { margin-top: 12px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: #9ae64c; color: #0e1c06; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="Trunk Line, a daily network deduction puzzle. Five stations are connected by a hidden wiring tree. Ping any two stations to learn only how many hops separate them, never the path. A ping that answers 1 hop has found a direct line and marks it for you. Mark the four true lines, then check. Letters Q, W, E, D and F select stations A through E; arrow keys move a cursor between stations and Enter selects it. M switches between ping and mark, K checks, X clears your marks, I shows a hint, R replays a solved puzzle for practice, L describes the network, H shows the rules. Comma and period open the previous or next day. Press Tab for buttons."></canvas>
<div id="status" class="sr" aria-live="polite"></div>
<div id="controls" class="sr" role="group" aria-label="Game controls">
  <button type="button" data-act="station0">Select station A</button>
  <button type="button" data-act="station1">Select station B</button>
  <button type="button" data-act="station2">Select station C</button>
  <button type="button" data-act="station3">Select station D</button>
  <button type="button" data-act="station4">Select station E</button>
  <button type="button" data-act="mode">Switch between ping and mark</button>
  <button type="button" data-act="hint">Hint</button>
  <button type="button" data-act="check">Check your marks</button>
  <button type="button" data-act="clear">Clear your marks</button>
  <button type="button" data-act="board">Describe the network</button>
  <button type="button" data-act="help">Rules</button>
  <button type="button" data-act="replay">Replay a solved puzzle for practice</button>
  <button type="button" data-act="next">Next puzzle</button>
  <button type="button" data-act="share">Share result</button>
  <a id="onward" href="#" target="_top" hidden>Play the next daily puzzle</a>
  <button type="button" data-act="card0">Line 1</button>
  <button type="button" data-act="card1">Line 2</button>
  <button type="button" data-act="card2">Line 3</button>
  <button type="button" data-act="mute">Sound on or off</button>
  <button type="button" data-act="home">Title screen</button>
  <button type="button" data-act="prevday">Previous day</button>
  <button type="button" data-act="nextday">Next day</button>
</div>
<div id="copybox" role="dialog" aria-modal="true" aria-labelledby="copytitle">
  <div class="card">
    <p id="copytitle">Your browser would not copy by itself. Select the text below, copy it, and paste it anywhere.</p>
    <textarea id="copytext" readonly></textarea>
    <button id="copyclose" type="button">Done</button>
  </div>
</div>
<script>
(() => {
  'use strict';

  // ---- puzzle core begin ----
  // Everything between the two markers is pure: no DOM, no clock, no storage,
  // no audio. The one promise a daily puzzle makes is that network #N hides
  // the same wiring for everyone, forever. A change here that renumbers or
  // reshapes old days breaks every result anyone has already shared.

  const GAME_SEED = 0x7a17;
  const EPOCH_UTC = Date.UTC(2026, 8, 21);
  const DAY_MS = 86400000;
  const FREEZE_COOLDOWN = 30;

  // n=5, fixed — not a difficulty knob. The offline simulation (IDEA-BACKLOG.md,
  // 2026-09-21, sessions #249 and #254) proved a distance-oracle spanning-tree
  // puzzle has a query floor of Θ(n) regardless of what is asked for, and that
  // narrowing the win-condition (diameter, centroid) does not cut it — only
  // shrinking n does. n=6 already averages 9.2 queries and n=8 averages 14.3,
  // both above the ~8-10 budget Echo Sounding and Bearing shipped with; n=5
  // averages 6.88 with a measured maximum of 8 across 3000 trials, and this
  // build's own exhaustive check (trunk-line.test.mjs, all 5^3=125 labeled
  // trees on 5 nodes, not a sample) confirms every one of them solves and caps
  // the same way. Three independent daily puzzles reuse this one n, rather
  // than faking an Easy/Medium/Hard spread that the mechanic cannot honestly
  // support at any other size.
  const N = 5;
  const STATIONS = ['A', 'B', 'C', 'D', 'E'];
  const TIERS = [
    { name: 'I', label: 'Line 1' },
    { name: 'II', label: 'Line 2' },
    { name: 'III', label: 'Line 3' },
  ];

  // mulberry32 over an FNV-1a mix of the inputs: integer arithmetic only, so
  // every engine draws the same puzzle from the same day.
  function seeded(...parts) {
    let h = 2166136261 >>> 0;
    for (const part of parts) {
      h = Math.imul(h ^ (part & 0xffff), 16777619) >>> 0;
      h = Math.imul(h ^ (part >>> 16), 16777619) >>> 0;
    }
    let a = h | 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Every one of the C(5,2)=10 unordered station pairs, in a fixed enumeration
  // order that doubles as the pair's own index — the unit a ping, a mark, and
  // a saved history token are all recorded against. `pairIndexOf` is the
  // inverse lookup, built once from the same table.
  const PAIRS = [];
  for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) PAIRS.push([a, b]);
  const PAIR_COUNT = PAIRS.length; // 10
  const PAIR_INDEX = Array.from({ length: N }, () => new Array(N).fill(-1));
  PAIRS.forEach(([a, b], i) => { PAIR_INDEX[a][b] = i; PAIR_INDEX[b][a] = i; });
  const pairIndexOf = (a, b) => PAIR_INDEX[a][b];

  /**
   * A uniform-random labeled tree on N stations, via a random Prüfer sequence
   * of length N-2. Cayley's formula makes every one of N^(N-2) labeled trees
   * equally likely, and — unlike Bearing's compass placement or Echo
   * Sounding's reflector layout — decoding a Prüfer sequence never fails, so
   * there is no rejection loop or fallback board here to retry into.
   */
  function randomTreeEdges(rand) {
    const seq = [];
    for (let i = 0; i < N - 2; i++) seq.push(Math.floor(rand() * N));
    const degree = new Array(N).fill(1);
    for (const v of seq) degree[v]++;
    const edges = [];
    for (const v of seq) {
      let leaf = -1;
      for (let i = 0; i < N; i++) { if (degree[i] === 1) { leaf = i; break; } }
      edges.push(leaf < v ? [leaf, v] : [v, leaf]);
      degree[leaf]--; degree[v]--;
    }
    const remaining = [];
    for (let i = 0; i < N; i++) if (degree[i] === 1) remaining.push(i);
    edges.push(remaining[0] < remaining[1] ? remaining : [remaining[1], remaining[0]]);
    return edges;
  }

  /** Every pairwise hop-distance on the hidden tree, by plain BFS from each station — N=5, trivial. */
  function distMatrix(edges) {
    const adj = Array.from({ length: N }, () => []);
    for (const [a, b] of edges) { adj[a].push(b); adj[b].push(a); }
    const dist = Array.from({ length: N }, () => new Array(N).fill(-1));
    for (let s = 0; s < N; s++) {
      dist[s][s] = 0;
      const queue = [s];
      while (queue.length) {
        const u = queue.shift();
        for (const v of adj[u]) if (dist[s][v] === -1) { dist[s][v] = dist[s][u] + 1; queue.push(v); }
      }
    }
    return dist;
  }

  /**
   * The reference solver (IDEA-BACKLOG.md, 2026-09-21, session #249's adaptive
   * greedy reconstruction): ping station 0 against every other station first
   * (N-1 pings, always), bucket every station by that distance-from-root, then
   * for each station one level further out ping the previous level's stations
   * until one comes back at distance 1 — that one is its parent on the hidden
   * tree. `par` is exactly the query count this makes on *this* hidden tree,
   * not a fixed number: a hub-shaped tree finishes in the mandatory first N-1
   * pings, a long chain costs more, and it is the spread across all 125
   * labeled trees on 5 nodes — verified exhaustively in trunk-line.test.mjs,
   * not sampled — that keeps every day inside the ~8-10 budget Echo Sounding
   * and Bearing both shipped with.
   */
  function solveTree(dist) {
    let queries = N - 1;
    const distFromRoot = [0];
    for (let v = 1; v < N; v++) distFromRoot.push(dist[0][v]);
    const byLevel = new Map();
    for (let v = 1; v < N; v++) {
      const d = distFromRoot[v];
      if (!byLevel.has(d)) byLevel.set(d, []);
      byLevel.get(d).push(v);
    }
    const edges = new Set();
    for (const v of byLevel.get(1) || []) edges.add(pairIndexOf(0, v));
    const maxLevel = Math.max(...distFromRoot);
    for (let d = 2; d <= maxLevel; d++) {
      const candidates = byLevel.get(d - 1) || [];
      for (const v of byLevel.get(d) || []) {
        let parent = -1;
        for (const u of candidates) {
          queries++;
          if (dist[v][u] === 1) { parent = u; break; }
        }
        if (parent < 0) return { queries, ok: false, edges: null };
        edges.add(pairIndexOf(v, parent));
      }
    }
    return { queries, ok: true, edges };
  }

  // A straight chain: solveTree always succeeds on it (trunk-line.test.mjs
  // checks all 125 trees, this one included), so it is a safe answer of last
  // resort if a future edit to this file ever breaks that guarantee for some
  // other tree — the same defensive shape as every other daily's fallback
  // board, even though nothing in 125 exhaustively-checked trees needs it.
  const FALLBACK_EDGES = [[0, 1], [1, 2], [2, 3], [3, 4]];

  /** The puzzle for a day and tier: a hidden tree plus the par this exact tree costs the reference solver. */
  function makePuzzle(day, tier) {
    const rand = seeded(GAME_SEED, day, tier);
    const edges = randomTreeEdges(rand);
    const dist = distMatrix(edges);
    const solved = solveTree(dist);
    const finalEdges = solved.ok ? edges : FALLBACK_EDGES;
    const finalDist = solved.ok ? dist : distMatrix(FALLBACK_EDGES);
    const finalSolve = solved.ok ? solved : solveTree(finalDist);
    return {
      day, tier,
      edges: finalEdges,
      dist: finalDist,
      hidden: new Set(finalEdges.map(([a, b]) => pairIndexOf(a, b))),
      par: finalSolve.queries,
    };
  }

  /** True only when the marks are exactly the hidden tree's edges — nothing else survives every ping. */
  function judge(puzzle, marks) {
    if (marks.length !== N - 1) return { ok: false, reason: 'count' };
    return { ok: marks.every((m) => puzzle.hidden.has(m)) };
  }

  /** Every pinged pair's distance, from this run's ping history — later entries win, though a deterministic puzzle always agrees with itself. */
  function pingedMap(p, pings) {
    const map = new Map();
    for (const idx of pings) {
      const [a, b] = PAIRS[idx];
      map.set(idx, p.dist[a][b]);
    }
    return map;
  }

  /**
   * Live hint, level 2: what solveTree's own two-phase algorithm would still
   * want to know next, computed purely from the pairs the player has
   * themselves pinged so far (`known`: pair index -> revealed distance, e.g.
   * from pingedMap). Mirrors solveTree's root fan-out then per-level parent
   * search, but is order-independent — it never assumes the player queried
   * in the reference algorithm's own order, only reads what is already
   * known, so a station whose parent is already pinned down by *any* known
   * distance-1 pair is treated as resolved even if that pair was not the
   * "first" candidate the reference solver would itself have tried.
   * Returns { type: 'pair', a, b } when a specific next ping is forced, or
   * { type: 'phase', phase: 'parent' } once root fan-out is complete but no
   * single next pair is forced by the player's own data — an honest generic
   * nudge instead of a fabricated suggestion.
   */
  function nextHintPing(known) {
    for (let v = 1; v < N; v++) {
      if (!known.has(pairIndexOf(0, v))) return { type: 'pair', a: 0, b: v };
    }
    const distFromRoot = [0];
    for (let v = 1; v < N; v++) distFromRoot.push(known.get(pairIndexOf(0, v)));
    const byLevel = new Map();
    for (let v = 1; v < N; v++) {
      const d = distFromRoot[v];
      if (!byLevel.has(d)) byLevel.set(d, []);
      byLevel.get(d).push(v);
    }
    const maxLevel = Math.max(...distFromRoot);
    for (let d = 2; d <= maxLevel; d++) {
      const candidates = byLevel.get(d - 1) || [];
      for (const v of byLevel.get(d) || []) {
        if (candidates.some((u) => known.get(pairIndexOf(v, u)) === 1)) continue; // parent already pinned down
        const next = candidates.find((u) => !known.has(pairIndexOf(v, u)));
        if (next !== undefined) return { type: 'pair', a: Math.min(v, next), b: Math.max(v, next) };
      }
    }
    return { type: 'phase', phase: 'parent' };
  }

  /**
   * Live hint, level 3: an edge already forced by the player's own pings —
   * never a lookup of the hidden answer. Two ways a pair becomes forced: (1)
   * any pinged pair that came back distance 1 is a direct edge, always true
   * on a tree, no further reasoning needed; (2) once every root ping is in,
   * a station whose only remaining not-yet-ruled-out candidate at the level
   * above it is a single station — that candidate must be its parent by
   * elimination, even when that exact pair was never itself pinged. `marks`
   * are excluded so a hint never just repeats what is already marked.
   * Returns { pair: [a, b] } or null when nothing is forced yet.
   */
  function forcedEdgeHint(known, marks) {
    for (const [idx, d] of known) {
      if (d === 1 && !marks.has(idx)) return { pair: PAIRS[idx] };
    }
    for (let v = 1; v < N; v++) {
      if (!known.has(pairIndexOf(0, v))) return null; // root fan-out incomplete: no elimination yet
    }
    const distFromRoot = [0];
    for (let v = 1; v < N; v++) distFromRoot.push(known.get(pairIndexOf(0, v)));
    const byLevel = new Map();
    for (let v = 1; v < N; v++) {
      const d = distFromRoot[v];
      if (!byLevel.has(d)) byLevel.set(d, []);
      byLevel.get(d).push(v);
    }
    const maxLevel = Math.max(...distFromRoot);
    for (let d = 2; d <= maxLevel; d++) {
      const candidates = byLevel.get(d - 1) || [];
      for (const v of byLevel.get(d) || []) {
        const remaining = candidates.filter((u) => {
          const idx = pairIndexOf(v, u);
          return !(known.has(idx) && known.get(idx) !== 1);
        });
        if (remaining.length === 1) {
          const idx = pairIndexOf(v, remaining[0]);
          if (!marks.has(idx)) return { pair: PAIRS[idx] };
        }
      }
    }
    return null;
  }

  // A history token is a pinged pair's index (0-9), or a failed check: a bare
  // 'x'. Joined by dots, the same convention every other daily on this portal
  // uses for its own move history.
  const tokensOf = (text) => (typeof text === 'string' && text ? text.split('.') : []);
  function costOf(text) {
    return tokensOf(text).reduce((sum, token) => sum + (token[0] === 'x' ? 2 : 1), 0);
  }

  /** What a stored ping history put on screen. Stops at the first entry the game could not have written. */
  function replay(text) {
    const pings = [];
    const kept = [];
    for (const token of tokensOf(text)) {
      const m = /^(x?)(\d{0,2})$/.exec(token);
      if (!m || (!m[1] && !m[2])) break; // only a corrupt store gets here
      if (m[2]) {
        const idx = Number(m[2]);
        if (idx >= PAIR_COUNT) break;
        pings.push(idx);
      }
      kept.push(token);
    }
    return { pings, moves: costOf(kept.join('.')), inputs: kept.join('.') };
  }

  const marksOf = (text) => (typeof text === 'string' && text ? text.split('.').map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n < PAIR_COUNT) : []);

  const PUNCT_KEYS = { Comma: ',', Period: '.' };
  const own = (table, name) => Object.prototype.hasOwnProperty.call(table, name);

  // Stations are selected by physical key position (code), not by the typed
  // character: Q/W/E/D/F sit in one left-hand cluster regardless of layout,
  // the same reasoning bearing/echo-sounding apply to WASD for movement. R is
  // skipped deliberately — it is already this portal's practice-replay key in
  // every other daily, and that convention outranks a tidier Q-W-E-R-T run.
  const STATION_CODES = { KeyQ: 0, KeyW: 1, KeyE: 2, KeyD: 3, KeyF: 4 };

  function readKey(rawCode, rawKey) {
    const code = String(rawCode || ''), key = String(rawKey || '');
    const station = own(STATION_CODES, code) ? STATION_CODES[code] : -1;
    const digit = /^Digit[123]$/.test(code) || (/^Numpad[123]$/.test(code) && /^[123]$/.test(key)) ? Number(code.slice(-1)) - 1 : -1;
    let letter = key.length === 1 ? key.toLowerCase() : key;
    if (/^[\p{L}\p{M}]+$/u.test(key) && /[^\p{Script=Latin}\p{Script=Inherited}\p{Script=Common}]/u.test(key)) {
      if (/^Key[A-Z]$/.test(code)) letter = code.slice(3).toLowerCase();
      else if (own(PUNCT_KEYS, code)) letter = PUNCT_KEYS[code];
    }
    return { station, digit, letter: station >= 0 || digit >= 0 ? '' : letter };
  }

  function dayStep(letter) {
    if (letter === ',' || letter === '<' || letter === '[') return -1;
    if (letter === '.' || letter === '>' || letter === ']') return 1;
    return 0;
  }

  function dayNumber(date) {
    const utc = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return Math.max(1, Math.floor((utc - EPOCH_UTC) / DAY_MS) + 1);
  }

  /**
   * The day named by the archive picker's `?date=YYYY-MM-DD` (see
   * /archive/ and frame-forward.js), or null if the param is absent,
   * malformed, or not a real calendar date. y/m/d are treated as the
   * visitor's own local calendar date, exactly like `dayNumber(new Date())`
   * is at boot — reused via a plain date-like object instead of a real
   * `new Date(y, mo, d)`, which the puzzle core's own purity test below
   * forbids inside this block. Needs no upper/lower bound of its own: a
   * date before day one or after today comes out exactly like never having
   * loaded the param, because `loadDay` already clamps both ends for
   * prevday/nextday.
   */
  function daysInMonth(y, mo) {
    if (mo === 1) return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0) ? 29 : 28;
    return [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][mo];
  }
  function dayFromDateParam(raw) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw || '');
    if (!m) return null;
    const y = Number(m[1]), mo = Number(m[2]) - 1, d = Number(m[3]);
    if (mo < 0 || mo > 11 || d < 1 || d > daysInMonth(y, mo)) return null;
    return dayNumber({ getFullYear: () => y, getMonth: () => mo, getDate: () => d });
  }

  function streakAfter(streak, lastFull, day, today, freezeAvailable) {
    if (day !== today || lastFull >= day) return null;
    if (lastFull === day - 1) return { streak: streak + 1, lastFull: day };
    if (freezeAvailable && lastFull > 0 && lastFull === day - 2) return { streak: streak + 1, lastFull: day, freezeUsed: true };
    return { streak: 1, lastFull: day };
  }

  // day 2 can only reach the freeze branch when lastFull is the never-played sentinel (0), never a real missed day; every stored freezeUsedDay === 2 is that bug's leftover, so it is safe to always clear it on load.
  function cleanFreezeUsedDay(freezeUsedDay) {
    return freezeUsedDay === 2 ? 0 : freezeUsedDay;
  }

  function titleDay(day, date, past) {
    return past ? `Day ${day} · ${date}` : `Day ${day} · three new networks every day`;
  }

  function shareMark(result, par) {
    if (!result) return '⬛';
    const over = result - par;
    if (over < 0) return '⭐' + over;
    if (over === 0) return '⭐';
    if (over <= 2) return '🟢+' + over;
    if (over <= 6) return '🟡+' + over;
    return '🔴+' + over;
  }

  function parNote(moves, par) {
    const over = moves - par;
    return over < 0 ? `★ ${-over} under par` : over === 0 ? '★ par' : `par ${par}, +${over}`;
  }

  function readOnward(fragment, self) {
    const params = new URLSearchParams(String(fragment || '').replace(/^#/, ''));
    const slug = params.get('next') || '', title = params.get('title') || '';
    if (slug === self || !/^[a-z0-9][a-z0-9-]{0,39}$/.test(slug) || !/^[A-Za-z0-9][A-Za-z0-9 '’-]{0,23}$/.test(title)) return null;
    return { slug, title, path: `/games/${slug}/` };
  }

  /**
   * One day's saved results, merged with what this tab holds. Two tabs of the
   * same game write to one store; the later write must not unsolve a puzzle
   * the other tab solved, or lower a count the player already spent. Entries
   * are { i: ping history, g: the player's marks, m: spent, s: spent at the
   * solve or 0, p: par at the solve }.
   */
  function mergeDay(saved, current, mineInputs, mineMarks) {
    return current.map((cur, tier) => {
      const old = (Array.isArray(saved) && saved[tier]) || {};
      const m = Math.max(Number(old.m) || 0, cur.m);
      const oldPath = typeof old.i === 'string' ? old.i : null;
      const oldMarks = typeof old.g === 'string' ? old.g : '';
      if (Number(old.s) > 0) return { i: oldPath ?? cur.i, g: oldPath === null ? cur.g : oldMarks, m, s: Number(old.s), p: Number(old.p) || 0 };
      const oursInputs = !mineInputs || mineInputs[tier] || oldPath === null;
      const oursMarks = !mineMarks || mineMarks[tier] || oldPath === null;

    judge, pingedMap, nextHintPing, forcedEdgeHint, costOf, replay, marksOf, mergeDay, readKey, dayStep, dayNumber, dayFromDateParam, streakAfter, shareMark, parNote, titleDay, readOnward, cleanFreezeUsedDay,

  // within 720..1040 and the frame fills the screen instead.

  let HUB_CY = 372, HUB_R = 148;

    bg: '#0a130a', card: '#101c10',
    surface: '#152618',
    ring: '#1d301a', ringDim: '#24391f',
    accent: '#9ae64c', accentDim: '#33531f', cursor: '#facc15',
    text: '#eaffe4', muted: '#8fae82', good: '#6ee7a8', warn: '#fbbf24', bad: '#f87171',
    pinged: '#4d8a3f',
    warm: '#ffb020', warm2: '#ff7a45', inkWarm: '#1a1000', outlineWarm: '#7a4a08',

  const S = {
    mode: 'title',
    day: 1, today: 1,
    puzzles: [], runs: [], tier: 0, newDay: false,
    selected: null, cursor: 0, tapMode: 'ping', marks: new Set(),
    practice: false, practiceRun: null,

  const emit = (event, data) => {
    if (PICTURE) return; // a photograph is not a play session

  // Said once per page: a frame that throws sixty times a second is one fact, not sixty.
  // Only this page's own script counts (an extension's error is not the game breaking),
  // and the line travels with it: this file ships byte for byte, so the line is exact.
  let crashed = false;
  window.addEventListener('error', (e) => {

  let announceTimer = 0, pending = '';

  };

  let audio = null;

    }

    osc.frequency.setValueAtTime(freq, t);

    gain.gain.linearRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.start(t); osc.stop(t + dur + 0.02);
  };
  const sfx = {
    // Higher hop count, lower pitch — a longer trunk line "sounds" further away.
    ping: (dist) => tone(760 - Math.min(dist, 8) * 60, 0.16, 'sine', 0.045, 0, -40),
    mark: () => tone(520, 0.05, 'square', 0.03),
    unmark: () => tone(340, 0.05, 'square', 0.025),
    bump: () => tone(130, 0.08, 'square', 0.025),
    fail: () => tone(300, 0.3, 'sawtooth', 0.035, 0, -180),
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.045, i * 0.09)),

    mode: () => tone(600, 0.05, 'triangle', 0.03, 0, 80),
  };

  // ---- canvas letterbox ----
  let view = { dpr: 1, cssW: W, cssH: H, scale: 1, ox: 0, oy: 0 };

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    // stretch the layout without bound and a short landscape one keeps a frame

    H = Math.max(H_MIN, Math.min(H_MAX, Math.round((W * cssH) / cssW)));
    // The board sits between the coach line (top) and the status area (bottom);
    // on a short landscape frame it shrinks a little rather than collide with
    // either, and the whole picture still fits the frame with no scroll.
    const boardTop = 270, boardBottom = 120;
    const avail = H - boardTop - boardBottom;

    canvas.height = Math.round(cssH * dpr);

  // ---- helpers ----
  const puzzle = () => S.puzzles[S.tier];
  const run = () => (S.practice ? S.practiceRun : S.runs[S.tier]);
  const solvedCount = () => S.runs.filter((r) => r.solved).length;
  const locked = () => run().solved && !S.practice;
  const archive = () => S.day < S.today;
  const dayDate = (day) => new Date(EPOCH_UTC + (day - 1) * DAY_MS).toLocaleDateString('en-US', { month: 'long', day: 'numeric', timeZone: 'UTC' });

  // ---- onward click plan begin ----

    return 'navigate';
  }

    return event.isTrusted && available && event.button === 1 ? 'count' : 'ignore';
  }

  }
  function countOnward() { emit('next_game', { day: S.day }); }

  }
  const titleSummary = () => `Day ${S.day}${archive() ? `, ${dayDate(S.day)}, from the archive` : ''}. ${solvedCount()} of 3 puzzles solved.`;

  const toast = (message, spoken = message, duration = 2.6) => { S.toast = { text: message, t: 0, duration }; announce(spoken); };
  const shake = (amount) => { if (!calm()) S.shake = amount; };

  function describeState() {
    const p = puzzle(), r = run();
    const map = pingedMap(p, r.pings);
    const pings = map.size ? [...map.entries()].map(([idx, d]) => `${STATIONS[PAIRS[idx][0]]}-${STATIONS[PAIRS[idx][1]]}: ${d}`).join(', ') : 'none yet';
    const marks = S.marks.size ? [...S.marks].map((idx) => `${STATIONS[PAIRS[idx][0]]}-${STATIONS[PAIRS[idx][1]]}`).join(', ') : 'none';
    const sel = S.selected === null ? 'none' : STATIONS[S.selected];
    // The same next step the line over the board shows, for anyone who cannot see it.

  }

  // Level 1 is the same every day, on purpose: it is solveTree's own first
  // phase (ping the root against everyone) restated in plain language, true

  // today's specific network.
  const HINT1_TEXT = 'Ping station A against every other station first — that alone tells you who is one hop away.';
  const HINT2_PARENT_TEXT = 'You know every station’s distance from A now. Ping a station whose parent is still unknown against a station one level closer to A.';

  /** Turns a hint level plus the player's own known distances/marks into on-screen copy. Never reads puzzle.hidden. */
  function hintText(level, known, marks) {
    if (level === 1) return HINT1_TEXT;
    if (level === 2) {
      const next = nextHintPing(known);
      return next.type === 'pair' ? `Try ${STATIONS[next.a]}–${STATIONS[next.b]} next.` : HINT2_PARENT_TEXT;

    if (!forced) return 'Not enough pings yet to force a line — try a few more, then ask again.';
    const [a, b] = forced.pair;

  }

    return S.runs.map((r, tier) => (tier === S.tier && !S.practice ? { i: r.inputs, g: Array.from(S.marks).join('.'), m: r.moves, s: r.solved ? r.solvedMoves : 0, p: r.solved ? r.par : 0 } : entryFor(tier)));

  // A ping proves exactly one thing outright: 1 hop is a direct line, more is
  // not. The game acts on that proof itself — marks the line, or takes back a mark
  // the answer rules out — and says so. Players met the board without it: none of
  // the first sixteen real starts (2026-09-21…23) found how pings become marks.
  function doPing(a, b) {
    const p = puzzle(), r = run();
    const idx = pairIndexOf(a, b);
    const dist = p.dist[a][b];
    const hops = `${dist} hop${dist === 1 ? '' : 's'}`;
    // Asking again tells nothing new, so it costs nothing: the answer is repeated.
    const again = r.pings.includes(idx);

    if (dist === 1) {

      else note = 'a direct line. Clear a wrong mark to add it';
    } else if (S.marks.has(idx)) {
      S.marks.delete(idx);
      note = 'not a direct line, so its mark is gone';
    } else note = 'not a direct line';
    r.marks = new Set(S.marks);
    // A repeat reports the same count: to the portal it is still a move on this puzzle.
    if (!S.practice) { emit('progress', { moves: run().moves, tier: S.tier + 1, day: S.day, archive: archive() }); writeStore(); }
    ensureAudio();
    sfx.ping(dist);
    const said = again ? `${note}. Pinged already, no charge` : note;
    toast(`${STATIONS[a]}–${STATIONS[b]}: ${hops} — ${said}.`, `Pinged ${STATIONS[a]} and ${STATIONS[b]}. ${hops} apart: ${said}.`, 3.2);
  }

  function doMark(a, b) {
    const idx = pairIndexOf(a, b);
    if (S.marks.has(idx)) {
      S.marks.delete(idx);
      sfx.unmark();
      announce(`Unmarked ${STATIONS[a]}–${STATIONS[b]}.`);
    } else {
      // A pair already pinged at 2 hops or more is proven not to be a line: marking
      // it could only buy a wrong check.
      const dist = puzzle().dist[a][b];
      if (dist > 1 && run().pings.includes(idx)) { toast(`${STATIONS[a]}–${STATIONS[b]} pinged ${dist} hops apart — not a direct line.`); sfx.bump(); return; }
      if (S.marks.size >= N - 1) { toast(`Mark up to ${N - 1} lines. Clear one first.`); sfx.bump(); return; }
      S.marks.add(idx);
      sfx.mark();
      announce(`Marked ${STATIONS[a]}–${STATIONS[b]}.`);
    }
    run().marks = new Set(S.marks);
    if (!S.practice) writeStore();
  }

  function selectStation(i) {
    if (S.mode !== 'play' || locked()) return;
    if (S.selected === null) { S.selected = i; sfx.click(); announce(`Selected ${STATIONS[i]}.`); return; }
    if (S.selected === i) { S.selected = null; sfx.click(); announce(`Deselected ${STATIONS[i]}.`); return; }
    const a = S.selected, b = i;
    S.selected = null;
    if (S.tapMode === 'ping') doPing(a, b); else doMark(a, b);
  }

  /**
   * A second, arrow-key path to the same five stations as Q/W/E/D/F, for
   * anyone who reaches for arrows before reading the instructions. `cursor`
   * is a plain highlight, separate from `selected` (the pending first tap of
   * a pair) — moving it never starts or cancels a selection on its own,
   * Enter does, the same two-step shape as a tap or a letter key.
   */
  function moveCursor(delta) {
    if (S.mode !== 'play') return;
    S.cursor = (S.cursor + delta + N) % N;
    sfx.click();
    announce(`Cursor at ${STATIONS[S.cursor]}.`);
  }

  function clearMarks() {
    if (S.mode !== 'play' || locked() || !S.marks.size) return;
    S.marks.clear();
    run().marks = new Set();
    if (!S.practice) writeStore();
    sfx.click();
    announce('Marks cleared.');
  }

  function toggleMute() {
    S.muted = !S.muted;
    storage.set(STORE_MUTE, S.muted ? '1' : '0');
    if (S.muted) { if (audio) audio.suspend().catch(() => {}); } else ensureAudio();
    announce(S.muted ? 'Muted.' : 'Sound on.');
  }

  function celebrate() {
    sfx.win();
    if (!calm()) S.flash = 0.5;
  }

  function solvedNow() {
    const p = puzzle(), r = run();
    if (S.practice) {
      celebrate();
      const over = r.moves - p.par;
      toast(`Practice solved in ${r.moves}. ${over <= 0 ? 'Par!' : `${over} over par.`}`);
      return;
    }
    r.solved = true; r.solvedMoves = r.moves; r.par = p.par;
    writeStore();
    celebrate();
    const over = r.solvedMoves - p.par;
    emit('gameover', { won: true, score: r.solvedMoves, par: p.par, tier: S.tier + 1, day: S.day, archive: archive() });
    const verdict = over < 0 ? `${-over} under par: a very clean trace.` : over === 0 ? 'Par! A star.' : `Solved, ${over} over par.`;
    toast(`${verdict} ${solvedCount() === TIERS.length ? 'All three done.' : 'The next line is ready when you are.'}`);
  }

  function doCheck() {
    if (S.mode !== 'play' || locked()) return;
    const p = puzzle(), r = run();
    const verdict = judge(p, Array.from(S.marks));
    if (verdict.ok) { solvedNow(); return; }
    if (verdict.reason === 'count') { toast(`Mark exactly ${N - 1} lines first.`); sfx.bump(); return; }
    ensureAudio();
    r.inputs = r.inputs ? `${r.inputs}.x` : 'x';
    r.moves += 2;
    if (!S.practice) writeStore();
    toast('Not quite. Ping another pair to narrow it down. Cost 2.');
    sfx.fail(); shake(5);
  }

  function startPractice() {
    if (!run().solved) return;
    // Re-triggering practice (the replay button/key work any time it is
    // active) must not re-emit `practice` on every click — the exact bug
    // session #239 found and fixed in one-step-late/ink-side-down. Computed
    // before S.practice flips, so a second call sees itself already practicing.
    const enteringPractice = !S.practice;
    S.practice = true;
    S.practiceRun = { inputs: '', pings: [], marks: new Set(), moves: 0, solved: false, solvedMoves: 0, par: puzzle().par };
    S.marks = new Set();
    S.selected = null;
    S.hintLevel = 0;
    S.mode = 'play';
    sfx.click();
    if (enteringPractice) emit('practice', { tier: S.tier + 1, day: S.day, archive: archive() });
    announce('Practice run. Nothing here is saved.');
  }

  function goNext() {
    const nextTier = S.runs.findIndex((r, i) => i > S.tier && !r.solved);
    selectTier(nextTier < 0 ? (S.tier + 1) % TIERS.length : nextTier);
    S.mode = 'play';
    markStart();
    sfx.click();
    announce(`${TIERS[S.tier].label}. Par ${puzzle().par}. ${describeState()}`);
    reportFocus();
  }

  function shareText() {
    const marks = S.runs.map((r, tier) => shareMark(r.solvedMoves, S.puzzles[tier].par));
    return `Trunk Line #${S.day}${archive() ? ' (archive)' : ''}\n${marks.join('  ')}\n${SHARE_URL}`;
  }
  function openCopyBox(message) {
    copyText.value = message;
    copyBox.classList.add('open');
    copyText.focus(); copyText.select();
  }
  function share() {
    const message = shareText();
    sfx.click();
    const shared = () => emit('share', { day: S.day, score: solvedCount() });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      // The promise resolves outside every handler: the toast and the copy box
      // both land with no event to draw them, so each callback invalidates first.
      navigator.clipboard.writeText(message).then(
        () => { invalidate(); shared(); toast('Copied! Paste it anywhere.'); },
        () => { invalidate(); openCopyBox(message); },
      );
    } else openCopyBox(message);
  }
  // The dialog is a page element over the canvas, but closing it hands focus back
  // to the canvas: draw the frame so the picture is never left stale.
  copyClose.addEventListener('click', () => {
    invalidate();
    copyBox.classList.remove('open');
    canvas.focus();
  });

  // ---- update ----
  // What advances between frames: the flash of a solve, the shake of a wrong
  // check and the age of the toast. The drawing only reads these, so on a still
  // screen nothing moves and the loop can stop; a hidden tab or the photographer's
  // pose stands still, exactly as the old frame() passed a zero dt to drawEffects().
  function update(dt) {
    if (PICTURE || S.hidden) return;
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 1.5);
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 20);
    if (S.toast) {
      S.toast.t += dt;
      if (S.toast.t >= (S.toast.duration ?? 2.6)) S.toast = null;
    }
  }

  // ---- rendering ----
  let hitRegions = [];
  const addHit = (x, y, w, h, action) => hitRegions.push({ x, y, w, h, action });
  function hitTest(x, y) {
    for (let i = hitRegions.length - 1; i >= 0; i--) {
      const r = hitRegions[i];
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.action;
    }
    return null;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Every control is an object, built like the portal's `.button` (brand-system
  // §4): a 2 px darker outline, a solid darker lip under the body as its own
  // shape (so a press collapses just it), a glossy highlight band over a
  // gradient body, and a display-face label. The one primary action per screen
  // is warm; every other button is flat violet. Pressed = the body sinks onto
  // the lip. The drawn pill may stay smaller than the touch floor; hitBox()
  // pads the tap target independently of what is drawn.
  const LIP = 5;
  const BTN = {
    primary: { hi: '#ffd166', mid: C.warm, lo: C.warm2, outline: C.outlineWarm, lip: C.outlineWarm, ink: C.inkWarm, gloss: 'rgba(255,255,255,.5)' },
    secondary: { hi: '#4a3596', mid: C.violet, lo: C.violetLo, outline: C.violetHi, lip: C.violetLip, ink: '#eef2ff', gloss: C.bevelHi },
  };

  // A tap target at least TOUCH logical px on both axes, centred on the drawn
  // rect so it never drifts and never pushes a neighbour off the board.
  function hitBox(x, y, w, h, action) {
    const hw = Math.max(TOUCH, w), hh = Math.max(TOUCH, h);
    addHit(x + (w - hw) / 2, y + (h - hh) / 2, hw, hh, action);
  }

  // The framed panel (brand-system §4): a 3.5 px accent frame, an inner bevel —
  // a light line on top, a dark line at the bottom — over a surface lighter
  // than the board, so a panel reads as a raised tile, not a hole.
  function panelFrame(x, y, w, h, r = 16) {
    ctx.fillStyle = C.surface; roundRect(x, y, w, h, r); ctx.fill();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3.5; roundRect(x, y, w, h, r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + r + 2, y + 4); ctx.lineTo(x + w - r - 2, y + 4);
    ctx.strokeStyle = C.bevelHi; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + r + 2, y + h - 4); ctx.lineTo(x + w - r - 2, y + h - 4);
    ctx.strokeStyle = C.bevelLo; ctx.lineWidth = 2; ctx.stroke();
  }

  // The title plaque, a warm pill overlapping a panel's top edge (§4).
  function plaque(cx, cy, label) {
    ctx.font = `400 17px ${DISPLAY}`;
    const pw = ctx.measureText(label).width + 34, ph = 30;
    const grad = ctx.createLinearGradient(0, cy - ph / 2, 0, cy + ph / 2);
    grad.addColorStop(0, C.warm); grad.addColorStop(1, C.warm2);
    ctx.fillStyle = grad; roundRect(cx - pw / 2, cy - ph / 2, pw, ph, ph / 2); ctx.fill();
    ctx.strokeStyle = C.outlineWarm; ctx.lineWidth = 2; roundRect(cx - pw / 2, cy - ph / 2, pw, ph, ph / 2); ctx.stroke();
    ctx.fillStyle = C.inkWarm; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, cx, cy + 1);
  }

  function button(x, y, w, h, label, action, kind = 'secondary', enabled = true) {
    const spec = kind === 'primary' ? BTN.primary : BTN.secondary;
    const pressed = enabled && S.pressed === action;
    const bodyY = pressed ? y + LIP : y, bodyH = h - LIP, r = Math.min(14, bodyH / 2);
    // The lip is the body's own shape dropped by LIP, so only its rounded lower
    // edge shows under the body. A LIP-high strip with the body's radius made
    // arcTo overshoot into a tail at the lower right of every button.
    if (!pressed) {
      ctx.fillStyle = enabled ? spec.lip : '#101a0e';
      roundRect(x, y + LIP, w, bodyH, r); ctx.fill();
    }
    const body = ctx.createLinearGradient(0, bodyY, 0, bodyY + bodyH);
    if (enabled) { body.addColorStop(0, spec.hi); body.addColorStop(0.45, spec.mid); body.addColorStop(1, spec.lo); }
    else { body.addColorStop(0, '#1b2a17'); body.addColorStop(1, '#12200f'); }
    ctx.fillStyle = body; roundRect(x, bodyY, w, bodyH, r); ctx.fill();
    const gloss = ctx.createLinearGradient(0, bodyY, 0, bodyY + bodyH);
    gloss.addColorStop(0, enabled ? spec.gloss : 'rgba(255,255,255,.06)');
    gloss.addColorStop(0.5, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss; roundRect(x, bodyY, w, bodyH, r); ctx.fill();
    ctx.strokeStyle = enabled ? spec.outline : C.accentDim; ctx.lineWidth = 2;
    roundRect(x, bodyY, w, bodyH, r); ctx.stroke();
    ctx.fillStyle = !enabled ? C.muted : spec.ink;
    ctx.font = `400 18px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, bodyY + bodyH / 2 + 1);
    if (enabled) hitBox(x, y, w, h, action);
  }

  // Both modes in view, the live one lit. The single button this replaces showed
  // the current mode as its label, so "Ping" read as an action — and pressing it
  // switched to marking.
  function modeSwitch(x, y, w, h) {
    const enabled = !locked(), half = w / 2;
    ctx.fillStyle = C.card; roundRect(x, y, w, h, 12); ctx.fill();
    ctx.fillStyle = enabled ? C.accent : C.accentDim;
    roundRect(S.tapMode === 'ping' ? x : x + half, y, half, h, 12); ctx.fill();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3; roundRect(x, y, w, h, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 12, y + 3); ctx.lineTo(x + w - 12, y + 3);
    ctx.strokeStyle = C.bevelHi; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = `400 16px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ['ping', 'mark'].forEach((m, i) => {
      const on = S.tapMode === m;
      ctx.fillStyle = !enabled ? C.muted : on ? C.inkWarm : C.text;
      ctx.fillText(m === 'ping' ? 'Ping' : 'Mark', x + half * i + half / 2, y + h / 2 + 1);
      if (enabled) hitBox(x + half * i, y, half, h, `mode${m}`);
    });
  }

  // What the pings have proved about the marks: how many of them a 1-hop ping
  // confirmed, a proven line still left unmarked, and a mark a ping has already
  // ruled out — only a save from before 2026-09-23 can hold one (-1: none).
  function proof() {
    let confirmed = 0, unmarked = -1, refuted = -1;
    for (const [idx, dist] of pingedMap(puzzle(), run().pings)) {
      if (dist !== 1) { if (S.marks.has(idx) && refuted < 0) refuted = idx; continue; }
      if (S.marks.has(idx)) confirmed++;
      else if (unmarked < 0) unmarked = idx;
    }
    return { confirmed, unmarked, refuted };
  }
  const pairName = (idx) => `${STATIONS[PAIRS[idx][0]]}–${STATIONS[PAIRS[idx][1]]}`;

  // The line over the board says what to do next, in the order a first game needs
  // it: the goal, how a ping reads, when to press Check. Reads state, writes none.
  function coachLines() {
    if (locked()) return null; // the solved line under the board speaks for itself
    const sel = S.selected === null ? '' : STATIONS[S.selected];
    if (sel && S.tapMode === 'ping') return [`Now tap another station to ping it with ${sel}.`, 'Tap the same station again to cancel.'];
    if (sel && S.marks.size === N - 1) return [`Now tap a station to unmark its line to ${sel}.`, 'All four marks are used: free one to move it.'];
    if (sel) return [`Now tap another station to mark its line to ${sel}.`, 'Tap a marked pair again to unmark it.'];
    // Only a ping proves a mark. Four marks with a guess among them are not an
    // invitation to a check that costs 2 when wrong.
    const { confirmed, unmarked, refuted } = proof();
    const inMark = S.tapMode === 'mark';
    if (refuted >= 0) return [`${pairName(refuted)} is marked, but its ping says it is no line.`, inMark ? 'Tap its two stations to unmark it.' : 'Tap Mark, then its two stations, to unmark it.'];
    if (unmarked >= 0) {
      if (S.marks.size === N - 1) return [`${pairName(unmarked)} is a proven line, but four are marked.`, 'One of them is wrong: unmark it in Mark mode.'];
      return [`${pairName(unmarked)} is a proven line — mark it.`, inMark ? 'Tap its two stations.' : 'Tap Mark, then its two stations.'];
    }
    if (S.marks.size === N - 1) {
      if (confirmed === N - 1) return ['All four lines found — press Check.', 'Every mark is confirmed by a 1-hop ping.'];
      return [`Four lines marked, ${N - 1 - confirmed} not confirmed by a ping.`, 'Sure? Press Check — a wrong one costs 2. Or ping it.'];
    }
    if (S.tapMode === 'mark') return ['Mark mode: tap two stations to mark a line.', 'Marks are free. Tap Ping to measure again.'];
    if (!run().pings.length) return ['Find the four hidden lines.', 'Tap two stations to ping: it says how many hops apart.'];
    return [`${S.marks.size} of ${N - 1} lines marked — keep pinging.`, '1 hop = a line, marked for you. Deduced one? Tap Mark — free.'];
  }

  function iconButton(x, y, w, h, icon, action) {
    ctx.fillStyle = C.surface;
    roundRect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = C.accentDim; ctx.lineWidth = 2; roundRect(x, y, w, h, 10); ctx.stroke();
    const cx = x + w / 2, cy = y + h / 2;
    ctx.strokeStyle = C.text; ctx.fillStyle = C.text; ctx.lineWidth = 2; ctx.lineCap = 'round';
    if (icon === 'home') {
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 1); ctx.lineTo(cx, cy - 8); ctx.lineTo(cx + 8, cy - 1);
      ctx.moveTo(cx - 5, cy - 3); ctx.lineTo(cx - 5, cy + 8); ctx.lineTo(cx + 5, cy + 8); ctx.lineTo(cx + 5, cy - 3);
      ctx.stroke();
    } else if (icon === 'prev' || icon === 'next') {
      // Same chevron the sibling games (One Step Late, Ink Side Down, Blind
      // Corners) draw for day-nav — was bare text here, the one control that
      // didn't get the pill treatment (IDEA-BACKLOG.md/BENCHMARK.md gap #2).
      const back = icon === 'prev' ? 1 : -1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + 5 * back, cy - 11); ctx.lineTo(cx - 6 * back, cy); ctx.lineTo(cx + 5 * back, cy + 11);
      ctx.stroke();
    } else if (icon === 'hint') {
      ctx.font = `800 18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', cx, cy + 1);
    } else {
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy - 3); ctx.lineTo(cx - 5, cy - 3); ctx.lineTo(cx, cy - 8);
      ctx.lineTo(cx, cy + 8); ctx.lineTo(cx - 5, cy + 3); ctx.lineTo(cx - 9, cy + 3);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      if (S.muted) {
        ctx.moveTo(cx + 3, cy - 4); ctx.lineTo(cx + 10, cy + 4);
        ctx.moveTo(cx + 10, cy - 4); ctx.lineTo(cx + 3, cy + 4);
      } else {
        ctx.arc(cx + 2, cy, 5, -0.9, 0.9);
        ctx.moveTo(cx + 6, cy - 8); ctx.arc(cx + 2, cy, 9, -0.9, 0.9);
      }
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    hitBox(x, y, w, h, action);
  }

  function wrapText(text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '', ly = y;
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, ly); line = w; ly += lineH; }
      else line = test;
    }
    if (line) ctx.fillText(line, x, ly);
    return ly;
  }

  function drawTitle() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    addHit(0, 0, W, H, 'titledefault');

    // Three zones of the frame's own height, each allowed to grow with it
    // (brand-system §5): the day row and wordmark up top, the Line cards and
    // the one primary action in the middle, Share/How to play and the footer at
    // the bottom. On any aspect ratio the drawn content spans the frame.
    const third = H / 3;

    iconButton(10, 8, 40, 40, 'mute', 'mute');
    const prevOk = S.day > 1, nextOk = S.day < S.today;
    // Only drawn when navigable — matches the sibling games' dayArrows(), which
    // omit the arrow entirely rather than showing it greyed out.
    if (prevOk) iconButton(10, 64, 40, 40, 'prev', 'prevday');
    if (nextOk) iconButton(W - 10 - 40, 64, 40, 40, 'next', 'nextday');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.muted; ctx.font = `600 15px ${FONT}`;
    ctx.fillText(titleDay(S.day, dayDate(S.day), archive()), 240, 84);

    ctx.fillStyle = C.accent; ctx.font = `400 40px ${DISPLAY}`;
    ctx.fillText('Trunk Line', 240, third * 0.6);
    ctx.fillStyle = C.muted; ctx.font = `400 15px ${FONT}`;
    ctx.fillText('Ping the hidden network. Trace every line.', 240, third * 0.6 + 30);
    ctx.font = `400 13px ${FONT}`;
    ctx.fillText('Five stations, one hidden tree, three networks a day.', 240, third * 0.6 + 52);

    const gap = 12, primaryH = 54;
    const cardH = Math.max(56, Math.min(96, Math.floor((third - primaryH - gap * 3) / 3)));
    const cardTop = third + gap;
    TIERS.forEach((t, tier) => {
      const y = cardTop + tier * (cardH + gap), r = S.runs[tier], p = S.puzzles[tier];
      panelFrame(40, y, 400, cardH, 14);
      ctx.fillStyle = C.text; ctx.font = `400 21px ${DISPLAY}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(t.label, 62, y + cardH * 0.34);
      ctx.fillStyle = C.muted; ctx.font = `400 13px ${FONT}`;
      ctx.fillText(`5 stations · par ${p.par}`, 62, y + cardH * 0.68);
      ctx.textAlign = 'right';
      if (r.solved) {
        ctx.fillStyle = r.solvedMoves - r.par <= 0 ? C.good : C.warn;
        ctx.font = `400 16px ${DISPLAY}`;
        ctx.fillText(parNote(r.solvedMoves, r.par), 418, y + cardH * 0.34);
        ctx.fillStyle = C.muted; ctx.font = `400 12px ${FONT}`;
        ctx.fillText(`${r.solvedMoves} pings spent`, 418, y + cardH * 0.68);
      } else {
        ctx.fillStyle = C.accent; ctx.font = `400 16px ${DISPLAY}`;
        ctx.fillText(r.moves ? 'In progress' : 'Not started', 418, y + cardH * 0.34);
      }
      ctx.textAlign = 'center';
      hitBox(40, y, 400, cardH, `card${tier}`);
    });

    const allDone = solvedCount() === TIERS.length;
    button(40, cardTop + 3 * cardH + 3 * gap, 400, primaryH, allDone ? 'Share' : 'Play', allDone ? 'share' : 'play', 'primary');

    const secY = H - 128; // the row ends at H - 76, clear of the toast (H - 74)
    if (allDone) {
      ctx.fillStyle = S.streak > 0 ? C.good : C.muted; ctx.font = `400 15px ${DISPLAY}`;
      ctx.fillText(S.streak > 0 ? `Streak ${S.streak}${S.bestStreak > S.streak ? ` · best ${S.bestStreak}` : ''}` : 'All three networks solved.', 240, secY - 34);
    }
    // Once the day is done the warm primary above is Share, so the row below
    // keeps How to play alone: one action is never offered twice.
    if (allDone) button(144, secY, 192, 52, 'How to play', 'help', 'secondary');
    else {
      button(40, secY, 192, 52, 'Share', 'share', 'secondary');
      button(248, secY, 192, 52, 'How to play', 'help', 'secondary');
    }
    ctx.fillStyle = C.muted; ctx.font = `400 12px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Missed a day? The arrows above open every earlier one.', 240, H - 40);
    ctx.fillText('Self-contained, no network. Made by an AI agent.', 240, H - 20);
  }

  function drawNetwork() {
    const p = puzzle(), r = run();
    const pinged = pingedMap(p, r.pings);

    for (let idx = 0; idx < PAIR_COUNT; idx++) {
      const [a, b] = PAIRS[idx];
      const pa = stationPoint(a), pb = stationPoint(b);
      const isMark = S.marks.has(idx);
      const dist = pinged.get(idx);
      // Solid is a line the player marked. A ping is a measurement, drawn dashed
      // when it found no direct line: a pinged "3" drawn solid read as a line. A
      // mark its own ping rules out (an old save) is red.
      ctx.strokeStyle = isMark ? (dist > 1 ? C.bad : C.accent) : dist !== undefined ? C.pinged : C.ring;
      ctx.lineWidth = isMark ? 4 : dist !== undefined ? 2 : 1;
      ctx.setLineDash(!isMark && dist > 1 ? [7, 6] : []);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      ctx.setLineDash([]);
      if (dist !== undefined) {
        const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
        ctx.fillStyle = C.card; ctx.beginPath(); ctx.arc(mx, my, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.text; ctx.font = `700 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(dist), mx, my);
      }
    }

    for (let i = 0; i < N; i++) {
      const pt = stationPoint(i);
      const selected = S.selected === i;
      ctx.fillStyle = selected ? C.cursor : C.card;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = selected ? C.cursor : C.accentDim; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = selected ? '#0e1c06' : C.text; ctx.font = `800 18px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(STATIONS[i], pt.x, pt.y + 1);
      // The drawn chip stays 52 px; the tap target grows to the 56 px floor
      // with nothing near to hit (stations are 174 px apart). Audit item 12.
      hitBox(pt.x - 26, pt.y - 26, 52, 52, `station${i}`);
    }

    // The arrow-key cursor: a dashed ring, independent of `selected` (a tap's
    // pending half-pair) — the two can land on the same or different stations.
    if (S.mode === 'play') {
      const cp = stationPoint(S.cursor);
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cp.x, cp.y, 33, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlay() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const p = puzzle(), r = run();

    // Icon buttons 60 px apart, so their padded 56 px hit boxes never touch
    // (brand-system §5).
    iconButton(10, 8, 40, 40, 'home', 'home');
    iconButton(70, 8, 40, 40, 'mute', 'mute');
    iconButton(130, 8, 40, 40, 'hint', 'hint');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = r.moves > p.par ? C.warn : C.text; ctx.font = `700 15px ${FONT}`;
    ctx.fillText(`${r.moves} · par ${p.par}`, 466, 28);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.muted; ctx.font = `600 13px ${FONT}`;
    ctx.fillText(`Day ${S.day} · ${TIERS[S.tier].label}${S.practice ? ' · practice' : ''}`, 314, 28);

    const tabY = 70, tabW = 148, tabH = 36;
    TIERS.forEach((t, tier) => {
      const x = 14 + tier * (tabW + 6), active = tier === S.tier;
      ctx.fillStyle = active ? C.accent : C.card;
      roundRect(x, tabY, tabW, tabH, 8); ctx.fill();
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2; roundRect(x, tabY, tabW, tabH, 8); ctx.stroke();
      ctx.fillStyle = active ? C.inkWarm : C.text; ctx.font = `400 16px ${DISPLAY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.label, x + tabW / 2, tabY + tabH / 2 + 1);
      hitBox(x, tabY, tabW, tabH, `card${tier}`);
    });

    const btnY = 126, btnW = 106, btnH = 48, gap = 6;
    modeSwitch(12, btnY, 120, btnH);
    // Check is the play screen's one primary action; it stays warm and is
    // disabled only once the line is solved.
    button(12 + 120 + gap, btnY, btnW, btnH, 'Check', 'check', 'primary', !locked());
    button(12 + 120 + gap + (btnW + gap), btnY, btnW, btnH, 'Clear', 'clear', 'secondary', !locked());
    button(12 + 120 + gap + (btnW + gap) * 2, btnY, btnW, btnH, 'Share', 'share', 'secondary');

    const coach = coachLines();
    if (coach) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C.accent; ctx.font = `700 16px ${FONT}`;
      ctx.fillText(coach[0], 240, 200);
      if (coach[1]) { ctx.fillStyle = C.text; ctx.font = `400 14px ${FONT}`; ctx.fillText(coach[1], 240, 223); }
    }

    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawNetwork();
    ctx.restore();

    // Neutral: the count of marks is not a verdict. Par has its colour up in the corner.
    ctx.textAlign = 'center'; ctx.font = `400 13px ${FONT}`;
    ctx.fillStyle = C.muted;
    ctx.fillText(`${r.moves} ping${r.moves === 1 ? '' : 's'} · ${S.marks.size} of ${N - 1} lines marked`, 240, HUB_CY + HUB_R + 42);

    if (locked()) drawSuccess(p, r);
  }

  // Success is a panel (brand-system §5) over the action row a solved line no
  // longer needs: the Line tabs above it still switch lines, and the network
  // the player just traced stays in full view below it, undimmed. It holds the
  // result and one warm primary — "Next line", or "Share" once all three are
  // done — with Replay as the secondary; the toast carries the full message.
  // It starts below the tabs' hit boxes (60..116) and ends above the top
  // station's cursor ring on the shortest frame (H 720: 246).
  function drawSuccess(p, r) {
    const dayDone = solvedCount() === TIERS.length;
    const px = 8, pw = W - 16, py = 122, ph = 118;
    panelFrame(px, py, pw, ph, 18);
    addHit(px, py, pw, ph, 'successnone');
    plaque(240, py, dayDone ? 'Day complete' : 'Line solved');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.text; ctx.font = `400 20px ${DISPLAY}`;
    ctx.fillText(`${parNote(r.solvedMoves, r.par)} · ${r.solvedMoves} ping${r.solvedMoves === 1 ? '' : 's'}`, 240, py + 36);
    button(48, py + 56, 176, 52, dayDone ? 'Share' : 'Next line', dayDone ? 'share' : 'next', 'primary');
    button(256, py + 56, 176, 52, 'Replay', 'replay', 'secondary');
  }

  function drawHelp() {
    // The dim and its tap-to-close cover the whole canvas, letterbox included: a
    // dim that stopped at the logical frame left a seam down both of its sides.
    const bx = -view.ox / view.scale, by = -view.oy / view.scale, bw = view.cssW / view.scale, bh = view.cssH / view.scale;
    ctx.fillStyle = 'rgba(4,10,4,0.9)'; ctx.fillRect(bx, by, bw, bh);
    addHit(bx, by, bw, bh, 'closehelp'); // a tap on the dim backdrop closes
    const pw = W - 60, ph = 500, px = 30, py = Math.max(24, (H - ph) / 2);
    panelFrame(px, py, pw, ph, 18);
    addHit(px, py, pw, ph, 'helpnone'); // a tap inside the panel is not a close
    plaque(240, py, 'How to play');
    const lines = [
      'Five stations, A through E, are connected by a',
      'hidden wiring tree — four lines, never shown.',
      'Find all four.',
      '',
      'Ping: tap two stations. The network answers with',
      'how many hops separate them along the hidden',
      'wiring, never which stations the path runs through.',
      '1 hop is a direct line, and it is marked for you.',
      '',
      'Mark: tap Mark, then two stations, to mark a line',
      'you worked out without pinging it. Marks are free.',
      'With four lines marked, press Check.',
      '',
      'Every new ping costs 1; asking again is free. A',
      'wrong check costs 2. Finish within par for a star.',
    ];
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.text; ctx.font = `400 14px ${FONT}`;
    lines.forEach((l, i) => ctx.fillText(l, px + 26, py + 62 + i * 24));
    // A close control — its hit box padded past the drawn pill — for anyone who
    // does not reach for Esc or the backdrop.
    button(px + pw - 20 - 96, py + ph - 66, 96, 46, 'Close', 'closehelp', 'secondary');
  }

  function drawEffects() {
    if (S.flash > 0) { ctx.fillStyle = `rgba(154,230,76,${S.flash * 0.3})`; ctx.fillRect(0, 0, W, H); }
    if (S.toast) {
      ctx.fillStyle = 'rgba(10,19,10,0.92)';
      roundRect(40, H - 74, W - 80, 46, 12); ctx.fill();
      ctx.fillStyle = C.text; ctx.font = `600 14px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      wrapText(S.toast.text, W / 2, H - 51, W - 110, 16);
    }
  }

  function syncOnward() {
    if (!ONWARD) return;
    onwardLink.hidden = !onward();
    if (onward()) { onwardLink.href = ONWARD.path; onwardLink.textContent = `Play ${ONWARD.title}, another daily puzzle`; }
  }

  function render() {
    hitRegions = [];
    ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale, view.dpr * view.ox, view.dpr * view.oy);
    ctx.clearRect(-view.ox / view.scale, -view.oy / view.scale, view.cssW / view.scale, view.cssH / view.scale);
    if (S.mode === 'title') drawTitle();
    else drawPlay();
    if (S.help) drawHelp();
    drawEffects();
    syncOnward();
  }

  // ---- input ----
  // Help remembers the element that had focus when it opened and hands it back,
  // so a keyboard player lands where they left (brand-system §5).
  function openHelp() {
    S.helpReturn = document.activeElement;
    S.help = true;
  }
  function closeHelp() {
    S.help = false;
    const back = S.helpReturn;
    S.helpReturn = null;
    if (back && typeof back.focus === 'function') back.focus();
  }

  function handleAction(action) {
    if (!action) return;
    if (action === 'titledefault' || action === 'play') {
      const first = S.runs.findIndex((r) => !r.solved);
      startPlay(first < 0 ? 0 : first);
      return;
    }
    if (action.startsWith('card')) {
      const tier = Number(action.slice(4));
      if (S.mode === 'title') startPlay(tier);
      else if (S.mode === 'play') setTier(tier);
      return;
    }
    if (action.startsWith('station')) {
      selectStation(Number(action.slice(7)));
      return;
    }
    switch (action) {
      case 'prevday': stepDay(-1); return;
      case 'nextday': stepDay(1); return;
      case 'home': goTitle(); return;
      case 'mute': toggleMute(); return;
      case 'mode': if (!locked()) toggleTapMode(); return;
      case 'modeping': if (!locked() && S.tapMode !== 'ping') toggleTapMode(); return;
      case 'modemark': if (!locked() && S.tapMode !== 'mark') toggleTapMode(); return;
      case 'hint': doHint(); return;
      case 'check': doCheck(); return;
      case 'clear': clearMarks(); return;
      case 'share': share(); return;
      case 'replay': startPractice(); return;
      case 'next': goNext(); return;
      case 'onward': goOnward(); return;
      case 'help': if (S.help) closeHelp(); else openHelp(); return;
      case 'closehelp': closeHelp(); return;
      case 'helpnone': case 'successnone': return; // inside a panel: not a tap-through
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    invalidate();
    canvas.focus();
    const { x, y } = toLogical(e.clientX, e.clientY);
    // Remember what is pressed so its button can sink onto its lip; release()
    // and cancel() clear it. Capturing the pointer keeps the release ours even
    // if the finger leaves the canvas.
    S.pressed = hitTest(x, y);
    handleAction(S.pressed);
    if (e.pointerId !== undefined && canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch { /* not capturable */ }
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    invalidate();
    S.pressed = null;
    if (e.pointerId !== undefined && canvas.releasePointerCapture) {
      try { canvas.releasePointerCapture(e.pointerId); } catch { /* already released */ }
    }
  });

  canvas.addEventListener('pointercancel', () => {
    invalidate();
    S.pressed = null;
  });

  window.addEventListener('keydown', (e) => {
    invalidate();
    const { station, digit, letter } = readKey(e.code, e.key);
    if (station >= 0) { e.preventDefault(); if (S.mode === 'play') selectStation(station); return; }
    if (digit >= 0 && digit < TIERS.length) {
      e.preventDefault();
      if (S.mode === 'title') startPlay(digit);
      else if (S.mode === 'play') setTier(digit);
      return;
    }
    const dayD = dayStep(letter);
    if (dayD && S.mode === 'title') { e.preventDefault(); stepDay(dayD); return; }
    if (S.mode === 'play' && (letter === 'ArrowRight' || letter === 'ArrowDown' || letter === 'ArrowLeft' || letter === 'ArrowUp')) {
      e.preventDefault();
      moveCursor(letter === 'ArrowRight' || letter === 'ArrowDown' ? 1 : -1);
      return;
    }
    if (S.mode === 'play' && letter === 'Enter') { e.preventDefault(); selectStation(S.cursor); return; }
    switch (letter) {
      case ' ':
        e.preventDefault();
        if (S.help) { closeHelp(); return; }
        if (S.mode === 'title') handleAction('titledefault');
        else if (S.mode === 'play' && !locked()) toggleTapMode();
        return;
      case 'm': if (S.mode === 'play' && !locked()) toggleTapMode(); return;
      case 'i': if (S.mode === 'play') doHint(); return;
      case 'k': if (S.mode === 'play') doCheck(); return;
      case 'x': if (S.mode === 'play') clearMarks(); return;
      case 'c': share(); return;
      case 'l': if (S.mode === 'play') announce(describeState()); return;
      case 'h': if (S.help) closeHelp(); else openHelp(); sfx.click(); return;
      case 'r': if (S.mode === 'play') startPractice(); return;
      case 'n': if (S.mode === 'play') goNext(); return;
      case 'Escape':
        if (S.help) { closeHelp(); return; }
        if (S.mode === 'play') goTitle();
        return;
    }
  });

  controls.addEventListener('click', (e) => {
    invalidate();
    const btn = e.target.closest('button,a');
    if (!btn) return;
    const act = btn.dataset.act;
    if (!act) return;
    if (act === 'board') { announce(describeState()); return; }
    if (act === 'help') { if (S.help) closeHelp(); else openHelp(); return; }
    handleAction(act);
  });

  window.addEventListener('resize', resize);
  // A tab shown again is drawn again; a hidden one advances nothing (update()).
  document.addEventListener('visibilitychange', () => {
    invalidate();
    S.hidden = document.hidden;
    if (S.hidden && audio) audio.suspend().catch(() => {});
  });

  // Another tab of this game saved something: take it in, so neither tab
  // overwrites the other's solved puzzles.
  window.addEventListener('storage', (event) => {
    invalidate();
    if (event.key === STORE && S.runs.length) absorb(readStore());
  });

  // self-contained document and may make no request of its own, so the font

  let displayFace = null, displayFaceSettled = false;
  function installDisplayFont() {
    try {
      const bin = atob(FONT_WOFF2);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      displayFace = new FontFace(DISPLAY_FONT, bytes.buffer);
      document.fonts.add(displayFace);
      displayFace.load().catch(() => {}); // a font that will not load just falls back
    } catch { displayFace = null; }
  }

  // ---- run ----
  // A still screen — the title, a board nobody has touched, the help overlay —
  // used to be redrawn sixty times a second. Now it is drawn when something
  // changed, the rule the other dailies follow: every listener and timer that can
  // change the picture calls invalidate() before anything else can return, and the
  // loop owns what no event announces — a running animation (the flash of a solve,
  // the shake of a wrong check, the toast) plus one frame after it ends. A missed
  // invalidate is a frozen game.
  //
  // Trunk Line has no ambient motion: the old clock field was advanced but read by
  // nothing, and is gone. Every write of state now lives in update(dt), which runs
  // every frame and stands still while the tab is hidden or the picture is posed.
  let dirty = true, wasAnimating = false;
  const invalidate = () => { dirty = true; };
  // Only what moves on screen: the flash, the shake, the toast while it is up.
  // A photograph holds still.
  const animating = () => {
    if (PICTURE) return false;
    return S.flash > 0 || S.shake > 0 || !!S.toast;
  };

  let lastT = 0;
  function frame(now) {
    // Booked before anything that can throw: one bad frame must not stop every frame
    // after it and leave the game frozen on its last picture (Pair Flip, 48ad915).
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, lastT ? (now - lastT) / 1000 : 0);
    lastT = now;
    update(dt);
    // The display face loads a hair after the first frame: redraw once when it
    // has settled (loaded or failed), so labels are never left in the fallback.
    if (displayFace && !displayFaceSettled && displayFace.status !== 'unloaded' && displayFace.status !== 'loading') {
      displayFaceSettled = true;
      dirty = true;
    }
    if (!PICTURE) {
      S.dayCheck -= dt;
      if (S.dayCheck <= 0) { S.dayCheck = 5; checkDay(); }
    }
    const live = animating();
    // `wasAnimating` buys one more frame after the last one ends, so the screen
    // never keeps a half-finished animation as its final picture.
    if (dirty || live || wasAnimating) {
      dirty = false;
      render();
      // The generator waits for this before it photographs (POSED_FLAG in
      // picture-flag.mjs) — but only once the display face has settled, so a
      // card is never shot with the fallback lettering.
      if (PICTURE && (!displayFace || displayFaceSettled)) window.__arkaiPosed = true;
    }
    wasAnimating = live;
  }

  // A canvas whose backing store the browser dropped comes back blank.
  canvas.addEventListener('contextrestored', invalidate);
  installDisplayFont();
  resize();
  if (PICTURE) posePicture(); else loadDay(dayFromDateParam(DATE_RAW) ?? dayNumber(new Date()));
  requestAnimationFrame(frame);
})();
