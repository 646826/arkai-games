      case 'gateright': answerGate(1); return;
      case 'gatetone': playGateTone(); return;
      case 'gateskip': skipGate(); return;
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    invalidate();
    canvas.focus();
    const { x, y } = toLogical(e.clientX, e.clientY);
    handleAction(hitTest(x, y));
  });

  window.addEventListener('keydown', (e) => {
    invalidate();
    const holdable = e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD';
    if (e.repeat && !holdable) return;
    const { dir, digit, letter } = readKey(e.code, e.key);
    if (dir === 1 || dir === 3) {
      e.preventDefault();
      if (S.mode === 'play') rotate(dir === 1 ? 1 : -1);
      return;
    }
    if (dir === 0 || dir === 2) return;
    if (digit >= 0 && digit < TIERS.length) {
      e.preventDefault();
      if (S.mode === 'title') startPlay(digit);
      else if (S.mode === 'play') setTier(digit);
      return;
    }
    const dayD = dayStep(letter);
    if (dayD && S.mode === 'title') { e.preventDefault(); stepDay(dayD); return; }
    switch (letter) {
      case ' ':
        e.preventDefault();
        if (S.help) { S.help = false; return; }
        if (S.mode === 'title') handleAction('titledefault');
        else if (S.mode === 'play') doListen();
        return;
      case 'k': if (S.mode === 'play') doCheck(); return;
      case 'x': if (S.mode === 'play') clearMarks(); return;
      case 'c': share(); return;
      case 'l': if (S.mode === 'play') announce(describeState()); return;
      case 'r': if (S.mode === 'play') startPractice(); return;
      case 'h': S.help = !S.help; sfx.click(); return;
      case 'n': if (S.mode === 'play') goNext(); return;
      case 'g': if (S.mode === 'title') openGate(); return;
      case 'Escape':
        if (S.help) { S.help = false; return; }
        if (S.mode === 'gate') { goTitle(); return; }
        if (S.mode === 'play') goTitle();
        return;
    }
  });

  controls.addEventListener('click', (e) => {
    invalidate();
    const btn = e.target.closest('button,a');
    if (!btn) return;
    const act = btn.dataset.act;
    if (!act) return;
    if (act === 'rotateccw') { if (S.mode === 'play') rotate(-1); return; }
    if (act === 'rotatecw') { if (S.mode === 'play') rotate(1); return; }
    if (act === 'describe') { announce(describeState()); return; }
    if (act === 'help') { S.help = !S.help; return; }
    handleAction(act);
  });

  window.addEventListener('resize', resize);
  // A tab shown again is drawn again; a hidden one advances nothing (update()).
  document.addEventListener('visibilitychange', () => {
    invalidate();
    S.hidden = document.hidden;
    // A hidden tab pauses the sound; a listen left running must not resume with it.
    if (S.hidden) stopListening(true);
    if (S.hidden && audio) audio.suspend().catch(() => {});
  });

  // Another tab of this game saved something: take it in, so neither tab
  // overwrites the other's solved puzzles.
  window.addEventListener('storage', (event) => {
    invalidate();
    if (event.key === STORE && S.runs.length) absorb(readStore());
  });

  // ---- run ----
  // A still screen — the title, a board nobody has touched, the help overlay —
  // used to be redrawn sixty times a second. Now it is drawn when something
  // changed, the rule the other dailies follow: every listener and timer that can
  // change the picture calls invalidate() before anything else can return, and the
  // loop owns what no event announces — a running animation (the flash of a solve,
  // the shake of a wrong check, the toast) plus one frame after it ends. A missed
  // invalidate is a frozen game.
  let dirty = true, wasAnimating = false;
  const invalidate = () => { dirty = true; };
  // Only what moves on screen: the flash, the shake, the toast while it is up.
  // The listen highlight steps on its own timers; a photograph holds still.
  const animating = () => {
    if (PICTURE) return false;
    return S.flash > 0 || S.shake > 0 || !!S.toast;
  };

  let lastT = 0;
  function frame(now) {
    // Booked before anything that can throw: one bad frame must not stop every frame
    // after it and leave the game frozen on its last picture (Pair Flip, 48ad915).
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, lastT ? (now - lastT) / 1000 : 0);
    lastT = now;
    update(dt);
    if (!PICTURE) {
      S.dayCheck -= dt;
      if (S.dayCheck <= 0) { S.dayCheck = 5; checkDay(); }
    }
    const live = animating();
    // `wasAnimating` buys one more frame after the last one ends, so the screen
    // never keeps a half-finished animation as its final picture.
    if (dirty || live || wasAnimating) {
      dirty = false;
      render();
      // The generator waits for this before it photographs (POSED_FLAG in picture-flag.mjs).
      if (PICTURE) window.__arkaiPosed = true;
    }
    wasAnimating = live;
  }

  // The day notice's wording follows the pointer; a device that changes it — a
  // tablet mode, a mouse plugged in — redraws a still screen. Registered after
  // invalidate() exists, and only where a media query has addEventListener (old
  // Safari has not).
  if (coarseQuery && coarseQuery.addEventListener) coarseQuery.addEventListener('change', invalidate);
  // A canvas whose backing store the browser dropped comes back blank.
  canvas.addEventListener('contextrestored', invalidate);
  resize();
  if (PICTURE) posePicture(); else loadDay(dayFromDateParam(DATE_RAW) ?? dayNumber(new Date()));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
